<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Başvuru Kütüphanesi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&family=Alegreya+Sans+SC:wght@500;700&family=Caveat:wght@500;600&display=swap">
<style>
/* Layout: tam ekran 3D oda; üstte ince pirinç levhalı HUD, kitap açılınca ortada iki sayfalık cilt. Tek, bilinçli gece görünümü. */
:root {
  color-scheme: dark;
  --night: #0d0a09;          /* oda karanlığı */
  --hud: rgba(22, 16, 13, .82);
  --hud-line: rgba(201, 162, 74, .28);
  --hud-fg: #efe3c8;
  --hud-dim: #b4a587;
  --gold: #c9a24a;
  --gold-hi: #f0d68e;
  --paper: #f1e6cb;
  --paper-deep: #e2d1aa;
  --paper-edge: #c9b285;
  --ink: #23202e;            /* mürekkep: koyu mor-lacivert */
  --ink-soft: #5b5466;
  --leather: #4b1d1d;
  --urgent: #a3262f;
  --open: #3b6e4a;
  --soon: #b07f22;
  --closed: #77706a;
  --f-display: "Cormorant Garamond", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --f-body: "Alegreya", "Iowan Old Style", Georgia, serif;
  --f-label: "Alegreya Sans SC", "Gill Sans", "Trebuchet MS", sans-serif;
  --f-hand: "Caveat", "Segoe Print", "Bradley Hand", cursive;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden; background: var(--night); color: var(--hud-fg);
  font: 16px/1.45 var(--f-body);
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 3px; }

#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#scene.dragging { cursor: grabbing; }
#scene.pointing { cursor: pointer; }

/* ---------- HUD ---------- */
.hud {
  position: fixed; left: 0; right: 0; top: 0; z-index: 5; pointer-events: none;
  display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
  padding: calc(env(safe-area-inset-top, 0px) + 14px) 16px 0;
}
.plate {
  pointer-events: auto; min-width: 0;
  background: linear-gradient(180deg, rgba(40, 29, 22, .9), var(--hud));
  border: 1px solid var(--hud-line); border-radius: 3px;
  box-shadow: 0 10px 30px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,230,170,.08);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
}
.title-plate { padding: 10px 14px 10px; max-width: min(420px, 62vw); }
.title-plate h1 {
  margin: 0; font: italic 600 1.55rem/1.05 var(--f-display); letter-spacing: .01em; color: var(--gold-hi);
  text-wrap: balance;
}
.title-plate .sub { margin-top: 3px; font: 500 .78rem/1.3 var(--f-label); letter-spacing: .08em; color: var(--hud-dim); }
.next-up {
  display: block; width: 100%; margin-top: 8px; padding: 7px 0 0; text-align: left; background: none; border: 0;
  border-top: 1px solid var(--hud-line); font: .86rem/1.3 var(--f-body); color: var(--hud-fg);
}
.next-up b { color: var(--gold-hi); font-weight: 500; }
.next-up .lbl { display: block; font: 500 .7rem/1.2 var(--f-label); letter-spacing: .1em; color: var(--hud-dim); }
.next-up:hover b { text-decoration: underline; text-underline-offset: 3px; }

.hud-actions { display: flex; gap: 8px; pointer-events: auto; flex-shrink: 0; }
.hud-btn {
  display: inline-flex; align-items: center; gap: 7px; padding: 9px 13px;
  font: 700 .82rem/1 var(--f-label); letter-spacing: .1em; color: var(--hud-fg);
}
.hud-btn svg { width: 17px; height: 17px; stroke: var(--gold-hi); fill: none; stroke-width: 1.6; }
.hud-btn:hover { border-color: rgba(240, 214, 142, .6); }
.hud-btn[aria-pressed="true"], .hud-btn[aria-expanded="true"] { color: var(--gold-hi); border-color: rgba(240, 214, 142, .6); }
.view-menu {
  position: fixed; z-index: 8; right: 16px; top: calc(env(safe-area-inset-top, 0px) + 66px); width: min(300px, calc(100% - 32px));
  padding: 6px; display: grid; gap: 2px;
}
.view-menu button {
  display: grid; gap: 2px; text-align: left; padding: 9px 11px; background: none; border: 1px solid transparent; border-radius: 2px;
}
.view-menu button:hover { background: rgba(255, 240, 210, .07); border-color: var(--hud-line); }
.view-menu button[aria-checked="true"] { background: rgba(240, 214, 142, .12); border-color: rgba(240, 214, 142, .45); }
.view-menu b { font: italic 600 1.15rem/1.1 var(--f-display); color: var(--gold-hi); }
.view-menu span { font: .82rem/1.3 var(--f-body); color: var(--hud-dim); }
.mapview { position: fixed; inset: 0; z-index: 16; display: grid; place-items: center; padding: 16px; background: rgba(6, 4, 3, .86); }
.mapview img { max-width: calc(100vw - 32px); max-height: calc(100vh - 32px); width: auto; height: auto; box-shadow: 0 30px 80px rgba(0,0,0,.6); border-radius: 2px; }
.mapview-close { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 14px); right: 16px; width: 42px; height: 42px; border-radius: 50%; background: #2a1d15; }
.fade { position: fixed; inset: 0; z-index: 9; background: #000; opacity: 0; pointer-events: none; transition: opacity .45s ease; }
.fade.on { opacity: 1; }
.joy {
  position: fixed; z-index: 6; left: 20px; bottom: calc(env(safe-area-inset-bottom, 0px) + 22px); width: 116px; height: 116px; border-radius: 50%;
  background: radial-gradient(circle, rgba(30, 22, 16, .35), rgba(20, 14, 10, .6)); border: 1px solid var(--hud-line);
  box-shadow: inset 0 0 0 6px rgba(240, 214, 142, .06); touch-action: none;
}
.joy-knob {
  position: absolute; left: 50%; top: 50%; width: 50px; height: 50px; margin: -25px 0 0 -25px; border-radius: 50%;
  background: radial-gradient(circle at 40% 35%, #f0d68e, #9c7a34); box-shadow: 0 4px 12px rgba(0,0,0,.5); pointer-events: none;
}

.legend {
  position: fixed; left: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); z-index: 5;
  display: flex; gap: 14px; flex-wrap: wrap; padding: 8px 12px; max-width: calc(100% - 32px);
  font: 500 .74rem/1.2 var(--f-label); letter-spacing: .08em; color: var(--hud-dim);
}
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 7px; height: 13px; border-radius: 1px 1px 0 0; display: inline-block; }
.hint {
  position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 64px); z-index: 4; transform: translateX(-50%);
  pointer-events: none; padding: 8px 14px; border-radius: 999px; white-space: nowrap;
  background: rgba(12, 9, 8, .6); color: var(--hud-fg); font: italic .95rem/1.2 var(--f-body);
  transition: opacity .8s ease;
}
.hint.gone { opacity: 0; }

.tooltip {
  position: fixed; z-index: 6; pointer-events: none; left: 0; top: 0; max-width: 280px;
  padding: 8px 11px 9px; border-radius: 2px;
  background: var(--paper); color: var(--ink); box-shadow: 0 8px 24px rgba(0,0,0,.5);
  border-left: 3px solid var(--gold);
  font: .85rem/1.3 var(--f-body); transform: translate(14px, 14px); transition: opacity .15s;
}
.tooltip strong { display: block; font: 600 1.05rem/1.15 var(--f-display); }
.tooltip .tt-status { display: block; margin-top: 4px; font: 700 .7rem/1.2 var(--f-label); letter-spacing: .08em; }

/* ---------- Intro ---------- */
.intro {
  position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; text-align: center;
  background: radial-gradient(ellipse at center, rgba(30, 20, 14, .65), rgba(8, 6, 5, .96) 70%);
  transition: opacity 1.4s ease, visibility 1.4s; padding: 16px;
}
.intro.gone { opacity: 0; visibility: hidden; }
.intro .mark { font: 500 .8rem/1 var(--f-label); letter-spacing: .3em; color: var(--hud-dim); }
.intro h2 { margin: 14px 0 10px; font: italic 600 clamp(2.4rem, 8vw, 4.6rem)/1 var(--f-display); color: var(--gold-hi); text-wrap: balance; }
.intro p { margin: 0; font: italic 1.05rem/1.4 var(--f-body); color: var(--hud-fg); }
.intro .loading { margin-top: 22px; font: 500 .75rem/1 var(--f-label); letter-spacing: .2em; color: var(--hud-dim); }

/* ---------- Katalog çekmecesi ---------- */
.drawer {
  position: fixed; z-index: 12; top: 0; right: 0; bottom: 0; width: min(420px, 100%);
  display: flex; flex-direction: column;
  background: linear-gradient(180deg, #2a1d15, #1c1410); border-left: 1px solid var(--hud-line);
  box-shadow: -20px 0 60px rgba(0,0,0,.55);
  transform: translateX(105%); transition: transform .45s cubic-bezier(.2,.8,.2,1);
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
.drawer.open { transform: none; }
.drawer header { padding: 18px 16px 12px; border-bottom: 1px solid var(--hud-line); }
.drawer header .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.drawer h2 { margin: 0; font: italic 600 1.6rem/1 var(--f-display); color: var(--gold-hi); }
.icon-btn { background: none; border: 1px solid var(--hud-line); border-radius: 3px; width: 36px; height: 36px; display: grid; place-items: center; }
.icon-btn svg { width: 16px; height: 16px; stroke: var(--hud-fg); stroke-width: 1.8; fill: none; }
.search {
  margin-top: 12px; width: 100%; padding: 9px 11px; border-radius: 2px; border: 1px solid var(--hud-line);
  background: rgba(0,0,0,.25); color: var(--hud-fg); font: 1rem/1.2 var(--f-body);
}
.search::placeholder { color: var(--hud-dim); font-style: italic; }
.drawer .scroll { overflow-y: auto; flex: 1; padding: 6px 16px 24px; overscroll-behavior: contain; }
.agenda { margin: 10px 0 6px; padding: 10px 12px; border: 1px dashed var(--hud-line); border-radius: 2px; }
.agenda h3, .cat-group h3 { margin: 0 0 6px; font: 700 .72rem/1.2 var(--f-label); letter-spacing: .14em; color: var(--hud-dim); }
.agenda ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.agenda li button {
  width: 100%; text-align: left; background: none; border: 0; padding: 3px 0; display: grid;
  grid-template-columns: 4.4em 1fr auto; gap: 8px; align-items: baseline; font: .9rem/1.25 var(--f-body);
}
.agenda .d { font-variant-numeric: tabular-nums; color: var(--gold-hi); font-weight: 500; }
.agenda .left { font: 700 .7rem/1 var(--f-label); letter-spacing: .06em; color: var(--hud-dim); white-space: nowrap; }
.cat-group { margin-top: 16px; }
.cat-section { margin: 26px 0 0; padding-bottom: 6px; border-bottom: 1px solid var(--hud-line); display: flex; justify-content: space-between; align-items: baseline; font: italic 600 1.3rem/1 var(--f-display); color: var(--gold-hi); }
.cat-section span { font: 700 .72rem/1 var(--f-label); letter-spacing: .1em; color: var(--hud-dim); }
.cat-group h3 { display: flex; align-items: center; gap: 8px; }
.cat-item {
  width: 100%; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; text-align: left;
  padding: 9px 10px; margin: 0; background: rgba(255, 240, 210, .03); border: 1px solid transparent;
  border-bottom-color: rgba(201,162,74,.12);
}
.cat-item:hover { background: rgba(255, 240, 210, .08); border-color: var(--hud-line); }
.cat-item .n { font: 600 1.08rem/1.15 var(--f-display); color: var(--hud-fg); min-width: 0; }
.cat-item .p { grid-column: 1; font: italic .82rem/1.25 var(--f-body); color: var(--hud-dim); min-width: 0; }
.cat-item .qs { grid-row: 1; grid-column: 2; font: 700 .72rem/1 var(--f-label); letter-spacing: .08em; color: var(--gold); font-variant-numeric: tabular-nums; }
.cat-item .chip { grid-row: 2; grid-column: 2; justify-self: end; }
.chip {
  display: inline-block; padding: 3px 7px 3px; border-radius: 2px; white-space: nowrap;
  font: 700 .64rem/1 var(--f-label); letter-spacing: .08em; color: #fff4e0; background: var(--closed);
}
.chip.open { background: var(--open); }
.chip.urgent { background: var(--urgent); }
.chip.soon { background: var(--soon); }
.chip.unknown { background: transparent; color: var(--hud-dim); border: 1px solid var(--hud-line); }
.flag { display: inline-block; width: 21px; height: 14px; border-radius: 1px; box-shadow: 0 0 0 1px rgba(0,0,0,.25); flex-shrink: 0; vertical-align: -2px; }
.empty-search { margin-top: 18px; font-style: italic; color: var(--hud-dim); }

/* ---------- Okuma: açılan kitap ---------- */
.reader { position: fixed; inset: 0; z-index: 15; display: grid; place-items: center; padding: 16px; }
.reader-backdrop {
  position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(20, 13, 9, .55), rgba(6, 4, 3, .88));
  backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); animation: fade .5s ease both;
}
.tome {
  position: relative; width: min(1000px, 100%); height: min(660px, calc(100% - 96px));
  margin-bottom: 48px; perspective: 2400px;
}
.spread {
  position: absolute; inset: 0; display: grid; grid-template-columns: 1fr 1fr;
  padding: 14px; border-radius: 6px;
  background: linear-gradient(90deg, #3b1717, #5a2222 48%, #2a0f0f 50%, #5a2222 52%, #3b1717);
  box-shadow: 0 40px 90px rgba(0,0,0,.65), 0 0 0 1px rgba(0,0,0,.4);
  animation: spreadIn .9s cubic-bezier(.2,.8,.2,1) both;
}
.page {
  position: relative; min-width: 0; overflow-y: auto; overscroll-behavior: contain;
  background:
    radial-gradient(ellipse at 30% 20%, rgba(255,255,255,.35), transparent 60%),
    radial-gradient(ellipse at 80% 90%, rgba(150,110,50,.12), transparent 55%),
    var(--paper);
  color: var(--ink); padding: 34px 36px 46px;
  scrollbar-width: thin; scrollbar-color: var(--paper-edge) transparent;
}
.page.left { border-radius: 3px 0 0 3px; box-shadow: inset -26px 0 30px -18px rgba(90, 60, 20, .45); }
.page.right { border-radius: 0 3px 3px 0; box-shadow: inset 26px 0 30px -18px rgba(90, 60, 20, .45); }
.folio { position: absolute; bottom: 14px; font: italic .85rem/1 var(--f-display); color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.page.left .folio { left: 36px; }
.page.right .folio { right: 36px; }

.cover-flap {
  position: absolute; top: 0; bottom: 0; left: 50%; width: 50%; transform-origin: left center;
  transform-style: preserve-3d; animation: coverOpen 1.15s cubic-bezier(.55,.05,.25,1) .1s both; z-index: 3;
  pointer-events: none;
}
.cover-flap .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 0 6px 6px 0; }
.cover-flap .front {
  display: grid; place-items: center; text-align: center; padding: 40px;
  background: radial-gradient(ellipse at 40% 30%, rgba(255,255,255,.08), transparent 60%), var(--cover, var(--leather));
  box-shadow: inset 0 0 0 10px rgba(0,0,0,.18), inset 0 0 0 12px rgba(240,214,142,.55), inset 0 0 0 18px rgba(0,0,0,0), inset 0 0 0 19px rgba(240,214,142,.35);
}
.cover-flap .front h3 { margin: 0; font: 600 2rem/1.1 var(--f-display); color: var(--gold-hi); text-shadow: 0 1px 0 rgba(0,0,0,.5); text-wrap: balance; }
.cover-flap .back {
  transform: rotateY(180deg); border-radius: 6px 0 0 6px;
  background:
    repeating-radial-gradient(circle at 20% 30%, #26354f 0 6px, #3a4d6c 6px 9px, #1c2840 9px 14px),
    #26354f;
}
.leaf {
  position: absolute; top: 14px; bottom: 14px; left: 50%; width: calc(50% - 14px); transform-origin: left center; z-index: 4;
  background: linear-gradient(90deg, var(--paper-deep), var(--paper)); border-radius: 0 3px 3px 0;
  box-shadow: 0 0 30px rgba(0,0,0,.25); pointer-events: none;
}
.leaf.fwd { animation: leafFwd .6s cubic-bezier(.45,.05,.3,1) both; }
.leaf.back { left: 14px; transform-origin: right center; border-radius: 3px 0 0 3px; animation: leafBack .6s cubic-bezier(.45,.05,.3,1) both; }
.reader.closing .spread, .reader.closing .reader-backdrop { animation: fadeOut .35s ease both; }
.reader.closing .tome { animation: shrink .35s ease both; }

.reader-nav {
  position: absolute; left: 0; right: 0; bottom: -46px; display: flex; justify-content: center; gap: 10px; z-index: 5;
}
.reader-nav .hud-btn { pointer-events: auto; }
.reader-close { position: absolute; top: -18px; right: -14px; z-index: 6; width: 40px; height: 40px; border-radius: 50%; background: #2a1d15; }

@keyframes fade { from { opacity: 0 } }
@keyframes fadeOut { to { opacity: 0 } }
@keyframes shrink { to { transform: scale(.94); opacity: 0 } }
@keyframes spreadIn { from { transform: scale(.82) translateY(30px); opacity: 0 } }
@keyframes coverOpen { 0% { transform: rotateY(0) } 85% { opacity: 1 } 100% { transform: rotateY(-180deg); opacity: 0 } }
@keyframes leafFwd { from { transform: rotateY(0) } to { transform: rotateY(-180deg) } }
@keyframes leafBack { from { transform: rotateY(0) } to { transform: rotateY(180deg) } }

/* sayfa içeriği */
.eyebrow { display: flex; justify-content: space-between; gap: 10px; font: 700 .7rem/1.2 var(--f-label); letter-spacing: .16em; color: var(--ink-soft); }
.place { margin-top: 22px; display: flex; align-items: center; gap: 10px; font: 700 .82rem/1.2 var(--f-label); letter-spacing: .12em; color: var(--ink-soft); }
.uni-name { margin: 8px 0 0; font: 600 clamp(1.9rem, 3.4vw, 2.7rem)/1.02 var(--f-display); color: var(--ink); text-wrap: balance; }
.program { margin: 10px 0 0; font: italic 1.08rem/1.35 var(--f-body); color: var(--ink-soft); max-width: 32em; }
.fleuron { display: block; margin: 22px auto; width: 140px; height: 16px; color: var(--paper-edge); }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 18px; margin: 0; }
.facts dt { font: 700 .68rem/1.2 var(--f-label); letter-spacing: .14em; color: var(--ink-soft); }
.facts dd { margin: 3px 0 0; font: 500 1.15rem/1.2 var(--f-body); }
.qs-block { margin-top: 26px; display: flex; align-items: flex-end; gap: 16px; }
.qs-seal {
  flex-shrink: 0; width: 112px; height: 112px; border-radius: 50%; display: grid; place-items: center; text-align: center;
  background: radial-gradient(circle at 35% 30%, #c0393f, #861b22 60%, #5e1016);
  color: #fbe7c4; box-shadow: 0 6px 14px rgba(80, 10, 10, .35), inset 0 0 0 5px rgba(0,0,0,.12), inset 0 0 0 7px rgba(251,231,196,.35);
  transform: rotate(-8deg);
}
.qs-seal small { display: block; font: 700 .6rem/1 var(--f-label); letter-spacing: .14em; }
.qs-seal b { display: block; font: 700 2.3rem/1 var(--f-display); font-variant-numeric: tabular-nums; }
.qs-text { font: .95rem/1.35 var(--f-body); color: var(--ink-soft); padding-bottom: 6px; }
.qs-text strong { display: block; font: 700 .7rem/1.2 var(--f-label); letter-spacing: .14em; color: var(--ink); }

.section-h { margin: 0 0 8px; font: 700 .72rem/1.2 var(--f-label); letter-spacing: .16em; color: var(--ink-soft); display: flex; justify-content: space-between; gap: 10px; }
.section + .section { margin-top: 26px; }
.fee { font: 600 2.1rem/1 var(--f-display); font-variant-numeric: tabular-nums; }
.missing { font: italic 1rem/1.35 var(--f-body); color: var(--ink-soft); }
.timeline { position: relative; margin-top: 4px; }
.tl-ends { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.tl-ends div:last-child { text-align: right; }
.tl-ends small { display: block; font: 700 .64rem/1.2 var(--f-label); letter-spacing: .14em; color: var(--ink-soft); }
.tl-ends b { display: block; font: 600 1.35rem/1.15 var(--f-display); font-variant-numeric: tabular-nums; }
.tl-ends em { display: block; font: italic .8rem/1.25 var(--f-body); color: var(--ink-soft); }
.tl-bar { position: relative; margin: 12px 0 10px; height: 6px; border-radius: 3px; background: rgba(35, 32, 46, .12); }
.tl-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--ink); }
.tl-today { position: absolute; top: -5px; width: 2px; height: 16px; background: var(--urgent); }
.tl-today::after { content: "bugün"; position: absolute; top: 18px; left: 50%; transform: translateX(-50%); font: italic .72rem/1 var(--f-body); color: var(--urgent); white-space: nowrap; }
.status-line { margin-top: 24px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font: 1rem/1.3 var(--f-body); }

.todo { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.todo label { display: grid; grid-template-columns: 22px 1fr; gap: 8px; align-items: start; cursor: pointer; font: 500 1.28rem/1.12 var(--f-hand); color: #2c3a6a; }
.todo input { appearance: none; -webkit-appearance: none; margin: 4px 0 0; width: 18px; height: 18px; border: 1.6px solid #2c3a6a; border-radius: 2px; display: grid; place-items: center; cursor: pointer; background: transparent; }

<script type="module">

const DATA = window.LIBRARY_DATA || { universities: [], notes: [] };
const UNIS = DATA.universities;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

const MONTHS = ['oca','şub','mar','nis','may','haz','tem','ağu','eyl','eki','kas','ara'];
const MONTH_NAMES = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const DAY = 864e5;
const today = (() => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); })();

function parseTrDate(s) {
  if (!s) return null;
  const low = s.toLocaleLowerCase('tr');
  const m = low.match(/(?:(\d{1,2})\s+)?(oca|şub|mar|nis|may|haz|tem|ağu|eyl|eki|kas|ara)[a-zçğıöşü]*(\s+ortası)?\s+(\d{4})/);

}

function inDays(n) {
  if (n === 0) return 'bugün';
  if (n === 1) return 'yarın';
  if (n < 0) return `${-n} gün önce`;
  if (n < 60) return `${n} gün sonra`;
  return `~${Math.round(n / 30)} ay sonra`;
}

function statusOf(u) {
  const o = parseTrDate(u.open), c = parseTrDate(u.close);
  const res = { open: o, close: c, kind: 'unknown', label: 'Tarih belirsiz', detail: '', progress: null };
  if (c && daysUntil(c.date) < 0) {
    Object.assign(res, { kind: 'closed', label: 'Kapandı', detail: `Başvurular ${fmtLong(c.date)} tarihinde kapandı.` });
  } else if (o && daysUntil(o.date) > 0) {
    const n = daysUntil(o.date);
    Object.assign(res, { kind: 'soon', label: n < 60 ? `${n} gün sonra açılıyor` : 'Henüz açılmadı', detail: `Başvurular ${o.exact ? fmtLong(o.date) : o.main} tarihinde açılıyor (${inDays(n)}).` });
  } else if (c) {
    const n = daysUntil(c.date);
    const urgent = n <= 21;
    Object.assign(res, {
      kind: urgent ? 'urgent' : 'open',
      label: n === 0 ? 'Bugün kapanıyor' : `Kapanışa ${n} gün`,
      detail: o ? `Başvuru açık. Son gün ${fmtLong(c.date)}.` : `Son gün ${fmtLong(c.date)}.`,
    });
  } else if (o) {
    Object.assign(res, { kind: 'open', label: 'Başvuru açık', detail: `Başvurular ${o.exact ? fmtLong(o.date) : o.main} tarihinde açıldı; kapanış tarihi tabloda yok.` });
  }
  if (o && c) res.progress = Math.min(1, Math.max(0, (today - o.date) / (c.date - o.date)));
  return res;
}
UNIS.forEach(u => { u.status = statusOf(u); });

function parseQS(s) {
  if (!s) return null;
  const n = s.match(/\d+(?:\s*[–-]\s*\d+)?/);

  nl: { type: 'h', c: ['#AE1C28', '#FFFFFF', '#21468B'] },
  fr: { type: 'v', c: ['#0055A4', '#FFFFFF', '#EF4135'] },

    this.brown = buf;
    const wbuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate); const wd = wbuf.getChannelData(0); for (let i = 0; i < len; i++) wd[i] = Math.random() * 2 - 1;

  ambKind: null, ambNodes: [], ambTimer: null,

    out.gain.linearRampToValueAtTime(1, c.currentTime + 2);

    const src = buf => { const s = c.createBufferSource(); s.buffer = buf; s.loop = true; s.start(0, Math.random() * 1.5); nodes.push(s); return s; };
    const filt = (type, f, q = 0.7) => { const b = c.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = q; return b; };
    const gain = v => { const g = c.createGain(); g.gain.value = v; return g; };

    } else if (kind === 'water') {

      const bp = filt('bandpass', 380), g2 = gain(0.05); src(this.white).connect(bp).connect(g2).connect(out); lfo(0.05, 0.03, g2.gain);

      this.ambTimer = setInterval(() => { if (Math.random() < 0.6) this.bubble(out); }, 650);
    } else if (kind === 'space') {

  },

    o.connect(g).connect(out); o.start(t); o.stop(t + 0.1);
  },
  purr() {

    const c = this.ctx, t = c.currentTime, s = c.createBufferSource(); s.buffer = this.brown;
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 260;
    const am = c.createGain(); am.gain.value = 0.5; const o = c.createOscillator(); o.frequency.value = 24; const od = c.createGain(); od.gain.value = 0.5; o.connect(od).connect(am.gain);

  },
  swish(dur = 0.32, from = 3200, to = 900, vol = 0.35) {
    if (!this.on) return;

  },
  thud() {
    if (!this.on) return;
    const t = this.ctx.currentTime, o = this.ctx.createOscillator(); o.type = 'sine';

  },
  toggle() {
    this.init(); if (!this.ctx) return false;
    this.on = !this.on; this.ctx.resume();
    this.master.gain.cancelScheduledValues(this.ctx.currentTime);
    this.master.gain.linearRampToValueAtTime(this.on ? 0.9 : 0, this.ctx.currentTime + 0.6);
    if (this.on) this.setAmbience(this.ambKind); else this.stopAmb();
    return this.on;
  },
};

let seed = 20270901;

function woodGrain(g, w, h, base, vertical = true, lines = 80) {
  g.fillStyle = base; g.fillRect(0, 0, w, h);
  for (let i = 0; i < lines; i++) {
    g.strokeStyle = rand() < 0.5 ? `rgba(0,0,0,${rr(0.04, 0.16)})` : `rgba(255,220,170,${rr(0.02, 0.06)})`;
    g.lineWidth = rr(0.6, 2.4); g.beginPath();
    const p0 = rand() * (vertical ? w : h), amp = rr(1, 6), freq = rr(0.004, 0.02), ph = rand() * 6;
    for (let s = 0; s <= (vertical ? h : w); s += 6) {
      const o = p0 + Math.sin(s * freq + ph) * amp;
      vertical ? g.lineTo(o, s) : g.lineTo(s, o);
    }
    g.stroke();
  }
}

function fitFont(g, text, weight, family, maxW, maxSize) {
  let size = maxSize;
  g.font = `${weight} ${size}px ${family}`;
  const m = g.measureText(text).width;
  if (m > maxW) size = Math.floor(size * maxW / m);

}
function wrapLines(g, text, maxW) {
  const words = text.split(/\s+/); const lines = []; let line = '';

  if (line) lines.push(line);

}

function buildBookcase(cfg) {
  const group = new THREE.Group();
  group.position.set(...cfg.pos); group.rotation.y = cfg.rotY;

  const { W, D, H: Hc } = BC;
  const add = (geo, mat, x, y, z) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); group.add(m); return m; };
  add(new THREE.BoxGeometry(W, Hc, 0.03), backPanelMat, 0, Hc / 2, 0.015);
  for (const sx of [-W / 2 - 0.05, W / 2 + 0.05]) add(new THREE.BoxGeometry(0.1, Hc + 0.05, D + 0.04), woodMat, sx, Hc / 2, D / 2);
  for (const dx of BAY_DIVIDERS) add(new THREE.BoxGeometry(0.05, Hc, D - 0.02), woodMat, dx, Hc / 2, D / 2 - 0.01);
  add(new THREE.BoxGeometry(W + 0.36, 0.12, D + 0.16), woodMat, 0, Hc + 0.06, D / 2 + 0.02);
  add(new THREE.BoxGeometry(W + 0.28, 0.08, D + 0.1), woodDarkMat, 0, Hc + 0.15, D / 2 + 0.01);
  add(new THREE.BoxGeometry(W + 0.2, 0.16, D + 0.06), woodDarkMat, 0, 0.08, D / 2 + 0.01);
  for (const y of SHELF_TOPS.slice(1).concat([Hc])) {
    add(new THREE.BoxGeometry(W, 0.035, D), woodMat, 0, y - 0.0175, D / 2);
  }
  for (const y of SHELF_TOPS) add(new THREE.BoxGeometry(W, 0.07, 0.025), woodMat, 0, y - 0.03, D + 0.0125);
  // pilastrlar
  for (const sx of [-W / 2 - 0.05, W / 2 + 0.05]) add(new THREE.BoxGeometry(0.16, Hc - 0.2, 0.04), woodDarkMat, sx, Hc / 2 + 0.05, D + 0.04);
  bookcases.push({ group, cfg });

}

const byCountry = new Map();
for (const u of UNIS) { if (!byCountry.has(u.country)) byCountry.set(u.country, []); byCountry.get(u.country).push(u); }
const GROUP_LABEL = { ana: 'ANA LİSTE', yedek: 'YEDEKLER' };
const groupOf = u => u.group === 'yedek' ? 'yedek' : 'ana';
const WALLS = [
  { name: 'front', pos: [0, 0, -R], rotY: 0, sets: [], load: 0 },
  { name: 'left', pos: [-R, 0, 0], rotY: Math.PI / 2, sets: [], load: 0 },
  { name: 'right', pos: [R, 0, 0], rotY: -Math.PI / 2, sets: [], load: 0 },
];
{
  const hasBackups = UNIS.some(u => groupOf(u) === 'yedek');
  const plan = hasBackups ? { ana: [WALLS[0], WALLS[1]], yedek: [WALLS[2]] } : { ana: WALLS };
  for (const [g, walls] of Object.entries(plan)) {
    const sets = new Map();
    for (const u of UNIS.filter(u => groupOf(u) === g)) { if (!sets.has(u.country)) sets.set(u.country, []); sets.get(u.country).push(u); }
    [...sets.entries()].sort((a, b) => b[1].length - a[1].length || a[0].localeCompare(b[0], 'tr')).forEach(([c, books]) => {
      const wall = [...walls].sort((a, b) => a.load - b.load)[0];
      wall.sets.push({ country: c, books }); wall.load += books.length; wall.group = g;
    });
  }
  for (const w of WALLS) w.sets.sort((a, b) => a.country.localeCompare(b.country, 'tr'));
}

function layoutWall(wall) {
  const group = buildBookcase(wall);
  const books = wall.sets.flatMap(s => s.books);
  if (wall.group && WALLS.some(w => w.group === 'yedek')) addWallSign(group, GROUP_LABEL[wall.group]);
  const n = books.length;
  const k = Math.min(5, Math.max(1, Math.ceil(n / 4)));
  const rowsForBooks = [3, 2, 1, 4, 0].slice(0, k).sort((a, b) => b - a); // yukarıdan aşağı
  const perRow = rowsForBooks.map((_, i) => Math.floor(n / k) + (i < n % k ? 1 : 0));
  let bi = 0;
  const L = BC.W - 0.04;
  for (let row = 0; row < SHELF_TOPS.length; row++) {
    const ri = rowsForBooks.indexOf(row);
    const rowBooks = ri >= 0 ? books.slice(bi, bi += perRow[ri]) : [];
    const y0 = SHELF_TOPS[row];
    const maxH = (row < SHELF_TOPS.length - 1 ? SHELF_TOPS[row + 1] - 0.035 : BC.H) - y0 - 0.025;
    // dizilim: dolgu kitaplar + (üniversite kitabı, 1-3 dolgu)… ülke değişiminde kitap desteği boşluğu
    const items = [];
    let prevCountry = null;
    rowBooks.forEach((u, i) => {
      if (prevCountry && prevCountry !== u.country) {
        // ülke levhaları çakışmasın diye gruplar arasında yeterli boşluk bırak
        items.push({ gap: 0.06 });
        let sep = 0.06; while (sep < 0.42) { const f = { filler: true, th: rr(0.032, 0.075) }; sep += f.th; items.push(f); }
      }
      items.push({ uni: u });
      const nextSame = rowBooks[i + 1] && rowBooks[i + 1].country === u.country;
      if (nextSame) for (let f = 0, m = 1 + Math.floor(rand() * 3); f < m; f++) items.push({ filler: true });
      prevCountry = u.country;
    });
    const sizeOf = it => it.gap ? it.gap : it.uni ? (it.th ??= rr(0.115, 0.14)) : (it.th ??= rr(0.032, 0.075));
    const coreW = items.reduce((s, it) => s + sizeOf(it), 0);
    const left = [], right = [];
    let lw = 0, rw = 0; const side = (L - coreW) / 2;
    while (lw < side - 0.08) { const it = { filler: true }; lw += sizeOf(it); left.push(it); }
    while (rw < side - 0.08) { const it = { filler: true }; rw += sizeOf(it); right.push(it); }
    // ara sıra yatay kitap yığını
    if (rand() < 0.55) left.splice(Math.floor(rand() * Math.min(6, left.length)), 3, { stack: true, th: 0.3 });
    if (rand() < 0.45) right.splice(Math.max(0, right.length - 1 - Math.floor(rand() * 5)), 3, { stack: true, th: 0.3 });
    const all = [...left, ...items, ...right];
    const total = all.reduce((s, it) => s + sizeOf(it), 0);
    let x = -L / 2 + Math.max(0.01, (L - total) / 2);
    const runs = [];
    for (const it of all) {
      const w = sizeOf(it);
      // bölme duvarına çarpma
      for (const dx of BAY_DIVIDERS) if (x < dx + 0.03 && x + w > dx - 0.03) x = dx + 0.03;
      if (x + w > L / 2) break;
      const cx = x + w / 2;
      if (it.filler) {
        const hgt = Math.min(maxH, rr(0.3, 0.46)), d = rr(0.24, 0.33);
        let lean = 0;
        fillers.push({ group, x: cx, y: y0 + hgt / 2, z: BC.D - 0.035 - d / 2, rotZ: lean, size: [w * 0.97, hgt, d], color: pick(FILLER_COLORS) });
      } else if (it.stack) {
        let yy = y0;
        for (let s = 0; s < 3; s++) {
          const t = rr(0.04, 0.07), len = rr(0.26, 0.3), d = rr(0.22, 0.3);
          fillers.push({ group, x: cx + rr(-0.015, 0.015), y: yy + t / 2, z: BC.D - 0.04 - d / 2, rotZ: Math.PI / 2, size: [t, len, d], color: pick(FILLER_COLORS) });
          yy += t;
        }
      } else if (it.uni) {
        const hgt = Math.min(maxH, rr(0.48, 0.52)), d = rr(0.32, 0.35);
        const mesh = makeUniBook(it.uni, w * 0.97, hgt, d);
        mesh.position.set(cx, y0 + hgt / 2, BC.D - 0.03 - d / 2);
        group.add(mesh);
        mesh.userData.home = { parent: group, pos: mesh.position.clone(), quat: mesh.quaternion.clone() };
        const last = runs[runs.length - 1];
        if (last && last.country === it.uni.country) { last.x1 = cx; } else runs.push({ country: it.uni.country, code: it.uni.code, x0: cx, x1: cx });
      }
      x += w;
    }
    for (const r of runs) {
      const p = new THREE.Mesh(new THREE.PlaneGeometry(0.5, 0.094), new THREE.MeshStandardMaterial({ map: plaqueTexture(r.country.toLocaleUpperCase('tr'), r.code), metalness: 0.6, roughness: 0.38 }));
      p.position.set((r.x0 + r.x1) / 2, y0 - 0.03, BC.D + 0.027);
      group.add(p);
    }
  }
}

function makeUniBook(u, th, h, d) {
  const leather = leatherOf(u);
  const plain = new THREE.MeshStandardMaterial({ color: new THREE.Color(leather).multiplyScalar(0.85), roughness: 0.55 });
  const pages = new THREE.MeshStandardMaterial({ map: pagesTex, color: 0xeadcb8, roughness: 0.9 });
  const spine = new THREE.MeshStandardMaterial({ map: makeSpineTexture(u, th, h), roughness: 0.42, metalness: 0.08, emissive: 0xffc56a, emissiveIntensity: 0 });
  const cover = new THREE.MeshStandardMaterial({ map: makeCoverTexture(u, d, h), roughness: 0.45, metalness: 0.06 });
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(th, h, d), [cover, plain, pages, pages, spine, pages]);
  mesh.userData.uni = u;
  mesh.userData.spine = spine;
  mesh.userData.hover = 0; mesh.userData.pull = 0;
  u.mesh = mesh;
  // durum sekmesi (kitabın üstünden çıkan küçük kâğıt)
  const sc = STATUS_COLORS[u.status.kind];
  if (sc) {

  uniBooks.push(mesh);

}

const CITY_COORDS = {

function cityCoord(city) { if (!city) return null; const k = Object.keys(CITY_COORDS).find(k => city.startsWith(k)); return k ? [k, CITY_COORDS[k]] : null; }
function citiesWithUnis() {

function laea(lat0, lon0) {
  const r = Math.PI / 180, s0 = Math.sin(lat0 * r), c0 = Math.cos(lat0 * r);
  return (lat, lon) => {
    const p = lat * r, l = (lon - lon0) * r, cp = Math.cos(p), sp = Math.sin(p), cl = Math.cos(l);
    const k = Math.sqrt(2 / (1 + s0 * sp + c0 * cp * cl));
    return [k * cp * Math.sin(l), -k * (c0 * sp - s0 * cp * cl)];
  };
}
function drawMap(c, w, h) {
  const geo = window.EUROPE_GEO || [];
  const applied = new Set(UNIS.map(u => COUNTRY_EN[u.country]).filter(Boolean));
  const cities = citiesWithUnis();
  // izdüşüm: Lambert eşalan, merkez Orta Avrupa
  const proj = laea(52, 11);
  const ext = []; for (let lat = 35; lat <= 66; lat += 1) for (const lon of [-11, 33]) ext.push(proj(lat, lon)); for (let lon = -11; lon <= 33; lon += 1) for (const lat of [35, 66]) ext.push(proj(lat, lon));
  const xs = ext.map(p => p[0]), ys = ext.map(p => p[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const pad = 40, sc = Math.min((w - 2 * pad) / (x1 - x0), (h - 2 * pad) / (y1 - y0));
  const ox = (w - (x1 - x0) * sc) / 2, oy = (h - (y1 - y0) * sc) / 2;
  const P = (lat, lon) => { const [x, y] = proj(lat, lon); return [ox + (x - x0) * sc, oy + (y - y0) * sc]; };
  // deniz

  c.fillStyle = sea; c.fillRect(0, 0, w, h);

  c.restore();
  // paralel/meridyenler

  for (let lon = -20; lon <= 40; lon += 5) { c.beginPath(); for (let lat = 30; lat <= 72; lat += 1) { const [x, y] = P(lat, lon); lat === 30 ? c.moveTo(x, y) : c.lineTo(x, y); } c.stroke(); }
  for (let lat = 35; lat <= 70; lat += 5) { c.beginPath(); for (let lon = -25; lon <= 45; lon += 1) { const [x, y] = P(lat, lon); lon === -25 ? c.moveTo(x, y) : c.lineTo(x, y); } c.stroke(); }

  for (const f of geo) if (applied.has(f.n)) for (const r of f.r) { path(r, P); c.strokeStyle = 'rgba(120,45,25,.85)'; c.lineWidth = 2.4; c.stroke(); }
  // ülke adları

  }
  // Benelüks ayrıntı kutusunun ana haritadaki yeri

  c.setLineDash([10, 7]); c.strokeStyle = 'rgba(90,30,20,.85)'; c.lineWidth = 2.5; c.strokeRect(ix0, iy0, ix1 - ix0, iy1 - iy0); c.setLineDash([]);
  // şehirler
  const inInset = ll => ll[1] >= INSET.lon0 && ll[1] <= INSET.lon1 && ll[0] >= INSET.lat0 && ll[0] <= INSET.lat1;

  const subOf = cty => { const m = new Map(); cty.unis.forEach(u => m.set(u.short, (m.get(u.short) || 0) + 1)); if (m.size === 1 && [...m.keys()][0] === cty.name) { const n = cty.unis.length; return n > 1 ? `${n} program` : ''; } return [...m].map(([k, n]) => n > 1 ? `${k} ×${n}` : k).join(', '); };

function buildFillers() {

function waterNormalsTex() {
  const N = 512, c = document.createElement('canvas'); c.width = c.height = N;
  const g = c.getContext('2d'), img = g.createImageData(N, N);
  const waves = [];
  for (let i = 0; i < 28; i++) { const f = 1 + Math.floor(rand() * rand() * 22); const a = rand() * Math.PI * 2; waves.push([Math.round(Math.cos(a) * f), Math.round(Math.sin(a) * f), rr(0, 6.28), 1 / Math.pow(f, 0.9)]); }
  const hx = new Float32Array(N * N);
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) { let s = 0; for (const [kx, ky, ph, a] of waves) s += a * Math.sin(2 * Math.PI * (kx * x + ky * y) / N + ph); hx[y * N + x] = s; }
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const Hh = (xx, yy) => hx[((yy + N) % N) * N + ((xx + N) % N)];
    const dx = Hh(x + 1, y) - Hh(x - 1, y), dy = Hh(x, y + 1) - Hh(x, y - 1);
    let nx = -dx * 2.2, ny = -dy * 2.2, nz = 1; const l = Math.hypot(nx, ny, nz); nx /= l; ny /= l; nz /= l;
    const o = (y * N + x) * 4; img.data[o] = (nx * .5 + .5) * 255; img.data[o + 1] = (ny * .5 + .5) * 255; img.data[o + 2] = (nz * .5 + .5) * 255; img.data[o + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; return t;
}

let roomMeshes = [];
function collectRoomMeshes(exclude) {
  roomMeshes = [];
  for (const o of scene.children) {
    if (o === exclude || o.isLight) continue;
    o.traverse(m => { if ((m.isMesh || m.isPoints || m.isSprite) && !m.isLight) roomMeshes.push(m); });
  }
}
function withRoomHidden(fn) {
  const hidden = [];
  for (const m of roomMeshes) if (m.visible) { m.visible = false; hidden.push(m); }
  try { fn(); } finally { for (const m of hidden) m.visible = true; }
}

function buildOcean(g, cfg) {

  for (let i = 0; i < cp.count; i++) { const u = cp.getX(i) + 0.5, top = cp.getY(i) > 0; const a = -1.15 + u * 0.55, h = top ? 18 + 26 * Math.pow(Math.sin(u * Math.PI), 0.7) * (0.75 + 0.35 * cn(u * 9, 1)) : -40; cp.setXYZ(i, Math.sin(a) * 2400, -26 + h, Math.cos(a) * 2400); }
  const cape = new THREE.Mesh(capeGeo, new THREE.MeshBasicMaterial({ color: 0x6c5c63, fog: false, side: THREE.DoubleSide }));
  g.add(cape);
  // martılar

}

function vnoise2(seed) {
  const h = (x, y) => { const v = Math.sin(x * 127.1 + y * 311.7 + seed * 74.7) * 43758.5453; return v - Math.floor(v); };
  return (x, y) => {
    const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy, ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
    const a = h(ix, iy), b = h(ix + 1, iy), c = h(ix, iy + 1), d = h(ix + 1, iy + 1);
    return (a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy) * 2 - 1;
  };
}

    vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
    fragmentShader: `varying vec2 vUv; uniform float uTime, uSeed;
      void main(){ float x = 1. - abs(vUv.x - .5) * 2.; float k = pow(x, 2.5) * pow(vUv.y, 1.6) * (.5 + .5 * sin(uTime * .3 + uSeed)) * .07;
        gl_FragColor = vec4(vec3(.65, .92, 1.) * k, k); ${GLSL_OUT} }`,
  });
  const rays = [];
  for (let i = 0; i < 14; i++) {
    const m = rayMat.clone(); m.uniforms.uSeed.value = i * 1.7;
    const r = new THREE.Mesh(new THREE.PlaneGeometry(rr(3, 8), 90), m);
    r.position.set(rr(-35, 35), 40, rr(12, 80)); r.rotation.z = rr(-0.22, 0.05); g.add(r); rays.push(r);
  }
  // deniz karı ve kabarcıklar
  const PN = 900, ppos = new Float32Array(PN * 3);
  for (let i = 0; i < PN; i++) { ppos[i * 3] = rr(-20, 20); ppos[i * 3 + 1] = rr(-1.5, 14); ppos[i * 3 + 2] = rr(5.3, 40); }
  const pgeo = new THREE.BufferGeometry(); pgeo.setAttribute('position', new THREE.BufferAttribute(ppos, 3));
  const snow = new THREE.Points(pgeo, new THREE.PointsMaterial({ map: softDotTex, size: 0.05, color: 0xcfeef2, transparent: true, opacity: 0.55, depthWrite: false, fog: true }));
  g.add(snow);
  const BN = 70, bpos = new Float32Array(BN * 3), bsp = [];
  for (let i = 0; i < BN; i++) { bpos[i * 3] = rr(-6, 6); bpos[i * 3 + 1] = rr(-1.5, 14); bpos[i * 3 + 2] = rr(5.4, 9); bsp.push(rr(0.6, 1.5)); }
  const bgeo = new THREE.BufferGeometry(); bgeo.setAttribute('position', new THREE.BufferAttribute(bpos, 3));
  const bubbles = new THREE.Points(bgeo, new THREE.PointsMaterial({ map: softDotTex, size: 0.08, color: 0xe0f8ff, transparent: true, opacity: 0.6, depthWrite: false, fog: true }));
  g.add(bubbles);
  const tmpM = new THREE.Matrix4(), fwdV = new THREE.Vector3(), upV = new THREE.Vector3(), sideV = new THREE.Vector3(), pos = new THREE.Vector3(), sc3 = new THREE.Vector3();
  return (t, dt) => {
    sandMat.uniforms.uTime.value = t; kelpMat.uniforms.uTime.value = t; fishMat.uniforms.uTime.value = t;
    rays.forEach(r => { r.material.uniforms.uTime.value = t; r.rotation.y = Math.atan2(camera.position.x - r.position.x, camera.position.z - r.position.z); });
    fishData.forEach((f, i) => {
      const sc = schools[f.si], a = t * sc.sp - f.lag;
      const sw = Math.sin(t * 0.37 + f.si * 2) * 0.6;
      pos.set(sc.c.x + Math.cos(a) * sc.rx, sc.c.y + Math.sin(a * 2 + sw) * 2, sc.c.z + Math.sin(a) * sc.rz);
      pos.add(f.off).add(sc3.set(Math.sin(t * 0.9 + f.ph) * 0.25, Math.sin(t * 1.3 + f.ph) * 0.15, Math.cos(t * 0.8 + f.ph) * 0.25));
      fwdV.set(-Math.sin(a) * sc.rx, Math.cos(a * 2 + sw) * 4, Math.cos(a) * sc.rz).multiplyScalar(Math.sign(sc.sp)).normalize();
      upV.set(0, 1, 0); sideV.crossVectors(fwdV, upV).normalize(); upV.crossVectors(sideV, fwdV);
      tmpM.makeBasis(fwdV, upV, sideV); sc3.setScalar(f.size); tmpM.scale(sc3); tmpM.setPosition(pos);
      fish.setMatrixAt(i, tmpM);
    });
    fish.instanceMatrix.needsUpdate = true;
    const wt = (t * 2.6) % 520 - 260;
    whale.position.set(wt, 12 + Math.sin(t * 0.15) * 2, 120); whale.rotation.z = Math.sin(t * 0.3) * 0.04;
    const pp = snow.geometry.attributes.position.array;
    for (let i = 0; i < PN; i++) { pp[i * 3 + 1] -= dt * 0.05; pp[i * 3] += Math.sin(t * 0.3 + i) * 0.002; if (pp[i * 3 + 1] < -1.5) pp[i * 3 + 1] = 14; }
    snow.geometry.attributes.position.needsUpdate = true;
    const bp = bubbles.geometry.attributes.position.array;
    for (let i = 0; i < BN; i++) { bp[i * 3 + 1] += bsp[i] * dt; bp[i * 3] += Math.sin(t * 3 + i) * 0.003; if (bp[i * 3 + 1] > 14) bp[i * 3 + 1] = -1.5; }
    bubbles.geometry.attributes.position.needsUpdate = true;
  };
}

function buildSpace(g, cfg) {
  const sunDir = V3(...cfg.sky.sunDir).normalize();
  const landTex = new THREE.TextureLoader().load('dunya-kara.png');
  landTex.colorSpace = THREE.NoColorSpace; landTex.anisotropy = Math.min(8, maxAniso);
  const earthMat = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 }, uSunDir: { value: sunDir }, tLand: { value: landTex } }, fog: false,
    vertexShader: `varying vec3 vObjN; varying vec3 vWN; varying vec3 vWP; varying vec2 vUv;
      void main(){ vUv = uv; vObjN = normal; vWN = normalize(mat3(modelMatrix) * normal); vec4 w = modelMatrix * vec4(position, 1.); vWP = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
    fragmentShader: `${GLSL_NOISE} varying vec3 vObjN; varying vec3 vWN; varying vec3 vWP; varying vec2 vUv; uniform float uTime; uniform vec3 uSunDir; uniform sampler2D tLand;
      float pop(vec2 ll){
        float p = 0.;
        vec3 C[16];
        C[0]=vec3(50.,8.,1.); C[1]=vec3(52.5,-1.,.9); C[2]=vec3(45.,10.,.8); C[3]=vec3(40.,-78.,1.); C[4]=vec3(35.,-118.,.7); C[5]=vec3(41.,-88.,.7);
        C[6]=vec3(19.,-99.,.7); C[7]=vec3(-23.,-46.,.8); C[8]=vec3(7.,5.,.6); C[9]=vec3(30.,31.,.6); C[10]=vec3(39.,33.,.6); C[11]=vec3(24.,79.,1.);
        C[12]=vec3(32.,116.,1.); C[13]=vec3(36.,138.,.9); C[14]=vec3(55.,38.,.6); C[15]=vec3(-7.,110.,.7);
        for (int i = 0; i < 16; i++) { vec2 d = vec2(ll.x - C[i].x, (ll.y - C[i].y) * cos(radians(ll.x))); p += C[i].z * exp(-dot(d, d) / 90.); }
        return p;
      }
      void main(){
        vec3 n = normalize(vObjN);
        vec3 L = texture2D(tLand, vUv).rgb; float land = smoothstep(.35, .65, L.r), coast = L.g;
        float lat = (vUv.y - .5) * 180., lon = vUv.x * 360. - 180.;
        float alat = abs(lat);
        float m1 = fbm3(n * 9.), m2 = fbm3(n * 26. + 3.);
        float desert = exp(-pow((alat - 23.) / 9., 2.)) * smoothstep(.35, .6, m1 + .15);
        vec3 tropic = vec3(.05,.12,.03), temperate = vec3(.12,.16,.07), taiga = vec3(.06,.1,.05), sand = vec3(.62,.5,.32), tundra = vec3(.36,.34,.3);
        vec3 ground = mix(tropic, temperate, smoothstep(15., 35., alat));
        ground = mix(ground, taiga, smoothstep(48., 60., alat));
        ground = mix(ground, tundra, smoothstep(64., 70., alat));
        ground = mix(ground, sand, desert);
        ground *= .8 + .45 * m2;
        float ice = smoothstep(70., 76., alat + m1 * 6.) + smoothstep(62., 66., lat) * smoothstep(-75., -60., lon) * smoothstep(-15., -30., lon);
        ground = mix(ground, vec3(.85,.88,.92), clamp(ice, 0., 1.));
        vec3 ocean = mix(vec3(.005,.025,.08), vec3(.01,.06,.14), m1);
        ocean = mix(ocean, vec3(.03,.16,.2), coast * (1. - land) * .8);
        ocean = mix(ocean, vec3(.75,.82,.9), smoothstep(74., 80., alat + m1 * 5.));
        vec3 base = mix(ocean, ground, land);
        vec3 q = n * 3. + vec3(uTime * .003, 0., uTime * .0015);
        vec3 warp = vec3(fbm3(q + 1.7), fbm3(q + 9.2), fbm3(q + 4.1));
        float cl = fbm3(q * 1.6 + warp * 1.8);
        float belt = .1 * exp(-pow(lat / 8., 2.)) + .08 * exp(-pow((alat - 55.) / 12., 2.)) - .1 * exp(-pow((alat - 25.) / 8., 2.));
        float clouds = smoothstep(.5, .78, cl + belt) * .95;
        vec3 wn = normalize(vWN); float ndl = dot(wn, normalize(uSunDir)); float day = smoothstep(-.12, .2, ndl);
        vec3 v = normalize(cameraPosition - vWP);
        vec3 col = base * max(ndl, 0.) * 1.6;
        vec3 hf = normalize(normalize(uSunDir) + v);
        col += vec3(1., .88, .7) * pow(max(dot(wn, hf), 0.), 90.) * (1. - land) * (1. - clouds) * day * 1.2;
        col = mix(col, vec3(1.) * (max(ndl, 0.) * 1.25 + .02), clouds);
        float city = step(.86, hash13(floor(n * 420.))) * land * (1. - ice) * clamp(pop(vec2(lat, lon)) * 1.4 + .05 * step(.97, hash13(floor(n * 300.) + 7.)), 0., 1.);
        col += vec3(1., .7, .32) * city * (1. - day) * (1. - clouds * .8) * 1.8;
        float rim = pow(1. - max(dot(wn, v), 0.), 2.5);
        col = mix(col, vec3(.35, .6, 1.) * (.1 + .9 * day), rim * .6);
        gl_FragColor = vec4(col, 1.);
        ${GLSL_OUT}
      }`,
  });
  const earth = new THREE.Mesh(new THREE.SphereGeometry(260, 192, 96), earthMat);
  earth.position.set(0, -330, 300); earth.rotation.set(0.35, -2.2, 0.2); g.add(earth);
  const atmo = new THREE.Mesh(new THREE.SphereGeometry(271, 128, 64), new THREE.ShaderMaterial({
    uniforms: { uSunDir: { value: sunDir } }, side: THREE.BackSide, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, fog: false,
    vertexShader: `varying vec3 vWN; varying vec3 vWP; void main(){ vWN = normalize(mat3(modelMatrix) * normal); vec4 w = modelMatrix * vec4(position,1.); vWP = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
    fragmentShader: `varying vec3 vWN; varying vec3 vWP; uniform vec3 uSunDir;
      void main(){ vec3 v = normalize(cameraPosition - vWP); float k = pow(max(0., .58 + dot(vWN, v)), 3.5) * 2.4;
        float day = smoothstep(-.35, .35, dot(-vWN, normalize(uSunDir)));
        vec3 c = mix(vec3(1., .45, .2), vec3(.3, .58, 1.), smoothstep(-.1, .4, dot(-vWN, normalize(uSunDir))));
        gl_FragColor = vec4(c * k * (.12 + .88 * day), 1.); ${GLSL_OUT} }`,
  }));
  atmo.position.copy(earth.position); g.add(atmo);
  const moon = new THREE.Mesh(new THREE.SphereGeometry(16, 64, 32), new THREE.ShaderMaterial({
    uniforms: { uSunDir: { value: sunDir } }, fog: false,
    vertexShader: `varying vec3 vN; varying vec3 vO; void main(){ vO = normal; vN = normalize(mat3(modelMatrix) * normal); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
    fragmentShader: `${GLSL_NOISE} varying vec3 vN; varying vec3 vO; uniform vec3 uSunDir;
      void main(){ float mare = smoothstep(.5, .62, fbm3(vO * 2.2 + 5.)); float c = fbm3(vO * 6.); float cr = smoothstep(.58, .62, fbm3(vO * 14.));
        vec3 base = mix(vec3(.62,.6,.57), vec3(.33,.33,.34), mare) * (.8 + c * .4) - cr * .08;
        gl_FragColor = vec4(base * max(dot(normalize(vN), normalize(uSunDir)), 0.) * 1.5, 1.); ${GLSL_OUT} }`,
  }));
  moon.position.set(-300, 160, 700); g.add(moon);
  const sat = new THREE.Group();
  const metal = new THREE.MeshStandardMaterial({ color: 0xd8d8d8, metalness: 0.8, roughness: 0.3 });
  const panel = new THREE.MeshStandardMaterial({ color: 0x1b3a8a, metalness: 0.5, roughness: 0.25, emissive: 0x0a1a40 });
  sat.add(new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.6, 2.4, 12), metal));
  for (const sx of [-1, 1]) { const pnl = new THREE.Mesh(new THREE.BoxGeometry(4, 0.05, 1.4), panel); pnl.position.x = sx * 2.6; sat.add(pnl); }
  sat.rotation.z = Math.PI / 2; g.add(sat);
  return t => {
    earthMat.uniforms.uTime.value = t; earth.rotation.y = -2.2 + t * 0.004;
    const st = (t * 0.012) % 2;
    sat.position.set(-120 + st * 140, 30 + Math.sin(st * 3) * 6, 90); sat.rotation.x = t * 0.1;
  };
}

function initViews(hemi) {
  viewState.hemi = hemi;
  scene.add(outside); outside.add(sky);
  sunLight.target.position.set(0, 1, 0); scene.add(sunLight, sunLight.target);
  viewState.deck = buildDeck(); outside.add(viewState.deck);
  collectRoomMeshes(outside);
  let first = 'dag';
  try { const s = localStorage.getItem('kutuphane.manzara'); if (VIEWS[s]) first = s; } catch {}
  applyView(first);
}
function applyView(key) {
  const cfg = VIEWS[key];
  if (cfg.build && !viewState.built[key]) {
    const group = new THREE.Group(); outside.add(group);
    viewState.built[key] = { group, update: cfg.build(group, cfg) || (() => {}) };
  }
  for (const k in viewState.built) viewState.built[k].group.visible = k === key;
  const sunDir = V3(...(cfg.sunDir || cfg.sky.sunDir)).normalize();
  backdrop.active = !!cfg.backdrop;
  sky.visible = !!(cfg.backdrop || cfg.sky);
  if (cfg.backdrop) {
    sky.material = backdropDomeMat;
    const u = backdrop.mat.uniforms, b = cfg.bd;
    u.uTerr.value.set(...b.terr); u.uSnowLine.value = b.snow; u.uTreeLine.value = b.tree; u.uFog.value = b.fog;
    u.uMist.value = b.mist || 0; u.uMistH.value = b.mistH || 200; u.uCloudCover.value = b.cloud; u.uWater.value = b.water;
    u.uSunPower.value = b.power; u.uExposure.value = b.exposure; u.uSun.value.copy(sunDir); u.uSkyTop.value.set(...b.top); u.uSkyHor.value.set(...b.hor);
  } else if (cfg.sky) {
    sky.material = skyMat;
    const sk = cfg.sky, u = skyMat.uniforms;
    u.uTop.value.set(sk.top); u.uHor.value.set(sk.hor); u.uBot.value.set(sk.bot); u.uSunDir.value.copy(sunDir);
    u.uSunCol.value.set(sk.sunCol); u.uSunSize.value = sk.sunSize; u.uGlow.value = sk.glow;
    u.uStars.value = sk.stars || 0; u.uGalaxy.value = sk.galaxy || 0; u.uUnder.value = sk.under || 0;
  }
  sunLight.color.set(cfg.light[0]); sunLight.intensity = cfg.light[1];
  sunLight.position.copy(sunDir).multiplyScalar(40);
  if (sunDir.y < 0.5) sunLight.position.y = Math.max(sunLight.position.y, 8);
  viewState.hemi.color.set(cfg.hemi[0]); viewState.hemi.groundColor.set(cfg.hemi[1]); viewState.hemi.intensity = cfg.hemi[2];
  scene.fog = cfg.fog ? new THREE.FogExp2(cfg.fog.color, cfg.fog.density) : null;
  viewState.deck.visible = !!cfg.deck;
  viewState.caustics.visible = !!cfg.caustics;
  viewState.current = key;
  try { localStorage.setItem('kutuphane.manzara', key); } catch {}
  Sound.setAmbience(cfg.sound);
  renderViewMenu();
}
function updateViews(t, dt) {
  sky.position.copy(camera.position);
  skyMat.uniforms.uTime.value = t;
  if (viewState.caustics.visible) viewState.caustics.material.uniforms.uTime.value = t;
  const v = viewState.built[viewState.current]; if (v) v.update(t, dt);
  renderBackdrop(t, dt);
}

const viewBtn = document.getElementById('viewBtn');
const viewMenu = document.getElementById('viewMenu');
const fadeEl = document.getElementById('fade');
function renderViewMenu() {
  document.getElementById('viewName').textContent = VIEWS[viewState.current].name;
  viewMenu.innerHTML = VIEW_KEYS.map(k => `<button role="menuitemradio" aria-checked="${k === viewState.current}" data-view="${k}"><b>${esc(VIEWS[k].name)}</b><span>${esc(VIEWS[k].note)}</span></button>`).join('');
}
function toggleViewMenu(open) {
  open = open ?? viewMenu.hidden;
  viewMenu.hidden = !open; viewBtn.setAttribute('aria-expanded', String(open));
}
viewBtn.addEventListener('click', e => { e.stopPropagation(); toggleViewMenu(); });
document.addEventListener('click', e => { if (!viewMenu.hidden && !e.target.closest('#viewMenu')) toggleViewMenu(false); });
let switching = false;
viewMenu.addEventListener('click', e => {
  const b = e.target.closest('[data-view]'); if (!b || switching) return;
  toggleViewMenu(false);
  const key = b.dataset.view; if (key === viewState.current) return;
  switching = true; fadeEl.classList.add('on');
  setTimeout(() => {
    applyView(key);
    renderer.compile(scene, camera);
    setTimeout(() => { fadeEl.classList.remove('on'); switching = false; }, 150);
  }, reduceMotion ? 0 : 480);
});

const corner = { cat: null, catParts: [], steam: [], plants: [], hearts: [], clock: null };
function buildCorner() {
  // harita: sol duvarda, cama yakın
  {
    const g = new THREE.Group(); g.position.set(-R + 0.02, 2.15, 4.15); g.rotation.y = Math.PI / 2; scene.add(g);

    corner.map = g;
  }
  // duvar saati: sağ duvarda (gerçek saati gösterir)
  {
    const g = new THREE.Group(); g.position.set(R - 0.02, 2.6, 4.25); g.rotation.y = -Math.PI / 2; scene.add(g);
    const faceTex = canvasTex(512, 512, (c, w) => {

const player = { pos: new THREE.Vector3(0, 0, 2.5), vel: new THREE.Vector3(), bob: 0 };

const OBST = [{ x: 0, z: 0, r: 0.95 }, { x: 2.85, z: 3.45, r: 0.72 }, { x: 4.35, z: 3.7, r: 0.3 }, { x: 1.85, z: 4.05, r: 0.36 }, { x: -4.3, z: 4.45, r: 0.5 }, { x: -2.55, z: 4.55, r: 0.35 }, { x: 4.4, z: -4.45, r: 0.4 }, { x: -4.4, z: -4.45, r: 0.4 }];
const BOUNDS = { x: 4.05, zMin: -4.02, zMax: 4.55 };
function clampBounds(p) { p.x = THREE.MathUtils.clamp(p.x, -BOUNDS.x, BOUNDS.x); p.z = THREE.MathUtils.clamp(p.z, BOUNDS.zMin, BOUNDS.zMax); }

  for (const o of OBST) { const dx = p.x - o.x, dz = p.z - o.z, d = Math.hypot(dx, dz); if (d < o.r) { const k = o.r / (d || 1e-4); p.x = o.x + (d ? dx : 1) * k; p.z = o.z + dz * k; } }
  clampBounds(p);
}
function planPath(a, b) {
  const pts = [], abx = b.x - a.x, abz = b.z - a.z, L2 = abx * abx + abz * abz || 1e-6;
  const t = THREE.MathUtils.clamp(-(a.x * abx + a.z * abz) / L2, 0, 1);
  const cx = a.x + abx * t, cz = a.z + abz * t, dc = Math.hypot(cx, cz);
  if (dc < 1.15 && t > 0.02 && t < 0.98) { let nx = cx, nz = cz; if (dc < 1e-3) { nx = -abz; nz = abx; } const nl = Math.hypot(nx, nz); pts.push(new THREE.Vector3(nx / nl * 1.5, 0, nz / nl * 1.5)); }
  pts.push(b.clone()); return pts;
}
function walkTo(dest, look, done) {
  const d = dest.clone(); d.y = 0; collide(d);
  autoWalk = { pts: planPath(player.pos, d), look: look ? look.clone() : null, done };
  marker.position.set(d.x, 0.012, d.z); marker.userData.t = 0; marker.visible = !look;
}
function standSpot(book) {
  const wp = book.getWorldPosition(new THREE.Vector3());
  const n = new THREE.Vector3(0, 0, 1).applyQuaternion(book.userData.home.parent.getWorldQuaternion(new THREE.Quaternion()));
  const d = wp.clone().addScaledVector(n, 1.75); d.y = 0; collide(d); return d;
}
const marker = new THREE.Mesh(new THREE.RingGeometry(0.16, 0.22, 40), new THREE.MeshBasicMaterial({ color: 0xf0d68e, transparent: true, opacity: 0, depthWrite: false }));

function updatePlayer(dt) {
  const canMove = state === 'idle' || state === 'walking';
  let fx = 0, sx = 0;
  if (canMove && !drawer.classList.contains('open')) {
    if (keys.has('ArrowLeft')) view.yaw += 1.8 * dt;
    if (keys.has('ArrowRight')) view.yaw -= 1.8 * dt;
    fx += (keys.has('KeyW') || keys.has('ArrowUp') ? 1 : 0) - (keys.has('KeyS') || keys.has('ArrowDown') ? 1 : 0);
    sx += (keys.has('KeyD') ? 1 : 0) - (keys.has('KeyA') ? 1 : 0);
    fx -= joy.y; sx += joy.x;
  }
  const mag = Math.hypot(fx, sx); if (mag > 1) { fx /= mag; sx /= mag; }
  const speed = (keys.has('ShiftLeft') || keys.has('ShiftRight') ? 3.4 : 1.9);
  const fX = -Math.sin(view.yaw), fZ = -Math.cos(view.yaw), rX = Math.cos(view.yaw), rZ = -Math.sin(view.yaw);
  let tx = (fX * fx + rX * sx) * speed, tz = (fZ * fx + rZ * sx) * speed;
  if (mag > 0.05) { if (autoWalk) { autoWalk = null; if (state === 'walking') state = 'idle'; } dismissHint(); }
  if (autoWalk && canMove) {
    const tg = autoWalk.pts[0], dx = tg.x - player.pos.x, dz = tg.z - player.pos.z, d = Math.hypot(dx, dz);
    if (d < 0.05) {
      autoWalk.pts.shift();
      if (!autoWalk.pts.length) { const done = autoWalk.done; autoWalk = null; tx = tz = 0; player.vel.set(0, 0, 0); if (done) done(); }
    } else { const sp = Math.min(2.3, d * 3 + 0.35); tx = dx / d * sp; tz = dz / d * sp; }
    if (autoWalk && autoWalk.look) { const a = Math.atan2(-(autoWalk.look.x - player.pos.x), -(autoWalk.look.z - player.pos.z)); view.yaw += (shortestYaw(view.yaw, a) - view.yaw) * Math.min(1, dt * 3); }
  }
  if (!canMove) { tx = tz = 0; }
  const k = Math.min(1, dt * 9); player.vel.x += (tx - player.vel.x) * k; player.vel.z += (tz - player.vel.z) * k;
  player.pos.x += player.vel.x * dt; player.pos.z += player.vel.z * dt;
  autoWalk ? clampBounds(player.pos) : collide(player.pos);
  const sp = Math.hypot(player.vel.x, player.vel.z); player.bob += sp * dt * 5.2;
  camera.position.set(player.pos.x, 1.62 + Math.sin(player.bob) * 0.02 * Math.min(1, sp / 1.9), player.pos.z);
  if (marker.userData.t < 2) { marker.userData.t += dt; const m = marker.userData.t; marker.material.opacity = Math.max(0, 0.9 - m * 0.6) * (autoWalk ? 1 : 0.6); marker.scale.setScalar(1 + m * 0.4); }
}

const pointers = new Map();
let drag = null, pinchStart = null;
canvas.addEventListener('pointerdown', e => {
  try { canvas.setPointerCapture(e.pointerId); } catch {}
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()]; pinchStart = { d: Math.hypot(a.x - b.x, a.y - b.y), zoom: view.zoom }; drag = null; return;
  }
  drag = { x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY, moved: 0, t: performance.now(), type: e.pointerType };
});
canvas.addEventListener('pointermove', e => {
  if (pointers.has(e.pointerId)) pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinchStart && pointers.size === 2) {
    const [a, b] = [...pointers.values()]; const d = Math.hypot(a.x - b.x, a.y - b.y);
    view.zoom = THREE.MathUtils.clamp(pinchStart.zoom * d / pinchStart.d, 1, 2.4); return;
  }
  if (drag && state === 'idle') {
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    drag.moved += Math.abs(dx) + Math.abs(dy);
    drag.x = e.clientX; drag.y = e.clientY;
    if (drag.moved > 6) {
      canvas.classList.add('dragging');
      const k = 0.0042 / view.zoom;
      view.vyaw = dx * k; view.vpitch = dy * k;
      view.yaw += dx * k; view.pitch = THREE.MathUtils.clamp(view.pitch + dy * k, -0.75, 0.6);
      introTurn = false; dismissHint(); setHover(null);
    }
    return;
  }
  if (e.pointerType === 'mouse' && state === 'idle') updateHover(e.clientX, e.clientY);
});
function endPointer(e) {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinchStart = null;
  canvas.classList.remove('dragging');
  if (drag && drag.moved <= 6 && state === 'idle' && e.type === 'pointerup') {
    const hit = pickBook(e.clientX, e.clientY);
    if (hit) { dismissHint(); openBook(hit); }
    else if (pickCat(e.clientX, e.clientY)) petCat();
    else if (pickMap(e.clientX, e.clientY)) showMap();
    else {
      const fp = pickFloor(e.clientX, e.clientY);
      if (fp) { dismissHint(); walkTo(fp, null, null); }
    }

}

function faceBook(book, instant, done) {

const fwd = new THREE.Vector3(), up = new THREE.Vector3();

}

  const pulled = pos.clone(); pulled.z += 0.38;
  const wp = pulled.applyMatrix4(parent.matrixWorld);
  const wq = parent.getWorldQuaternion(new THREE.Quaternion()).multiply(quat);

}

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.userData.baseFov = w / h < 0.8 ? 74 : w / h < 1.2 ? 66 : 58;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);

const clock = new THREE.Clock();
let introT = 0, introClock = 0, introTurn = !reduceMotion;
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  for (let i = tweens.length - 1; i >= 0; i--) {

    tw.update(tw.fn(k));
    if (k >= 1) { tweens.splice(i, 1); tw.done && tw.done(); }
  }
  if (view.inertia && !drag && (state === 'idle' || state === 'walking')) {
    view.yaw += view.vyaw; view.pitch = THREE.MathUtils.clamp(view.pitch + view.vpitch, -0.75, 0.6);
    view.vyaw *= 0.92; view.vpitch *= 0.92;
    if (Math.abs(view.vyaw) + Math.abs(view.vpitch) < 1e-4) view.inertia = false;
  }

  }
  if (introTurn) {

    const k = THREE.MathUtils.clamp((introClock - 2.2) / 4.2, 0, 1);
    view.yaw = Math.PI * (1 - ease.inOut(k));
    if (k >= 1) introTurn = false;
  }
  camera.fov = (camera.userData.baseFov || 58) / view.zoom;
  camera.updateProjectionMatrix();
  camera.rotation.set(view.pitch, view.yaw, 0);

  // kitapların hover/parlama animasyonu
  for (const b of uniBooks) {
    if (b === activeBook && state !== 'idle') continue;
    const target = b === hovered ? 1 : 0;
    b.userData.hover += (target - b.userData.hover) * Math.min(1, dt * 10);
    if (b.parent !== scene) b.position.z = b.userData.home.pos.z + b.userData.hover * 0.08;
    const shimmer = Math.max(0, Math.sin(t * 0.9 - b.userData.uni.id * 0.55)) ** 18 * 0.25;
    b.userData.spine.emissiveIntensity = b.userData.hover * 0.22 + shimmer;
  }
  updatePlayer(dt);
  updateViews(t, dt);
  updateCorner(t, dt);
  const cf = 1 + Math.sin(t * 17 + 2) * 0.05 + (Math.random() - 0.5) * 0.06;
  if (lights.chandelier) lights.chandelier.intensity = 9 * (0.97 + Math.sin(t * 5.1) * 0.02 + (Math.random() - .5) * 0.02);
  if (lights.table) { lights.table.intensity = 1.2 * cf; lights.tableFlame.scale.set(1, 2 * cf, 1); }
  if (dust.pts) {
    dust.pts.rotation.y = t * 0.006;
    dust.pts.position.y = Math.sin(t * 0.2) * 0.05;
  }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

/* =========================================================================
   BAŞLAT
   ========================================================================= */
async function start() {
  try {
    await Promise.race([
      Promise.all([
        document.fonts.load(`700 48px "Cormorant Garamond"`),
        document.fonts.load(`600 48px "Cormorant Garamond"`),
        document.fonts.load(`italic 500 28px "Cormorant Garamond"`),
        document.fonts.load(`700 22px "Alegreya Sans SC"`),
      ]),
      new Promise(r => setTimeout(r, 3000)),
    ]);
  } catch {}
  resize();
  WALLS.forEach(layoutWall);
  buildFillers();
  buildGlassWall();
  buildFurniture();
  buildCorner();
  scene.add(marker);
  initViews(lights.hemi);
  buildDust();
  renderHud();
  renderCatalog();
  document.getElementById('loadingText').textContent = UNIS.length ? 'İÇERİ BUYUR' : 'data.js bulunamadı: önce tools/excel_to_data.py çalıştır.';
  frame();
  if (!UNIS.length) return;
  const intro = document.getElementById('intro');
  if (reduceMotion) view.yaw = 0;
  const enter = () => { if (state !== 'intro') return; intro.classList.add('gone'); state = 'idle'; renderer.toneMappingExposure = 1.05; };
  intro.addEventListener('click', enter);
  setTimeout(enter, reduceMotion ? 300 : 1700);
  hint.textContent = matchMedia('(pointer: coarse)').matches
    ? 'Sol alttaki çubukla yürü · yere dokun, oraya git · kitaba dokun, aç'
    : 'Sürükle: etrafa bak · W A S D ya da oklar: yürü · yere tıkla: oraya git';
  setTimeout(dismissHint, 14000);
  window.__library = { UNIS, openBook, goToBook, state: () => state, applyView, view, player, VIEW_KEYS, walkTo, V3, showMap, backdrop };
}
start();
</script>
