    html += `<div class="cat-group"><h3>${flagSVG(list[0].code)} ${esc(c.toLocaleUpperCase('tr'))}</h3>${list.map(u => {
      const qq = parseQS(u.qs);
      return `<button class="cat-item" data-open="${UNIS.indexOf(u)}"><span class="n">${esc(u.name)}</span><span class="qs">${qq ? 'QS ' + esc(qq.rank) : ''}</span><span class="p">${esc(u.program || '')}</span><span class="chip ${u.status.kind}">${esc(u.status.label.toLocaleUpperCase('tr'))}</span></button>`;
    }).join('')}</div>`;
  }
  }
  if (!any) html += `<p class="empty-search">“${esc(search.value)}” ile eşleşen kitap yok.</p>`;
  catalogList.innerHTML = html;
}
search.addEventListener('input', renderCatalog);
function goToBook(i) {
  const u = UNIS[i]; if (!u || !u.mesh) return;
  if (state === 'reading') { // okurken başka kitap seçilirse doğrudan oraya geç
    toggleDrawer(false); navTo(i); return;
  }
  if (state !== 'idle') return;
  toggleDrawer(false); dismissHint(); introTurn = false;
  state = 'walking';
  const look = u.mesh.getWorldPosition(new THREE.Vector3());
  walkTo(standSpot(u.mesh), look, () => {
    state = 'turning';
    faceBook(u.mesh, false, () => { state = 'idle'; setTimeout(() => openBook(u.mesh), 80); });
  });
}
function navTo(i) { const d = i - readerIdx; if (d) { readerIdx = i - Math.sign(d); navBook(Math.sign(d)); } }
catalogList.addEventListener('click', e => { const b = e.target.closest('[data-open]'); if (b) goToBook(+b.dataset.open); });

/* ---- HUD üst satır ---- */
function renderHud() {
  document.getElementById('subline').textContent = `${UNIS.filter(u => groupOf(u) === 'ana').length} ANA · ${UNIS.filter(u => groupOf(u) === 'yedek').length} YEDEK · ${fmtLong(today).toLocaleUpperCase('tr')}`;
  const ev = upcomingEvents()[0];
  const nu = document.getElementById('nextUp');
  if (ev) {
    const n = daysUntil(ev.d);
    nu.innerHTML = `<span class="lbl">SIRADAKİ TARİH</span><b>${esc(ev.u.short)}</b> ${ev.what} · ${ev.exact ? '' : '~'}${fmtShort(ev.d)} (${esc(inDays(n))})`;
    nu.hidden = false;
    nu.onclick = () => goToBook(UNIS.indexOf(ev.u));
  }
}

/* =========================================================================
   DÖNGÜ
   ========================================================================= */
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.userData.baseFov = w / h < 0.8 ? 74 : w / h < 1.2 ? 66 : 58;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);

const clock = new THREE.Clock();
let introT = 0, introClock = 0, introTurn = !reduceMotion;
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  for (let i = tweens.length - 1; i >= 0; i--) {
    const tw = tweens[i]; tw.t += dt; const k = Math.min(1, tw.t / tw.dur);
    tw.update(tw.fn(k));
    if (k >= 1) { tweens.splice(i, 1); tw.done && tw.done(); }
  }
  if (view.inertia && !drag && (state === 'idle' || state === 'walking')) {
    view.yaw += view.vyaw; view.pitch = THREE.MathUtils.clamp(view.pitch + view.vpitch, -0.75, 0.6);
    view.vyaw *= 0.92; view.vpitch *= 0.92;
    if (Math.abs(view.vyaw) + Math.abs(view.vpitch) < 1e-4) view.inertia = false;
  }
  if (state === 'intro') {
    introT += dt;
    renderer.toneMappingExposure = Math.min(1.05, introT / 2.2 * 1.05);
  }
  if (introTurn) {
    introClock += dt;
    const k = THREE.MathUtils.clamp((introClock - 2.2) / 4.2, 0, 1);
    view.yaw = Math.PI * (1 - ease.inOut(k));
    if (k >= 1) introTurn = false;
  }
  camera.fov = (camera.userData.baseFov || 58) / view.zoom;
  camera.updateProjectionMatrix();
  camera.rotation.set(view.pitch, view.yaw, 0);

  // kitapların hover/parlama animasyonu
  for (const b of uniBooks) {
    if (b === activeBook && state !== 'idle') continue;
    const target = b === hovered ? 1 : 0;
    b.userData.hover += (target - b.userData.hover) * Math.min(1, dt * 10);
    if (b.parent !== scene) b.position.z = b.userData.home.pos.z + b.userData.hover * 0.08;
    const shimmer = Math.max(0, Math.sin(t * 0.9 - b.userData.uni.id * 0.55)) ** 18 * 0.25;
    b.userData.spine.emissiveIntensity = b.userData.hover * 0.22 + shimmer;
  }
  updatePlayer(dt);
  updateViews(t, dt);
  updateCorner(t, dt);
  const cf = 1 + Math.sin(t * 17 + 2) * 0.05 + (Math.random() - 0.5) * 0.06;
  if (lights.chandelier) lights.chandelier.intensity = 9 * (0.97 + Math.sin(t * 5.1) * 0.02 + (Math.random() - .5) * 0.02);
  if (lights.table) { lights.table.intensity = 1.2 * cf; lights.tableFlame.scale.set(1, 2 * cf, 1); }
  if (dust.pts) {
    dust.pts.rotation.y = t * 0.006;
    dust.pts.position.y = Math.sin(t * 0.2) * 0.05;
  }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

/* =========================================================================
   BAŞLAT
   ========================================================================= */
async function start() {
  try {
    await Promise.race([
      Promise.all([
        document.fonts.load(`700 48px "Cormorant Garamond"`),
        document.fonts.load(`600 48px "Cormorant Garamond"`),
        document.fonts.load(`italic 500 28px "Cormorant Garamond"`),
        document.fonts.load(`700 22px "Alegreya Sans SC"`),
      ]),
      new Promise(r => setTimeout(r, 3000)),
    ]);
  } catch {}
  resize();
  WALLS.forEach(layoutWall);
  buildFillers();
  buildGlassWall();
  buildFurniture();
  buildCorner();
  scene.add(marker);
  initViews(lights.hemi);
  buildDust();
  renderHud();
  renderCatalog();
  document.getElementById('loadingText').textContent = UNIS.length ? 'İÇERİ BUYUR' : 'data.js bulunamadı: önce tools/excel_to_data.py çalıştır.';
  frame();
  if (!UNIS.length) return;
  const intro = document.getElementById('intro');
  if (reduceMotion) view.yaw = 0;
  const enter = () => { if (state !== 'intro') return; intro.classList.add('gone'); state = 'idle'; renderer.toneMappingExposure = 1.05; };
  intro.addEventListener('click', enter);
  setTimeout(enter, reduceMotion ? 300 : 1700);
  hint.textContent = matchMedia('(pointer: coarse)').matches
    ? 'Sol alttaki çubukla yürü · yere dokun, oraya git · kitaba dokun, aç'
    : 'Sürükle: etrafa bak · W A S D ya da oklar: yürü · yere tıkla: oraya git';
  setTimeout(dismissHint, 14000);
  window.__library = { UNIS, openBook, goToBook, state: () => state, applyView, view, player, VIEW_KEYS, walkTo, V3 };
}
start();
</script>
