<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Başvuru Kütüphanesi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&family=Alegreya+Sans+SC:wght@500;700&family=Caveat:wght@500;600&display=swap">
<style>
/* Layout: tam ekran 3D oda; üstte ince pirinç levhalı HUD, kitap açılınca ortada iki sayfalık cilt. Tek, bilinçli gece görünümü. */
:root {
  color-scheme: dark;
  --night: #0d0a09;          /* oda karanlığı */
  --hud: rgba(22, 16, 13, .82);
  --hud-line: rgba(201, 162, 74, .28);
  --hud-fg: #efe3c8;
  --hud-dim: #b4a587;
  --gold: #c9a24a;
  --gold-hi: #f0d68e;
  --paper: #f1e6cb;
  --paper-deep: #e2d1aa;
  --paper-edge: #c9b285;
  --ink: #23202e;            /* mürekkep: koyu mor-lacivert */
  --ink-soft: #5b5466;
  --leather: #4b1d1d;
  --urgent: #a3262f;
  --open: #3b6e4a;
  --soon: #b07f22;
  --closed: #77706a;
  --f-display: "Cormorant Garamond", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --f-body: "Alegreya", "Iowan Old Style", Georgia, serif;
  --f-label: "Alegreya Sans SC", "Gill Sans", "Trebuchet MS", sans-serif;
  --f-hand: "Caveat", "Segoe Print", "Bradley Hand", cursive;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden; background: var(--night); color: var(--hud-fg);
  font: 16px/1.45 var(--f-body);
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 3px; }

#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#scene.dragging { cursor: grabbing; }
#scene.pointing { cursor: pointer; }

/* ---------- HUD ---------- */
.hud {
  position: fixed; left: 0; right: 0; top: 0; z-index: 5; pointer-events: none;
  display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
  padding: calc(env(safe-area-inset-top, 0px) + 14px) 16px 0;
}
.plate {
  pointer-events: auto; min-width: 0;
  background: linear-gradient(180deg, rgba(40, 29, 22, .9), var(--hud));
  border: 1px solid var(--hud-line); border-radius: 3px;
  box-shadow: 0 10px 30px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,230,170,.08);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
}
.title-plate { padding: 10px 14px 10px; max-width: min(420px, 62vw); }
.title-plate h1 {
  margin: 0; font: italic 600 1.55rem/1.05 var(--f-display); letter-spacing: .01em; color: var(--gold-hi);
  text-wrap: balance;
}
.title-plate .sub { margin-top: 3px; font: 500 .78rem/1.3 var(--f-label); letter-spacing: .08em; color: var(--hud-dim); }
.next-up {
  display: block; width: 100%; margin-top: 8px; padding: 7px 0 0; text-align: left; background: none; border: 0;
  border-top: 1px solid var(--hud-line); font: .86rem/1.3 var(--f-body); color: var(--hud-fg);
}
.next-up b { color: var(--gold-hi); font-weight: 500; }
.next-up .lbl { display: block; font: 500 .7rem/1.2 var(--f-label); letter-spacing: .1em; color: var(--hud-dim); }
.next-up:hover b { text-decoration: underline; text-underline-offset: 3px; }

.hud-actions { display: flex; gap: 8px; pointer-events: auto; flex-shrink: 0; }
.hud-btn {
  display: inline-flex; align-items: center; gap: 7px; padding: 9px 13px;
  font: 700 .82rem/1 var(--f-label); letter-spacing: .1em; color: var(--hud-fg);
}
.hud-btn svg { width: 17px; height: 17px; stroke: var(--gold-hi); fill: none; stroke-width: 1.6; }
.hud-btn:hover { border-color: rgba(240, 214, 142, .6); }
.hud-btn[aria-pressed="true"], .hud-btn[aria-expanded="true"] { color: var(--gold-hi); border-color: rgba(240, 214, 142, .6); }
.view-menu {
  position: fixed; z-index: 8; right: 16px; top: calc(env(safe-area-inset-top, 0px) + 66px); width: min(300px, calc(100% - 32px));
  padding: 6px; display: grid; gap: 2px;
}
.view-menu button {
  display: grid; gap: 2px; text-align: left; padding: 9px 11px; background: none; border: 1px solid transparent; border-radius: 2px;
}
.view-menu button:hover { background: rgba(255, 240, 210, .07); border-color: var(--hud-line); }
.view-menu button[aria-checked="true"] { background: rgba(240, 214, 142, .12); border-color: rgba(240, 214, 142, .45); }
.view-menu b { font: italic 600 1.15rem/1.1 var(--f-display); color: var(--gold-hi); }
.view-menu span { font: .82rem/1.3 var(--f-body); color: var(--hud-dim); }
.fade { position: fixed; inset: 0; z-index: 9; background: #000; opacity: 0; pointer-events: none; transition: opacity .45s ease; }
.fade.on { opacity: 1; }
.joy {
  position: fixed; z-index: 6; left: 20px; bottom: calc(env(safe-area-inset-bottom, 0px) + 22px); width: 116px; height: 116px; border-radius: 50%;
  background: radial-gradient(circle, rgba(30, 22, 16, .35), rgba(20, 14, 10, .6)); border: 1px solid var(--hud-line);
  box-shadow: inset 0 0 0 6px rgba(240, 214, 142, .06); touch-action: none;
}
.joy-knob {
  position: absolute; left: 50%; top: 50%; width: 50px; height: 50px; margin: -25px 0 0 -25px; border-radius: 50%;
  background: radial-gradient(circle at 40% 35%, #f0d68e, #9c7a34); box-shadow: 0 4px 12px rgba(0,0,0,.5); pointer-events: none;
}

.legend {
  position: fixed; left: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); z-index: 5;
  display: flex; gap: 14px; flex-wrap: wrap; padding: 8px 12px; max-width: calc(100% - 32px);
  font: 500 .74rem/1.2 var(--f-label); letter-spacing: .08em; color: var(--hud-dim);
}
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 7px; height: 13px; border-radius: 1px 1px 0 0; display: inline-block; }
.hint {
  position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 64px); z-index: 4; transform: translateX(-50%);
  pointer-events: none; padding: 8px 14px; border-radius: 999px; white-space: nowrap;
  background: rgba(12, 9, 8, .6); color: var(--hud-fg); font: italic .95rem/1.2 var(--f-body);
  transition: opacity .8s ease;
}
.hint.gone { opacity: 0; }

.tooltip {
  position: fixed; z-index: 6; pointer-events: none; left: 0; top: 0; max-width: 280px;
  padding: 8px 11px 9px; border-radius: 2px;
  background: var(--paper); color: var(--ink); box-shadow: 0 8px 24px rgba(0,0,0,.5);
  border-left: 3px solid var(--gold);
  font: .85rem/1.3 var(--f-body); transform: translate(14px, 14px); transition: opacity .15s;
}
.tooltip strong { display: block; font: 600 1.05rem/1.15 var(--f-display); }
.tooltip .tt-status { display: block; margin-top: 4px; font: 700 .7rem/1.2 var(--f-label); letter-spacing: .08em; }

/* ---------- Intro ---------- */
.intro {
  position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; text-align: center;
  background: radial-gradient(ellipse at center, rgba(30, 20, 14, .65), rgba(8, 6, 5, .96) 70%);
  transition: opacity 1.4s ease, visibility 1.4s; padding: 16px;
}
.intro.gone { opacity: 0; visibility: hidden; }
.intro .mark { font: 500 .8rem/1 var(--f-label); letter-spacing: .3em; color: var(--hud-dim); }
.intro h2 { margin: 14px 0 10px; font: italic 600 clamp(2.4rem, 8vw, 4.6rem)/1 var(--f-display); color: var(--gold-hi); text-wrap: balance; }
.intro p { margin: 0; font: italic 1.05rem/1.4 var(--f-body); color: var(--hud-fg); }
.intro .loading { margin-top: 22px; font: 500 .75rem/1 var(--f-label); letter-spacing: .2em; color: var(--hud-dim); }

/* ---------- Katalog çekmecesi ---------- */
.drawer {
  position: fixed; z-index: 12; top: 0; right: 0; bottom: 0; width: min(420px, 100%);
  display: flex; flex-direction: column;
  background: linear-gradient(180deg, #2a1d15, #1c1410); border-left: 1px solid var(--hud-line);
  box-shadow: -20px 0 60px rgba(0,0,0,.55);
  transform: translateX(105%); transition: transform .45s cubic-bezier(.2,.8,.2,1);
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
.drawer.open { transform: none; }
.drawer header { padding: 18px 16px 12px; border-bottom: 1px solid var(--hud-line); }
.drawer header .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.drawer h2 { margin: 0; font: italic 600 1.6rem/1 var(--f-display); color: var(--gold-hi); }
.icon-btn { background: none; border: 1px solid var(--hud-line); border-radius: 3px; width: 36px; height: 36px; display: grid; place-items: center; }
.icon-btn svg { width: 16px; height: 16px; stroke: var(--hud-fg); stroke-width: 1.8; fill: none; }
.search {
  margin-top: 12px; width: 100%; padding: 9px 11px; border-radius: 2px; border: 1px solid var(--hud-line);
  background: rgba(0,0,0,.25); color: var(--hud-fg); font: 1rem/1.2 var(--f-body);
}
.search::placeholder { color: var(--hud-dim); font-style: italic; }
.drawer .scroll { overflow-y: auto; flex: 1; padding: 6px 16px 24px; overscroll-behavior: contain; }
.agenda { margin: 10px 0 6px; padding: 10px 12px; border: 1px dashed var(--hud-line); border-radius: 2px; }
.agenda h3, .cat-group h3 { margin: 0 0 6px; font: 700 .72rem/1.2 var(--f-label); letter-spacing: .14em; color: var(--hud-dim); }
.agenda ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.agenda li button {
  width: 100%; text-align: left; background: none; border: 0; padding: 3px 0; display: grid;
  grid-template-columns: 4.4em 1fr auto; gap: 8px; align-items: baseline; font: .9rem/1.25 var(--f-body);
}
.agenda .d { font-variant-numeric: tabular-nums; color: var(--gold-hi); font-weight: 500; }
.agenda .left { font: 700 .7rem/1 var(--f-label); letter-spacing: .06em; color: var(--hud-dim); white-space: nowrap; }
.cat-group { margin-top: 16px; }
.cat-section { margin: 26px 0 0; padding-bottom: 6px; border-bottom: 1px solid var(--hud-line); display: flex; justify-content: space-between; align-items: baseline; font: italic 600 1.3rem/1 var(--f-display); color: var(--gold-hi); }
.cat-section span { font: 700 .72rem/1 var(--f-label); letter-spacing: .1em; color: var(--hud-dim); }
.cat-group h3 { display: flex; align-items: center; gap: 8px; }
.cat-item {
  width: 100%; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; text-align: left;
  padding: 9px 10px; margin: 0; background: rgba(255, 240, 210, .03); border: 1px solid transparent;
  border-bottom-color: rgba(201,162,74,.12);
}
.cat-item:hover { background: rgba(255, 240, 210, .08); border-color: var(--hud-line); }
.cat-item .n { font: 600 1.08rem/1.15 var(--f-display); color: var(--hud-fg); min-width: 0; }
.cat-item .p { grid-column: 1; font: italic .82rem/1.25 var(--f-body); color: var(--hud-dim); min-width: 0; }
.cat-item .qs { grid-row: 1; grid-column: 2; font: 700 .72rem/1 var(--f-label); letter-spacing: .08em; color: var(--gold); font-variant-numeric: tabular-nums; }
.cat-item .chip { grid-row: 2; grid-column: 2; justify-self: end; }
.chip {
  display: inline-block; padding: 3px 7px 3px; border-radius: 2px; white-space: nowrap;
  font: 700 .64rem/1 var(--f-label); letter-spacing: .08em; color: #fff4e0; background: var(--closed);
}
.chip.open { background: var(--open); }
.chip.urgent { background: var(--urgent); }
.chip.soon { background: var(--soon); }
.chip.unknown { background: transparent; color: var(--hud-dim); border: 1px solid var(--hud-line); }
.flag { display: inline-block; width: 21px; height: 14px; border-radius: 1px; box-shadow: 0 0 0 1px rgba(0,0,0,.25); flex-shrink: 0; vertical-align: -2px; }
.empty-search { margin-top: 18px; font-style: italic; color: var(--hud-dim); }

/* ---------- Okuma: açılan kitap ---------- */
.reader { position: fixed; inset: 0; z-index: 15; display: grid; place-items: center; padding: 16px; }
.reader-backdrop {
  position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(20, 13, 9, .55), rgba(6, 4, 3, .88));
  backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); animation: fade .5s ease both;
}
.tome {
  position: relative; width: min(1000px, 100%); height: min(660px, calc(100% - 96px));
  margin-bottom: 48px; perspective: 2400px;
}
.spread {
  position: absolute; inset: 0; display: grid; grid-template-columns: 1fr 1fr;
  padding: 14px; border-radius: 6px;
  background: linear-gradient(90deg, #3b1717, #5a2222 48%, #2a0f0f 50%, #5a2222 52%, #3b1717);
  box-shadow: 0 40px 90px rgba(0,0,0,.65), 0 0 0 1px rgba(0,0,0,.4);
  animation: spreadIn .9s cubic-bezier(.2,.8,.2,1) both;
}
.page {
  position: relative; min-width: 0; overflow-y: auto; overscroll-behavior: contain;
  background:
    radial-gradient(ellipse at 30% 20%, rgba(255,255,255,.35), transparent 60%),
    radial-gradient(ellipse at 80% 90%, rgba(150,110,50,.12), transparent 55%),
    var(--paper);
  color: var(--ink); padding: 34px 36px 46px;
  scrollbar-width: thin; scrollbar-color: var(--paper-edge) transparent;
}
.page.left { border-radius: 3px 0 0 3px; box-shadow: inset -26px 0 30px -18px rgba(90, 60, 20, .45); }
.page.right { border-radius: 0 3px 3px 0; box-shadow: inset 26px 0 30px -18px rgba(90, 60, 20, .45); }
.folio { position: absolute; bottom: 14px; font: italic .85rem/1 var(--f-display); color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.page.left .folio { left: 36px; }
.page.right .folio { right: 36px; }

.cover-flap {
  position: absolute; top: 0; bottom: 0; left: 50%; width: 50%; transform-origin: left center;
  transform-style: preserve-3d; animation: coverOpen 1.15s cubic-bezier(.55,.05,.25,1) .1s both; z-index: 3;
  pointer-events: none;
}
.cover-flap .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 0 6px 6px 0; }
.cover-flap .front {
  display: grid; place-items: center; text-align: center; padding: 40px;
  background: radial-gradient(ellipse at 40% 30%, rgba(255,255,255,.08), transparent 60%), var(--cover, var(--leather));
  box-shadow: inset 0 0 0 10px rgba(0,0,0,.18), inset 0 0 0 12px rgba(240,214,142,.55), inset 0 0 0 18px rgba(0,0,0,0), inset 0 0 0 19px rgba(240,214,142,.35);
}
.cover-flap .front h3 { margin: 0; font: 600 2rem/1.1 var(--f-display); color: var(--gold-hi); text-shadow: 0 1px 0 rgba(0,0,0,.5); text-wrap: balance; }
.cover-flap .back {
  transform: rotateY(180deg); border-radius: 6px 0 0 6px;
  background:
    repeating-radial-gradient(circle at 20% 30%, #26354f 0 6px, #3a4d6c 6px 9px, #1c2840 9px 14px),
    #26354f;
}
.leaf {
  position: absolute; top: 14px; bottom: 14px; left: 50%; width: calc(50% - 14px); transform-origin: left center; z-index: 4;
  background: linear-gradient(90deg, var(--paper-deep), var(--paper)); border-radius: 0 3px 3px 0;
  box-shadow: 0 0 30px rgba(0,0,0,.25); pointer-events: none;
}
.leaf.fwd { animation: leafFwd .6s cubic-bezier(.45,.05,.3,1) both; }
.leaf.back { left: 14px; transform-origin: right center; border-radius: 3px 0 0 3px; animation: leafBack .6s cubic-bezier(.45,.05,.3,1) both; }
.reader.closing .spread, .reader.closing .reader-backdrop { animation: fadeOut .35s ease both; }
.reader.closing .tome { animation: shrink .35s ease both; }

.reader-nav {
  position: absolute; left: 0; right: 0; bottom: -46px; display: flex; justify-content: center; gap: 10px; z-index: 5;
}
.reader-nav .hud-btn { pointer-events: auto; }
.reader-close { position: absolute; top: -18px; right: -14px; z-index: 6; width: 40px; height: 40px; border-radius: 50%; background: #2a1d15; }

@keyframes fade { from { opacity: 0 } }
@keyframes fadeOut { to { opacity: 0 } }
@keyframes shrink { to { transform: scale(.94); opacity: 0 } }
@keyframes spreadIn { from { transform: scale(.82) translateY(30px); opacity: 0 } }
@keyframes coverOpen { 0% { transform: rotateY(0) } 85% { opacity: 1 } 100% { transform: rotateY(-180deg); opacity: 0 } }
@keyframes leafFwd { from { transform: rotateY(0) } to { transform: rotateY(-180deg) } }
@keyframes leafBack { from { transform: rotateY(0) } to { transform: rotateY(180deg) } }

/* sayfa içeriği */
.eyebrow { display: flex; justify-content: space-between; gap: 10px; font: 700 .7rem/1.2 var(--f-label); letter-spacing: .16em; color: var(--ink-soft); }
.place { margin-top: 22px; display: flex; align-items: center; gap: 10px; font: 700 .82rem/1.2 var(--f-label); letter-spacing: .12em; color: var(--ink-soft); }
.uni-name { margin: 8px 0 0; font: 600 clamp(1.9rem, 3.4vw, 2.7rem)/1.02 var(--f-display); color: var(--ink); text-wrap: balance; }
.program { margin: 10px 0 0; font: italic 1.08rem/1.35 var(--f-body); color: var(--ink-soft); max-width: 32em; }
.fleuron { display: block; margin: 22px auto; width: 140px; height: 16px; color: var(--paper-edge); }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 18px; margin: 0; }
.facts dt { font: 700 .68rem/1.2 var(--f-label); letter-spacing: .14em; color: var(--ink-soft); }
.facts dd { margin: 3px 0 0; font: 500 1.15rem/1.2 var(--f-body); }
.qs-block { margin-top: 26px; display: flex; align-items: flex-end; gap: 16px; }
.qs-seal {
  flex-shrink: 0; width: 112px; height: 112px; border-radius: 50%; display: grid; place-items: center; text-align: center;
  background: radial-gradient(circle at 35% 30%, #c0393f, #861b22 60%, #5e1016);
  color: #fbe7c4; box-shadow: 0 6px 14px rgba(80, 10, 10, .35), inset 0 0 0 5px rgba(0,0,0,.12), inset 0 0 0 7px rgba(251,231,196,.35);
  transform: rotate(-8deg);
}
.qs-seal small { display: block; font: 700 .6rem/1 var(--f-label); letter-spacing: .14em; }
.qs-seal b { display: block; font: 700 2.3rem/1 var(--f-display); font-variant-numeric: tabular-nums; }
.qs-text { font: .95rem/1.35 var(--f-body); color: var(--ink-soft); padding-bottom: 6px; }
.qs-text strong { display: block; font: 700 .7rem/1.2 var(--f-label); letter-spacing: .14em; color: var(--ink); }

.section-h { margin: 0 0 8px; font: 700 .72rem/1.2 var(--f-label); letter-spacing: .16em; color: var(--ink-soft); display: flex; justify-content: space-between; gap: 10px; }
.section + .section { margin-top: 26px; }
.fee { font: 600 2.1rem/1 var(--f-display); font-variant-numeric: tabular-nums; }
.missing { font: italic 1rem/1.35 var(--f-body); color: var(--ink-soft); }
.timeline { position: relative; margin-top: 4px; }
.tl-ends { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.tl-ends div:last-child { text-align: right; }
.tl-ends small { display: block; font: 700 .64rem/1.2 var(--f-label); letter-spacing: .14em; color: var(--ink-soft); }
.tl-ends b { display: block; font: 600 1.35rem/1.15 var(--f-display); font-variant-numeric: tabular-nums; }
.tl-ends em { display: block; font: italic .8rem/1.25 var(--f-body); color: var(--ink-soft); }
.tl-bar { position: relative; margin: 12px 0 10px; height: 6px; border-radius: 3px; background: rgba(35, 32, 46, .12); }
.tl-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--ink); }
.tl-today { position: absolute; top: -5px; width: 2px; height: 16px; background: var(--urgent); }
.tl-today::after { content: "bugün"; position: absolute; top: 18px; left: 50%; transform: translateX(-50%); font: italic .72rem/1 var(--f-body); color: var(--urgent); white-space: nowrap; }
.status-line { margin-top: 24px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font: 1rem/1.3 var(--f-body); }

.todo { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.todo label { display: grid; grid-template-columns: 22px 1fr; gap: 8px; align-items: start; cursor: pointer; font: 500 1.28rem/1.12 var(--f-hand); color: #2c3a6a; }
.todo input { appearance: none; -webkit-appearance: none; margin: 4px 0 0; width: 18px; height: 18px; border: 1.6px solid #2c3a6a; border-radius: 2px; display: grid; place-items: center; cursor: pointer; background: transparent; }
.todo input:checked::after { content: ""; width: 10px; height: 5px; border-left: 2px solid #2c3a6a; border-bottom: 2px solid #2c3a6a; transform: rotate(-45deg) translate(1px, -1px); }
.todo input:checked + span { text-decoration: line-through; text-decoration-color: rgba(44,58,106,.6); opacity: .6; }
.todo-none { font: 500 1.35rem/1.15 var(--f-hand); color: var(--open); }
.todo-count { font-variant-numeric: tabular-nums; letter-spacing: .06em; }

@media (max-width: 760px) {
  .tome { height: calc(100% - 84px); margin-bottom: 56px; margin-top: 10px; }

<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
<script type="module">
import * as THREE from 'three';
import { Water } from 'three/addons/objects/Water.js';

/* =========================================================================
   VERİ & TARİH YARDIMCILARI
   ========================================================================= */
const DATA = window.LIBRARY_DATA || { universities: [], notes: [] };
const UNIS = DATA.universities;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

const MONTHS = ['oca','şub','mar','nis','may','haz','tem','ağu','eyl','eki','kas','ara'];
const MONTH_NAMES = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const DAY = 864e5;
const today = (() => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); })();

function parseTrDate(s) {
  if (!s) return null;
  const low = s.toLocaleLowerCase('tr');
  const m = low.match(/(?:(\d{1,2})\s+)?(oca|şub|mar|nis|may|haz|tem|ağu|eyl|eki|kas|ara)[a-zçğıöşü]*(\s+ortası)?\s+(\d{4})/);
  if (!m) return null;
  const day = m[1] ? +m[1] : (m[3] ? 15 : 1);
  const paren = s.match(/\(([^)]*(?:\([^)]*\)[^)]*)*)\)/);

    date: new Date(+m[4], MONTHS.indexOf(m[2]), day),

}
const daysUntil = d => Math.round((d - today) / DAY);

const fmtLong = d => `${d.getDate()} ${MONTH_NAMES[d.getMonth()]} ${d.getFullYear()}`;
function inDays(n) {
  if (n === 0) return 'bugün';
  if (n === 1) return 'yarın';
  if (n < 0) return `${-n} gün önce`;
  if (n < 60) return `${n} gün sonra`;
  return `~${Math.round(n / 30)} ay sonra`;
}

function statusOf(u) {
  const o = parseTrDate(u.open), c = parseTrDate(u.close);
  const res = { open: o, close: c, kind: 'unknown', label: 'Tarih belirsiz', detail: '', progress: null };
  if (c && daysUntil(c.date) < 0) {
    Object.assign(res, { kind: 'closed', label: 'Kapandı', detail: `Başvurular ${fmtLong(c.date)} tarihinde kapandı.` });
  } else if (o && daysUntil(o.date) > 0) {
    const n = daysUntil(o.date);
    Object.assign(res, { kind: 'soon', label: n < 60 ? `${n} gün sonra açılıyor` : 'Henüz açılmadı', detail: `Başvurular ${o.exact ? fmtLong(o.date) : o.main} tarihinde açılıyor (${inDays(n)}).` });
  } else if (c) {
    const n = daysUntil(c.date);
    const urgent = n <= 21;
    Object.assign(res, {
      kind: urgent ? 'urgent' : 'open',
      label: n === 0 ? 'Bugün kapanıyor' : `Kapanışa ${n} gün`,
      detail: o ? `Başvuru açık. Son gün ${fmtLong(c.date)}.` : `Son gün ${fmtLong(c.date)}.`,
    });
  } else if (o) {
    Object.assign(res, { kind: 'open', label: 'Başvuru açık', detail: `Başvurular ${o.exact ? fmtLong(o.date) : o.main} tarihinde açıldı; kapanış tarihi tabloda yok.` });
  }
  if (o && c) res.progress = Math.min(1, Math.max(0, (today - o.date) / (c.date - o.date)));
  return res;
}
UNIS.forEach(u => { u.status = statusOf(u); });

function parseQS(s) {
  if (!s) return null;
  const n = s.match(/\d+(?:\s*[–-]\s*\d+)?/);
  const tags = [...s.matchAll(/\(([^)]+)\)/g)].map(m => m[1]);
  return { rank: n ? n[0].replace(/\s/g, '') : s, tied: tags.includes('eşit'), notes: tags.filter(t => t !== 'eşit') };
}

const FLAGS = {
  de: { type: 'h', c: ['#000000', '#DD0000', '#FFCE00'] },
  nl: { type: 'h', c: ['#AE1C28', '#FFFFFF', '#21468B'] },
  fr: { type: 'v', c: ['#0055A4', '#FFFFFF', '#EF4135'] },
  be: { type: 'v', c: ['#000000', '#FDDA24', '#EF3340'] },
  it: { type: 'v', c: ['#009246', '#FFFFFF', '#CE2B37'] },
  dk: { type: 'nordic', c: ['#C8102E', '#FFFFFF'] },
  se: { type: 'nordic', c: ['#006AA7', '#FECC00'] },
  fi: { type: 'nordic', c: ['#FFFFFF', '#002F6C'] },
  cz: { type: 'cz', c: ['#FFFFFF', '#D7141A', '#11457E'] },
  es: { type: 'es', c: ['#AA151B', '#F1BF00'] },
};
function drawFlag(g, code, x, y, w, h) {
  const f = FLAGS[code];
  g.save();
  if (!f) { g.fillStyle = '#888'; g.fillRect(x, y, w, h); g.restore(); return; }
  const [a, b, c] = f.c;
  if (f.type === 'h') { [a, b, c].forEach((col, i) => { g.fillStyle = col; g.fillRect(x, y + i * h / 3, w, h / 3 + 0.5); }); }
  else if (f.type === 'v') { [a, b, c].forEach((col, i) => { g.fillStyle = col; g.fillRect(x + i * w / 3, y, w / 3 + 0.5, h); }); }
  else if (f.type === 'nordic') {
    g.fillStyle = a; g.fillRect(x, y, w, h); g.fillStyle = b;
    g.fillRect(x + w * 0.3, y, w * 0.13, h); g.fillRect(x, y + h * 0.42, w, h * 0.16);
  } else if (f.type === 'cz') {
    g.fillStyle = a; g.fillRect(x, y, w, h / 2); g.fillStyle = b; g.fillRect(x, y + h / 2, w, h / 2);
    g.fillStyle = c; g.beginPath(); g.moveTo(x, y); g.lineTo(x + w * 0.5, y + h / 2); g.lineTo(x, y + h); g.closePath(); g.fill();

}
function flagSVG(code) {

  drawFlag(c.getContext('2d'), code, 0, 0, 42, 28);

}

const esc = s => String(s ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));

/* Ülke başına deri rengi */
const LEATHER = {
  'Hollanda': '#a5481a', 'Almanya': '#3a2b2b', 'Belçika': '#7a5a14', 'Çekya': '#1f3d5c', 'Danimarka': '#7c1c2b',
  'Finlandiya': '#2e5874', 'Fransa': '#22346b', 'İspanya': '#8a1d16', 'İsveç': '#1e5f86', 'İtalya': '#1f5b3b',
};
const leatherOf = u => LEATHER[u.country] || '#5a2b2b';

/* =========================================================================
   SES (yalnızca kullanıcı açarsa)
   ========================================================================= */
const Sound = {
  ctx: null, on: false, master: null, fireTimer: null,
  init() {
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    this.ctx = new AC(); this.master = this.ctx.createGain(); this.master.gain.value = 0.0; this.master.connect(this.ctx.destination);
    const len = this.ctx.sampleRate * 2; const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate); const d = buf.getChannelData(0);
    let last = 0; for (let i = 0; i < len; i++) { const w = Math.random() * 2 - 1; last = (last + 0.02 * w) / 1.02; d[i] = last * 3.5; }
    this.brown = buf;
    const wbuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate); const wd = wbuf.getChannelData(0); for (let i = 0; i < len; i++) wd[i] = Math.random() * 2 - 1;
    this.white = wbuf;
  },
  ambKind: null, ambNodes: [], ambTimer: null,
  setAmbience(kind) {
    this.ambKind = kind;
    if (!this.ctx || !this.on) return;
    this.stopAmb();
    const c = this.ctx, out = c.createGain(); out.gain.value = 0; out.connect(this.master);
    out.gain.linearRampToValueAtTime(1, c.currentTime + 2);
    const nodes = [out];
    const src = buf => { const s = c.createBufferSource(); s.buffer = buf; s.loop = true; s.start(0, Math.random() * 1.5); nodes.push(s); return s; };
    const filt = (type, f, q = 0.7) => { const b = c.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = q; return b; };
    const gain = v => { const g = c.createGain(); g.gain.value = v; return g; };
    const lfo = (freq, depth, param) => { const o = c.createOscillator(); o.frequency.value = freq; const g = gain(depth); o.connect(g).connect(param); o.start(); nodes.push(o); };
    if (kind === 'wind' || kind === 'highwind') {
      const bp = filt('bandpass', kind === 'wind' ? 420 : 900), g = gain(kind === 'wind' ? 0.16 : 0.09);
      src(this.white).connect(bp).connect(g).connect(out); lfo(0.07, kind === 'wind' ? 260 : 400, bp.frequency); lfo(0.11, 0.07, g.gain);
    } else if (kind === 'water') {
      const lp = filt('lowpass', 520), g = gain(0.3); src(this.brown).connect(lp).connect(g).connect(out); lfo(0.12, 300, lp.frequency); lfo(0.12, 0.14, g.gain);
      const bp = filt('bandpass', 380), g2 = gain(0.05); src(this.white).connect(bp).connect(g2).connect(out); lfo(0.05, 0.03, g2.gain);
    } else if (kind === 'underwater') {
      const lp = filt('lowpass', 190), g = gain(0.75); src(this.brown).connect(lp).connect(g).connect(out); lfo(0.08, 0.2, g.gain);
      this.ambTimer = setInterval(() => { if (Math.random() < 0.6) this.bubble(out); }, 650);
    } else if (kind === 'space') {
      const lp = filt('lowpass', 300);
      for (const f of [55, 55.4, 82.4]) { const o = c.createOscillator(); o.type = 'sine'; o.frequency.value = f; const g = gain(0.05); o.connect(g).connect(lp); o.start(); nodes.push(o); }
      const g = gain(1); lp.connect(g).connect(out); lfo(0.05, 0.35, g.gain);

  },
  stopAmb() {

    setTimeout(() => old.forEach(n => { try { n.stop && n.stop(); } catch {} try { n.disconnect(); } catch {} }), 900);
  },
  bubble(out) {
    const t = this.ctx.currentTime, o = this.ctx.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(300 + Math.random() * 300, t); o.frequency.exponentialRampToValueAtTime(900 + Math.random() * 700, t + 0.07);
    const g = this.ctx.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.05, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.09);
    o.connect(g).connect(out); o.start(t); o.stop(t + 0.1);
  },
  purr() {
    this.init(); if (!this.ctx || !this.on) return;
    const c = this.ctx, t = c.currentTime, s = c.createBufferSource(); s.buffer = this.brown;
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 260;
    const am = c.createGain(); am.gain.value = 0.5; const o = c.createOscillator(); o.frequency.value = 24; const od = c.createGain(); od.gain.value = 0.5; o.connect(od).connect(am.gain);
    const env = c.createGain(); env.gain.setValueAtTime(0, t); env.gain.linearRampToValueAtTime(0.9, t + 0.3); env.gain.linearRampToValueAtTime(0.9, t + 1.6); env.gain.linearRampToValueAtTime(0, t + 2.2);
    s.connect(lp).connect(am).connect(env).connect(this.master); s.start(t); o.start(t); s.stop(t + 2.3); o.stop(t + 2.3);
  },
  swish(dur = 0.32, from = 3200, to = 900, vol = 0.35) {
    if (!this.on) return;
    const t = this.ctx.currentTime, src = this.ctx.createBufferSource(); src.buffer = this.white;
    const bp = this.ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 0.8;
    bp.frequency.setValueAtTime(from, t); bp.frequency.exponentialRampToValueAtTime(to, t + dur);
    const g = this.ctx.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + dur * 0.3); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(bp).connect(g).connect(this.master); src.start(t, Math.random()); src.stop(t + dur + 0.05);
  },
  thud() {
    if (!this.on) return;
    const t = this.ctx.currentTime, o = this.ctx.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(55, t + 0.12);
    const g = this.ctx.createGain(); g.gain.setValueAtTime(0.25, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
    o.connect(g).connect(this.master); o.start(t); o.stop(t + 0.2);
  },
  toggle() {
    this.init(); if (!this.ctx) return false;
    this.on = !this.on; this.ctx.resume();
    this.master.gain.cancelScheduledValues(this.ctx.currentTime);
    this.master.gain.linearRampToValueAtTime(this.on ? 0.9 : 0, this.ctx.currentTime + 0.6);
    if (this.on) this.setAmbience(this.ambKind); else this.stopAmb();
    return this.on;
  },
};
const soundBtn = document.getElementById('soundBtn');
soundBtn.addEventListener('click', () => soundBtn.setAttribute('aria-pressed', String(Sound.toggle())));

   ========================================================================= */
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;

renderer.toneMappingExposure = 0.0; // giriş animasyonunda açılır
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0807);

const camera = new THREE.PerspectiveCamera(58, 1, 0.08, 2000);
camera.position.set(0, 1.62, 2.5);
camera.rotation.order = 'YXZ';
const view = { yaw: Math.PI, pitch: -0.02, vyaw: 0, vpitch: 0, zoom: 1 };

let seed = 20270901;
function rand() { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }
const rr = (a, b) => a + rand() * (b - a);
const pick = arr => arr[Math.floor(rand() * arr.length)];

const maxAniso = renderer.capabilities.getMaxAnisotropy();
function canvasTex(w, h, draw, { repeat, srgb = true } = {}) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = Math.min(8, maxAniso);
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat[0], repeat[1]); }
  return t;
}
function shade(hex, k) { const c = new THREE.Color(hex); const hsl = {}; c.getHSL(hsl); c.setHSL(hsl.h, hsl.s, Math.min(1, Math.max(0, hsl.l * k))); return '#' + c.getHexString(); }

function grain(g, w, h, n, dark = 0.1, light = 0.04) {
  for (let i = 0; i < n; i++) {
    g.fillStyle = rand() < 0.6 ? `rgba(0,0,0,${rand() * dark})` : `rgba(255,240,220,${rand() * light})`;
    g.fillRect(rand() * w, rand() * h, 1 + rand() * 2.2, 1 + rand() * 2.2);
  }
}
function woodGrain(g, w, h, base, vertical = true, lines = 80) {
  g.fillStyle = base; g.fillRect(0, 0, w, h);
  for (let i = 0; i < lines; i++) {
    g.strokeStyle = rand() < 0.5 ? `rgba(0,0,0,${rr(0.04, 0.16)})` : `rgba(255,220,170,${rr(0.02, 0.06)})`;
    g.lineWidth = rr(0.6, 2.4); g.beginPath();
    const p0 = rand() * (vertical ? w : h), amp = rr(1, 6), freq = rr(0.004, 0.02), ph = rand() * 6;
    for (let s = 0; s <= (vertical ? h : w); s += 6) {
      const o = p0 + Math.sin(s * freq + ph) * amp;
      vertical ? g.lineTo(o, s) : g.lineTo(s, o);
    }
    g.stroke();
  }
}

/* ---- Malzemeler ---- */
const woodTex = canvasTex(256, 1024, (g, w, h) => { woodGrain(g, w, h, '#3d2416', true, 120); grain(g, w, h, 4000, 0.08, 0.02); });
const woodMat = new THREE.MeshStandardMaterial({ map: woodTex, roughness: 0.62, metalness: 0.0 });
const woodDarkMat = new THREE.MeshStandardMaterial({ map: woodTex, color: 0x6e5a4c, roughness: 0.7 });
const backPanelMat = new THREE.MeshStandardMaterial({ color: 0x1c120c, roughness: 0.95 });

function drawLeather(g, w, h, color) {
  g.fillStyle = color; g.fillRect(0, 0, w, h);

function goldGradient(g, y0, y1) {
  const gr = g.createLinearGradient(0, y0, 0, y1);
  gr.addColorStop(0, '#fbe6a2'); gr.addColorStop(0.5, '#d9b25a'); gr.addColorStop(1, '#a87a2a');
  return gr;
}
function fitFont(g, text, weight, family, maxW, maxSize) {
  let size = maxSize;
  g.font = `${weight} ${size}px ${family}`;
  const m = g.measureText(text).width;
  if (m > maxW) size = Math.floor(size * maxW / m);
  g.font = `${weight} ${size}px ${family}`;
  return size;
}
function wrapLines(g, text, maxW) {
  const words = text.split(/\s+/); const lines = []; let line = '';
  for (const w of words) {
    const t = line ? line + ' ' + w : w;
    if (g.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t;
  }
  if (line) lines.push(line);
  return lines;
}

function buildBookcase(cfg) {
  const group = new THREE.Group();
  group.position.set(...cfg.pos); group.rotation.y = cfg.rotY;
  scene.add(group);
  const { W, D, H: Hc } = BC;
  const add = (geo, mat, x, y, z) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); group.add(m); return m; };
  add(new THREE.BoxGeometry(W, Hc, 0.03), backPanelMat, 0, Hc / 2, 0.015);
  for (const sx of [-W / 2 - 0.05, W / 2 + 0.05]) add(new THREE.BoxGeometry(0.1, Hc + 0.05, D + 0.04), woodMat, sx, Hc / 2, D / 2);
  for (const dx of BAY_DIVIDERS) add(new THREE.BoxGeometry(0.05, Hc, D - 0.02), woodMat, dx, Hc / 2, D / 2 - 0.01);
  add(new THREE.BoxGeometry(W + 0.36, 0.12, D + 0.16), woodMat, 0, Hc + 0.06, D / 2 + 0.02);
  add(new THREE.BoxGeometry(W + 0.28, 0.08, D + 0.1), woodDarkMat, 0, Hc + 0.15, D / 2 + 0.01);
  add(new THREE.BoxGeometry(W + 0.2, 0.16, D + 0.06), woodDarkMat, 0, 0.08, D / 2 + 0.01);
  for (const y of SHELF_TOPS.slice(1).concat([Hc])) {
    add(new THREE.BoxGeometry(W, 0.035, D), woodMat, 0, y - 0.0175, D / 2);
  }
  for (const y of SHELF_TOPS) add(new THREE.BoxGeometry(W, 0.07, 0.025), woodMat, 0, y - 0.03, D + 0.0125);
  // pilastrlar
  for (const sx of [-W / 2 - 0.05, W / 2 + 0.05]) add(new THREE.BoxGeometry(0.16, Hc - 0.2, 0.04), woodDarkMat, sx, Hc / 2 + 0.05, D + 0.04);
  bookcases.push({ group, cfg });
  return group;
}

/* Duvarlar: ana liste karşı ve sol duvara (ülkeler yük dengelenerek), yedeklerin hepsi sağ duvara */
const byCountry = new Map();
for (const u of UNIS) { if (!byCountry.has(u.country)) byCountry.set(u.country, []); byCountry.get(u.country).push(u); }
const GROUP_LABEL = { ana: 'ANA LİSTE', yedek: 'YEDEKLER' };
const groupOf = u => u.group === 'yedek' ? 'yedek' : 'ana';
const WALLS = [
  { name: 'front', pos: [0, 0, -R], rotY: 0, sets: [], load: 0 },
  { name: 'left', pos: [-R, 0, 0], rotY: Math.PI / 2, sets: [], load: 0 },
  { name: 'right', pos: [R, 0, 0], rotY: -Math.PI / 2, sets: [], load: 0 },
];
{
  const hasBackups = UNIS.some(u => groupOf(u) === 'yedek');
  const plan = hasBackups ? { ana: [WALLS[0], WALLS[1]], yedek: [WALLS[2]] } : { ana: WALLS };
  for (const [g, walls] of Object.entries(plan)) {
    const sets = new Map();
    for (const u of UNIS.filter(u => groupOf(u) === g)) { if (!sets.has(u.country)) sets.set(u.country, []); sets.get(u.country).push(u); }
    [...sets.entries()].sort((a, b) => b[1].length - a[1].length || a[0].localeCompare(b[0], 'tr')).forEach(([c, books]) => {
      const wall = [...walls].sort((a, b) => a.load - b.load)[0];
      wall.sets.push({ country: c, books }); wall.load += books.length; wall.group = g;
    });
  }
  for (const w of WALLS) w.sets.sort((a, b) => a.country.localeCompare(b.country, 'tr'));
}

function layoutWall(wall) {
  const group = buildBookcase(wall);
  const books = wall.sets.flatMap(s => s.books);
  if (wall.group && WALLS.some(w => w.group === 'yedek')) addWallSign(group, GROUP_LABEL[wall.group]);
  const n = books.length;
  const k = Math.min(5, Math.max(1, Math.ceil(n / 4)));
  const rowsForBooks = [3, 2, 1, 4, 0].slice(0, k).sort((a, b) => b - a); // yukarıdan aşağı
  const perRow = rowsForBooks.map((_, i) => Math.floor(n / k) + (i < n % k ? 1 : 0));
  let bi = 0;
  const L = BC.W - 0.04;
  for (let row = 0; row < SHELF_TOPS.length; row++) {
    const ri = rowsForBooks.indexOf(row);
    const rowBooks = ri >= 0 ? books.slice(bi, bi += perRow[ri]) : [];
    const y0 = SHELF_TOPS[row];
    const maxH = (row < SHELF_TOPS.length - 1 ? SHELF_TOPS[row + 1] - 0.035 : BC.H) - y0 - 0.025;
    // dizilim: dolgu kitaplar + (üniversite kitabı, 1-3 dolgu)… ülke değişiminde kitap desteği boşluğu
    const items = [];
    let prevCountry = null;
    rowBooks.forEach((u, i) => {
      if (prevCountry && prevCountry !== u.country) {
        // ülke levhaları çakışmasın diye gruplar arasında yeterli boşluk bırak
        items.push({ gap: 0.06 });
        let sep = 0.06; while (sep < 0.42) { const f = { filler: true, th: rr(0.032, 0.075) }; sep += f.th; items.push(f); }
      }
      items.push({ uni: u });
      const nextSame = rowBooks[i + 1] && rowBooks[i + 1].country === u.country;
      if (nextSame) for (let f = 0, m = 1 + Math.floor(rand() * 3); f < m; f++) items.push({ filler: true });
      prevCountry = u.country;
    });
    const sizeOf = it => it.gap ? it.gap : it.uni ? (it.th ??= rr(0.115, 0.14)) : (it.th ??= rr(0.032, 0.075));
    const coreW = items.reduce((s, it) => s + sizeOf(it), 0);
    const left = [], right = [];
    let lw = 0, rw = 0; const side = (L - coreW) / 2;
    while (lw < side - 0.08) { const it = { filler: true }; lw += sizeOf(it); left.push(it); }
    while (rw < side - 0.08) { const it = { filler: true }; rw += sizeOf(it); right.push(it); }
    // ara sıra yatay kitap yığını
    if (rand() < 0.55) left.splice(Math.floor(rand() * Math.min(6, left.length)), 3, { stack: true, th: 0.3 });
    if (rand() < 0.45) right.splice(Math.max(0, right.length - 1 - Math.floor(rand() * 5)), 3, { stack: true, th: 0.3 });
    const all = [...left, ...items, ...right];
    const total = all.reduce((s, it) => s + sizeOf(it), 0);
    let x = -L / 2 + Math.max(0.01, (L - total) / 2);
    const runs = [];
    for (const it of all) {
      const w = sizeOf(it);
      // bölme duvarına çarpma
      for (const dx of BAY_DIVIDERS) if (x < dx + 0.03 && x + w > dx - 0.03) x = dx + 0.03;
      if (x + w > L / 2) break;
      const cx = x + w / 2;
      if (it.filler) {
        const hgt = Math.min(maxH, rr(0.3, 0.46)), d = rr(0.24, 0.33);
        let lean = 0;

const GLSL_NOISE = `
float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * .1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
float hash13(vec3 p3){ p3 = fract(p3 * .1031); p3 += dot(p3, p3.zyx + 31.32); return fract((p3.x + p3.y) * p3.z); }
float noise2(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
  return mix(mix(hash12(i),hash12(i+vec2(1,0)),f.x), mix(hash12(i+vec2(0,1)),hash12(i+vec2(1,1)),f.x), f.y); }
float fbm2(vec2 p){ float v=0., a=.5; for(int i=0;i<5;i++){ v+=a*noise2(p); p=p*2.02+vec2(17.1,9.3); a*=.5; } return v; }
float noise3(vec3 p){ vec3 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
  return mix(mix(mix(hash13(i),hash13(i+vec3(1,0,0)),f.x), mix(hash13(i+vec3(0,1,0)),hash13(i+vec3(1,1,0)),f.x), f.y),
             mix(mix(hash13(i+vec3(0,0,1)),hash13(i+vec3(1,0,1)),f.x), mix(hash13(i+vec3(0,1,1)),hash13(i+vec3(1,1,1)),f.x), f.y), f.z); }
float fbm3(vec3 p){ float v=0., a=.5; for(int i=0;i<5;i++){ v+=a*noise3(p); p=p*2.03+vec3(11.7,3.1,7.9); a*=.5; } return v; }
float caustic(vec2 uv, float t){
  vec2 p = mod(uv*6.28318, 6.28318) - 250.0; vec2 i = p; float c = 1.0; float inten = .005;
  for (int n = 0; n < 4; n++) {
    float tt = t * (1.0 - (3.5 / float(n+1)));
    i = p + vec2(cos(tt - i.x) + sin(tt + i.y), sin(tt - i.y) + cos(tt + i.x));
    c += 1.0/length(vec2(p.x / (sin(i.x+tt)/inten), p.y / (cos(i.y+tt)/inten)));
  }
  c /= 4.0; c = 1.17-pow(c, 1.4); return pow(abs(c), 8.0);
}
`;
const GLSL_OUT = `
#include <tonemapping_fragment>
#include <colorspace_fragment>`;
const col3 = c => new THREE.Color(c);
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);

    void main(){

/* ---- yardımcılar ---- */
function vnoise1(seed) {
  const tbl = Array.from({ length: 512 }, (_, i) => { const x = Math.sin((i + seed * 131.7) * 12.9898) * 43758.5453; return x - Math.floor(x); });
  return x => { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); const a = tbl[((i % 512) + 512) % 512], b = tbl[(((i + 1) % 512) + 512) % 512]; return a + (b - a) * u; };
}
function ridged(n, x, oct = 5) { let v = 0, a = 0.5, f = 1; for (let i = 0; i < oct; i++) { const r = 1 - Math.abs(n(x * f) * 2 - 1); v += a * r * r; f *= 2.1; a *= 0.5; } return v; }
const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

/* Ufukta yay biçimli sıradağ katmanı (renkler vertex'te; uzak katmanlar soluk) */
function makeRidge({ r, a0 = -2.1, a1 = 2.1, seg = 280, base, h, seed, freq = 3, top, bot, snow, snowAt = 0.6, mask = () => 1, sunA = 0.3, fog = false }) {
  const n = vnoise1(seed), ns = vnoise1(seed + 7);
  const rows = 14, heights = [];
  for (let i = 0; i <= seg; i++) { const a = a0 + (a1 - a0) * i / seg; heights.push(base + h * mask(a) * Math.min(1.25, 0.12 + ridged(n, a * freq + seed) * 1.4)); }
  const cTop = col3(top), cBot = col3(bot), cSnow = snow ? col3(snow) : null, c = new THREE.Color();
  const pos = [], cols = [], idx = [];
  const yBot = base - 420, da = (a1 - a0) / seg;
  for (let i = 0; i <= seg; i++) {
    const a = a0 + da * i, yt = heights[i];
    const slope = (heights[Math.min(seg, i + 1)] - heights[Math.max(0, i - 1)]) / (2 * da * r);
    const lit = -slope * Math.sign(sunA - a || 1);
    const shadeK = 1 + THREE.MathUtils.clamp(lit * 0.7, -0.22, 0.22);
    for (let j = 0; j <= rows; j++) {
      const t = j / rows, y = yt - (yt - yBot) * Math.pow(1 - t, 2.6);
      const rel = (y - base) / h;
      c.copy(cBot).lerp(cTop, smooth(-0.3, 1, rel));
      if (cSnow) {
        const k = smooth(snowAt - 0.03, snowAt + 0.05, rel + (ns(a * 9) - 0.5) * 0.22 + (ns(a * 37 + 3) - 0.5) * 0.08);
        c.lerp(cSnow, k);
      }
      c.multiplyScalar(shadeK);
      pos.push(Math.sin(a) * r, y, Math.cos(a) * r); cols.push(c.r, c.g, c.b);
    }
  }
  for (let i = 0; i < seg; i++) for (let j = 0; j < rows; j++) {
    const p = i * (rows + 1) + j, q = p + rows + 1;
    idx.push(p, q, p + 1, p + 1, q, q + 1);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  geo.setIndex(idx);
  return new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.DoubleSide, fog }));
}

/* Bulut / sis tabakası */
function cloudLayer({ y, radius = 1600, colA, colB, sunCol, sunDir, horizon, scale = 0.004, cover = 0.45, opacity = 1, speed = 0.6, fadeStart = 400, fadeEnd = 1400 }) {
  const mat = new THREE.ShaderMaterial({
    uniforms: {
      uTime: { value: 0 }, uColA: { value: col3(colA) }, uColB: { value: col3(colB) }, uSunCol: { value: col3(sunCol) },
      uSunDir: { value: V3(...sunDir).normalize() }, uHor: { value: col3(horizon) }, uScale: { value: scale }, uCover: { value: cover },
      uOpacity: { value: opacity }, uSpeed: { value: speed }, uFade: { value: new THREE.Vector2(fadeStart, fadeEnd) },
    },
    transparent: true, depthWrite: false, fog: false, side: THREE.DoubleSide,
    vertexShader: `varying vec3 vW; void main(){ vec4 w = modelMatrix*vec4(position,1.); vW = w.xyz; gl_Position = projectionMatrix*viewMatrix*w; }`,
    fragmentShader: `${GLSL_NOISE}
      varying vec3 vW; uniform float uTime,uScale,uCover,uOpacity,uSpeed; uniform vec3 uColA,uColB,uSunCol,uSunDir,uHor; uniform vec2 uFade;
      void main(){
        vec2 p = vW.xz * uScale + vec2(uTime * uSpeed * .01, uTime * uSpeed * .004);
        float n = fbm2(p), n2 = fbm2(p * 2.3 + 3.);
        float cov = smoothstep(uCover, uCover + .25, n * .75 + n2 * .35);
        vec3 v = normalize(vW - cameraPosition);
        float sun = pow(max(dot(normalize(vec3(v.x, 0., v.z)), normalize(vec3(uSunDir.x, 0., uSunDir.z))), 0.), 5.);
        vec3 col = mix(uColA, uColB, smoothstep(.3, .8, n2)) + uSunCol * sun * .6 * (.4 + n);
        float dist = length(vW.xz - cameraPosition.xz);
        float fade = smoothstep(uFade.x, uFade.y, dist);
        col = mix(col, uHor, fade * .9);
        gl_FragColor = vec4(col, cov * uOpacity * (1. - fade * .25));
        ${GLSL_OUT}
      }`,
  });
  const m = new THREE.Mesh(new THREE.CircleGeometry(radius, 64), mat);
  m.rotation.x = -Math.PI / 2; m.position.y = y;
  m.userData.tick = t => { mat.uniforms.uTime.value = t; };
  return m;
}

function spriteTex(size, draw) { return canvasTex(size, size, draw); }

function cloudPuffTex(seedOff = 0) {
  return spriteTex(512, (g, w) => {

function waterNormalsTex() {
  const N = 256, c = document.createElement('canvas'); c.width = c.height = N;
  const g = c.getContext('2d'), img = g.createImageData(N, N);
  const waves = [];
  for (let i = 0; i < 16; i++) waves.push([Math.round(rr(1, 10)) * (rand() < .5 ? -1 : 1), Math.round(rr(1, 10)) * (rand() < .5 ? -1 : 1), rr(0, 6.28), rr(0.4, 1) / Math.sqrt(i + 1)]);
  const Hh = (x, y) => { let s = 0; for (const [kx, ky, ph, a] of waves) s += a * Math.sin(2 * Math.PI * (kx * x + ky * y) / N + ph); return s; };
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const dx = Hh(x + 1, y) - Hh(x - 1, y), dy = Hh(x, y + 1) - Hh(x, y - 1);
    let nx = -dx * 1.4, ny = -dy * 1.4, nz = 1; const l = Math.hypot(nx, ny, nz); nx /= l; ny /= l; nz /= l;
    const o = (y * N + x) * 4; img.data[o] = (nx * .5 + .5) * 255; img.data[o + 1] = (ny * .5 + .5) * 255; img.data[o + 2] = (nz * .5 + .5) * 255; img.data[o + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; return t;
}

/* Su yansıması alırken odanın kendisini gizle (yansımada kitaplıkların arkası görünmesin) */
let roomMeshes = [];
function collectRoomMeshes(exclude) {
  roomMeshes = [];
  for (const o of scene.children) {
    if (o === exclude || o.isLight) continue;
    o.traverse(m => { if ((m.isMesh || m.isPoints || m.isSprite) && !m.isLight) roomMeshes.push(m); });
  }
}
function withRoomHidden(fn) {
  const hidden = [];
  for (const m of roomMeshes) if (m.visible) { m.visible = false; hidden.push(m); }
  try { fn(); } finally { for (const m of hidden) m.visible = true; }
}

  g.add(makeRidge({ r: 260, base: -60, h: 95, seed: 37, freq: 2.2, top: '#5c6584', bot: '#6c6c84', snow: '#efe3de', snowAt: 0.8, sunA }));
  g.add(makeRidge({ r: 150, base: -62, h: 58, seed: 53, freq: 2.9, top: '#37415a', bot: '#2c3444', snow: '#e2e5ee', snowAt: 0.86, sunA, mask: a => 0.5 + 0.5 * smooth(0.2, 1.1, Math.abs(a)) }));

  g.add(mist);
  // ön yamaç: arazi + çam ağaçları
  const n = vnoise1(91);
  const T = (x, z) => -6 - (z - 7) * 0.3 + 0.0032 * x * x + (n(x * 0.05 + z * 0.03) - 0.5) * 6 + (n(x * 0.2 + 40) - 0.5) * 1.5;
  const tg = new THREE.PlaneGeometry(300, 110, 120, 50); tg.rotateX(-Math.PI / 2);
  const tp = tg.attributes.position, tcol = [];
  const cA = col3('#2e3b2a'), cB = col3('#4c4a36'), cc = new THREE.Color();
  for (let i = 0; i < tp.count; i++) {
    const x = tp.getX(i), z = tp.getZ(i) + 62;
    tp.setXYZ(i, x, T(x, z), z);
    cc.copy(cA).lerp(cB, n(x * 0.13 + z * 0.07)); tcol.push(cc.r, cc.g, cc.b);
  }
  tg.setAttribute('color', new THREE.Float32BufferAttribute(tcol, 3)); tg.computeVertexNormals();

  const treeGeo = new THREE.ConeGeometry(1, 1, 7); treeGeo.translate(0, 0.5, 0);
  const N = 520, trees = new THREE.InstancedMesh(treeGeo, new THREE.MeshLambertMaterial({ color: 0xffffff }), N);
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(), p = new THREE.Vector3(), tc = new THREE.Color();
  for (let i = 0; i < N; i++) {
    const z = rr(18, 110), x = rr(-1, 1) * (20 + z * 1.2), hgt = rr(4, 9) * (0.8 + z / 200);
    p.set(x, T(x, z) - 0.5, z); s.set(hgt * 0.27, hgt, hgt * 0.27); m4.compose(p, q, s); trees.setMatrixAt(i, m4);
    tc.set(pick(['#1e3b2b', '#24452f', '#2c4a32', '#1a3226'])).multiplyScalar(rr(0.8, 1.15)); trees.setColorAt(i, tc);
  }
  g.add(trees);

}

function buildFjord(g, cfg) {
  const valley = (lo, hi, floor) => a => floor + (1 - floor) * smooth(lo, hi, Math.abs(a + 0.08));
  g.add(makeRidge({ r: 720, base: -8, h: 150, seed: 61, freq: 2.4, top: '#2b3758', bot: '#1d2640', snow: '#7b88aa', snowAt: 0.45, mask: valley(0.05, 0.6, 0.35) }));
  g.add(makeRidge({ r: 440, base: -8, h: 220, seed: 73, freq: 3, top: '#1f2944', bot: '#141b2e', snow: '#66739a', snowAt: 0.55, mask: valley(0.12, 0.62, 0.12) }));
  g.add(makeRidge({ r: 230, base: -8, h: 190, seed: 89, freq: 3.6, top: '#141c30', bot: '#0d1322', snow: '#56628a', snowAt: 0.66, mask: valley(0.3, 0.75, 0.0) }));
  g.add(makeRidge({ r: 110, base: -8, h: 130, seed: 97, freq: 4.5, top: '#0d1424', bot: '#090d18', snow: '#4b5679', snowAt: 0.78, mask: valley(0.55, 0.95, 0.0) }));
  // kutup ışıkları
  const auroraMat = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 }, uSeed: { value: 0 }, uA: { value: col3('#3dff9a') }, uB: { value: col3('#b44cff') } },
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide, fog: false,
    vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
    fragmentShader: `${GLSL_NOISE}
      varying vec2 vUv; uniform float uTime,uSeed; uniform vec3 uA,uB;
      void main(){
        float n = fbm2(vec2(vUv.x * 9. + uTime * .05 + uSeed, uTime * .03));
        float curtain = pow(noise2(vec2(vUv.x * 70. + n * 9., uTime * .25)), 2.2);
        float vert = smoothstep(0., .12, vUv.y) * pow(1. - vUv.y, 1.5);
        float edge = smoothstep(0., .12, vUv.x) * smoothstep(1., .88, vUv.x);
        float k = (n * .9 + curtain) * vert * edge;
        vec3 col = mix(uA, uB, smoothstep(.3, .95, vUv.y));
        gl_FragColor = vec4(col * k * 1.5, k);
        ${GLSL_OUT}
      }`,
  });
  const auroras = [];
  [[380, -0.9, 0.5, 70, 120, 0], [520, -0.2, 1.2, 95, 150, 3.3], [460, -1.3, -0.3, 60, 90, 6.1]].forEach(([r, a0, a1, y, h, sd]) => {
    const geo = new THREE.PlaneGeometry(1, 1, 180, 1); const p = geo.attributes.position;
    for (let i = 0; i < p.count; i++) {
      const u = p.getX(i) + 0.5, v = p.getY(i) + 0.5, a = a0 + (a1 - a0) * u + Math.sin(u * 5 + sd) * 0.09, rr2 = r + Math.sin(u * 8 + sd) * 40;
      p.setXYZ(i, Math.sin(a) * rr2, y + v * h, Math.cos(a) * rr2);
    }
    const m = auroraMat.clone(); m.uniforms.uSeed.value = sd;
    const mesh = new THREE.Mesh(geo, m); mesh.frustumCulled = false; g.add(mesh); auroras.push(m);
  });
  // ada ve kırmızı kulübe
  const isle = new THREE.Mesh(new THREE.SphereGeometry(1, 16, 8), new THREE.MeshStandardMaterial({ color: 0x141a22, roughness: 1, flatShading: true }));
  isle.scale.set(18, 4, 11); isle.position.set(-22, -9, 120); g.add(isle);
  const cabin = new THREE.Group(); cabin.position.set(-24, -5.6, 118); cabin.rotation.y = 0.5; g.add(cabin);
  const red = new THREE.MeshStandardMaterial({ color: 0x7a1d17, roughness: 0.8 });
  const wall = new THREE.Mesh(new THREE.BoxGeometry(4, 2.4, 3), red); wall.position.y = 1.2; cabin.add(wall);
  const roof = new THREE.Mesh(new THREE.ConeGeometry(3, 1.6, 4), new THREE.MeshStandardMaterial({ color: 0x1d1d22 })); roof.position.y = 3.2; roof.rotation.y = Math.PI / 4; roof.scale.set(1, 1, 0.8); cabin.add(roof);
  const win = new THREE.Mesh(new THREE.PlaneGeometry(0.7, 0.6), new THREE.MeshBasicMaterial({ color: 0xffc66a })); win.position.set(0.8, 1.3, 1.51); cabin.add(win);
  const win2 = win.clone(); win2.position.x = -0.8; cabin.add(win2);
  const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: softDotTex, color: 0xffb04a, transparent: true, opacity: 0.55, blending: THREE.AdditiveBlending, depthWrite: false }));
  glow.scale.set(9, 6, 1); glow.position.set(0, 1.4, 2); cabin.add(glow);
  // su
  const water = new Water(new THREE.PlaneGeometry(2600, 2600), {
    textureWidth: 512, textureHeight: 512, waterNormals: waterNormalsTex(),
    sunDirection: V3(...cfg.sky.sunDir).normalize(), sunColor: 0x9fb3ff, waterColor: 0x02101c, distortionScale: 1.6, fog: false,
  });
  water.rotation.x = -Math.PI / 2; water.position.y = -8; water.material.uniforms.size.value = 3;
  const orig = water.onBeforeRender;
  water.onBeforeRender = function (...args) { withRoomHidden(() => orig.apply(this, args)); };
  g.add(water);
  return (t, dt) => {
    auroras.forEach(m => { m.uniforms.uTime.value = t; });
    water.material.uniforms.time.value += dt * 0.35;
    glow.material.opacity = 0.5 + Math.sin(t * 2.3) * 0.05;
  };
}

/* ---------------- 3) OKYANUSUN DİBİ ---------------- */
function buildUnderwater(g, cfg) {
  const fogCol = col3(cfg.fog.color), fogD = cfg.fog.density;
  const fogUni = () => ({ uFogCol: { value: fogCol }, uFogD: { value: fogD } });
  const FOG = `float fogK(float d){ return 1. - exp(-uFogD*uFogD*d*d); }`;
  // kum zemin + kostik ışık
  const sandMat = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 }, ...fogUni() }, fog: false,
    vertexShader: `varying vec3 vW; void main(){ vec4 w = modelMatrix*vec4(position,1.); vW = w.xyz; gl_Position = projectionMatrix*viewMatrix*w; }`,
    fragmentShader: `${GLSL_NOISE} varying vec3 vW; uniform float uTime, uFogD; uniform vec3 uFogCol; ${FOG}
      void main(){
        vec2 p = vW.xz; float n = fbm2(p * .08);
        float rip = sin(p.x * 1.4 + p.y * .3 + fbm2(p * .25) * 5.) * .5 + .5;
        vec3 sand = mix(vec3(.50,.46,.34), vec3(.78,.72,.55), n) * (.82 + rip * .18);
        sand *= vec3(.4, .6, .68);
        sand += vec3(.45, .8, .9) * caustic(p * .11, uTime * .5) * .45;
        gl_FragColor = vec4(mix(sand, uFogCol, fogK(length(vW - cameraPosition))), 1.);
        ${GLSL_OUT}
      }`,
  });
  const sand = new THREE.Mesh(new THREE.CircleGeometry(1400, 64), sandMat); sand.rotation.x = -Math.PI / 2; sand.position.y = -1.5; g.add(sand);
  // yosun ormanı
  const kelpGeo = new THREE.PlaneGeometry(1, 1, 1, 24); kelpGeo.translate(0, 0.5, 0);
  const kelpMat = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 }, ...fogUni() }, side: THREE.DoubleSide, fog: false,
    vertexShader: `uniform float uTime, uFogD; varying float vY; varying float vFog;
      void main(){
        vec3 p = position; vY = p.y;
        p.x *= (1. - p.y * .55) * (.75 + .35 * sin(p.y * 26.));
        vec4 w = modelMatrix * instanceMatrix * vec4(p, 1.);
        float ph = instanceMatrix[3].x * .37 + instanceMatrix[3].z * .21;
        w.x += sin(uTime * .7 + ph + p.y * 3.) * 1.1 * p.y; w.z += cos(uTime * .5 + ph + p.y * 2.) * .5 * p.y;
        vec4 mv = viewMatrix * w; gl_Position = projectionMatrix * mv;
        float d = length(mv.xyz); vFog = 1. - exp(-uFogD*uFogD*d*d);
      }`,
    fragmentShader: `varying float vY; varying float vFog; uniform vec3 uFogCol;
      void main(){ vec3 c = mix(vec3(.12,.2,.06), vec3(.45,.55,.16), vY); gl_FragColor = vec4(mix(c, uFogCol, vFog), 1.); ${GLSL_OUT} }`,
  });
  const KN = 150, kelp = new THREE.InstancedMesh(kelpGeo, kelpMat, KN);
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(), p = new THREE.Vector3();

    const z = rr(9, 90), x = rr(-1, 1) * (12 + z * 0.9);
    q.setFromEuler(new THREE.Euler(0, rand() * 3.14, 0)); p.set(x, -1.5, z); s.set(rr(0.4, 0.8), rr(5, 17), 1);

  }

  const rockMat = new THREE.MeshStandardMaterial({ color: 0x6d8287, roughness: 1, flatShading: true, emissive: 0x0b3445, emissiveIntensity: 0.6 });
  const coralCols = [0xff7a6b, 0xf5b041, 0xc86bd6, 0x58d6c0, 0xff9fc2];
  for (let i = 0; i < 12; i++) {
    const r = new THREE.Mesh(new THREE.DodecahedronGeometry(1, 0), rockMat); const sc = rr(0.5, 1.8);
    r.scale.set(sc * rr(1, 1.8), sc * rr(0.5, 0.9), sc); r.position.set(rr(-9, 9), -1.5 + sc * 0.3, rr(6.5, 16)); r.rotation.set(rand(), rand() * 3, rand()); g.add(r);
  }
  for (let i = 0; i < 26; i++) {
    const cg = new THREE.Group(); const color = pick(coralCols);
    const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.7, emissive: color, emissiveIntensity: 0.18 });
    const base = V3(rr(-10, 10), -1.5, rr(6.2, 15));
    for (let k = 0; k < 6; k++) {
      const len = rr(0.3, 0.8), br = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.06, len, 6), mat);
      br.position.set(rr(-0.15, 0.15), len / 2, rr(-0.15, 0.15)); br.rotation.set(rr(-0.6, 0.6), 0, rr(-0.6, 0.6)); cg.add(br);
      const tip = new THREE.Mesh(new THREE.SphereGeometry(0.05, 6, 6), mat); tip.position.copy(br.position).multiplyScalar(2).setY(len); cg.add(tip);
    }
    cg.position.copy(base); cg.scale.setScalar(rr(0.8, 1.6)); g.add(cg);
  }
  const star = new THREE.Shape(); for (let k = 0; k < 10; k++) { const a = k / 10 * Math.PI * 2, rad = k % 2 ? 0.07 : 0.2; k ? star.lineTo(Math.cos(a) * rad, Math.sin(a) * rad) : star.moveTo(rad, 0); }
  const starfish = new THREE.Mesh(new THREE.ShapeGeometry(star), new THREE.MeshStandardMaterial({ color: 0xff6a2a, roughness: 0.8, side: THREE.DoubleSide }));
  starfish.rotation.x = -Math.PI / 2; starfish.position.set(1.4, -1.48, 6.4); g.add(starfish);
  // balık sürüleri
  const fs = new THREE.Shape();
  fs.moveTo(0.5, 0); fs.quadraticCurveTo(0.25, 0.24, -0.2, 0.07); fs.lineTo(-0.5, 0.22); fs.lineTo(-0.4, 0); fs.lineTo(-0.5, -0.22); fs.lineTo(-0.2, -0.07); fs.quadraticCurveTo(0.25, -0.2, 0.5, 0);
  const fishMat = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 }, ...fogUni() }, side: THREE.DoubleSide, fog: false,
    vertexShader: `uniform float uTime, uFogD; varying vec3 vCol; varying float vBelly; varying float vFog;
      void main(){
        vec3 p = position; float ph = instanceMatrix[3].x * .7 + instanceMatrix[3].y * 1.3;
        p.z += sin(uTime * 10. + ph) * .13 * smoothstep(.1, -.5, p.x);
        vec4 mv = viewMatrix * modelMatrix * instanceMatrix * vec4(p, 1.); gl_Position = projectionMatrix * mv;
        #ifdef USE_INSTANCING_COLOR
          vCol = instanceColor;
        #else
          vCol = vec3(1.);
        #endif
        vBelly = position.y; float d = length(mv.xyz); vFog = 1. - exp(-uFogD*uFogD*d*d);
      }`,
    fragmentShader: `varying vec3 vCol; varying float vBelly; varying float vFog; uniform vec3 uFogCol;
      void main(){ vec3 c = vCol * (.7 + vBelly * 1.6); gl_FragColor = vec4(mix(c, uFogCol, vFog), 1.); ${GLSL_OUT} }`,
  });
  const schools = [
    { c: V3(0, 3, 28), rx: 26, rz: 14, sp: 0.16, n: 45, col: ['#f2c14e', '#f7d774'], size: 0.45 },
    { c: V3(-8, 6, 45), rx: 40, rz: 20, sp: -0.1, n: 40, col: ['#7fd3e6', '#c3eef7'], size: 0.55 },
    { c: V3(10, 1.5, 18), rx: 14, rz: 7, sp: 0.24, n: 26, col: ['#ff7f50', '#ffffff'], size: 0.32 },
  ];
  const FN = schools.reduce((a, s2) => a + s2.n, 0);
  const fish = new THREE.InstancedMesh(new THREE.ShapeGeometry(fs, 6), fishMat, FN); fish.frustumCulled = false;
  const fishData = []; const fc = new THREE.Color();
  schools.forEach((sc, si) => { for (let i = 0; i < sc.n; i++) { fishData.push({ si, off: V3(rr(-3, 3), rr(-1.5, 1.5), rr(-3, 3)), lag: rr(0, 0.25), size: sc.size * rr(0.8, 1.2), ph: rand() * 6 }); fc.set(pick(sc.col)).multiplyScalar(rr(0.85, 1.1)); fish.setColorAt(fishData.length - 1, fc); } });
  g.add(fish);
  // uzakta geçen balina
  const wh = new THREE.Shape();
  wh.moveTo(0.5, 0.02); wh.bezierCurveTo(0.48, 0.12, 0.3, 0.14, 0.05, 0.11); wh.bezierCurveTo(-0.2, 0.08, -0.35, 0.04, -0.42, 0.02);
  wh.lineTo(-0.52, 0.1); wh.lineTo(-0.5, 0.0); wh.lineTo(-0.52, -0.09); wh.lineTo(-0.42, -0.01);
  wh.bezierCurveTo(-0.3, -0.06, -0.05, -0.1, 0.12, -0.09); wh.lineTo(0.05, -0.2); wh.lineTo(0.18, -0.085); wh.bezierCurveTo(0.35, -0.08, 0.5, -0.06, 0.5, 0.02);
  const whale = new THREE.Mesh(new THREE.ShapeGeometry(wh, 10), new THREE.MeshBasicMaterial({ color: 0x0a2a40, side: THREE.DoubleSide, fog: true }));
  whale.scale.set(30, 30, 30); g.add(whale);
  // ışık huzmeleri
  const rayMat = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 }, uSeed: { value: 0 } }, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide, fog: false,
    vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
    fragmentShader: `varying vec2 vUv; uniform float uTime, uSeed;
      void main(){ float x = 1. - abs(vUv.x - .5) * 2.; float k = x * x * pow(vUv.y, 1.3) * (.55 + .45 * sin(uTime * .35 + uSeed)) * .16;
        gl_FragColor = vec4(vec3(.7, .95, 1.) * k, k); ${GLSL_OUT} }`,
  });
  const rays = [];
  for (let i = 0; i < 9; i++) {
    const m = rayMat.clone(); m.uniforms.uSeed.value = i * 1.7;
    const r = new THREE.Mesh(new THREE.PlaneGeometry(rr(4, 9), 80), m);
    r.position.set(rr(-30, 30), 36, rr(14, 70)); r.rotation.z = rr(-0.3, 0.1); g.add(r); rays.push(r);
  }
  // kabarcıklar
  const BN = 180, bpos = new Float32Array(BN * 3), bsp = [];
  for (let i = 0; i < BN; i++) { bpos[i * 3] = rr(-8, 8); bpos[i * 3 + 1] = rr(-1.5, 14); bpos[i * 3 + 2] = rr(5.4, 12); bsp.push(rr(0.5, 1.4)); }
  const bgeo = new THREE.BufferGeometry(); bgeo.setAttribute('position', new THREE.BufferAttribute(bpos, 3));
  const bubbles = new THREE.Points(bgeo, new THREE.PointsMaterial({ map: softDotTex, size: 0.09, color: 0xd8f6ff, transparent: true, opacity: 0.75, depthWrite: false, fog: true }));
  g.add(bubbles);
  const tmpM = new THREE.Matrix4(), fwdV = new THREE.Vector3(), upV = new THREE.Vector3(), sideV = new THREE.Vector3(), pos = new THREE.Vector3(), sc3 = new THREE.Vector3();
  return (t, dt) => {
    sandMat.uniforms.uTime.value = t; kelpMat.uniforms.uTime.value = t; fishMat.uniforms.uTime.value = t;
    rays.forEach(r => { r.material.uniforms.uTime.value = t; r.rotation.y = Math.atan2(camera.position.x - r.position.x, camera.position.z - r.position.z); });
    fishData.forEach((f, i) => {
      const sc = schools[f.si], a = t * sc.sp - f.lag + f.ph * 0.02;
      pos.set(sc.c.x + Math.cos(a) * sc.rx, sc.c.y + Math.sin(a * 2) * 1.5, sc.c.z + Math.sin(a) * sc.rz).add(f.off);
      pos.y += Math.sin(t * 1.3 + f.ph) * 0.15;
      fwdV.set(-Math.sin(a) * sc.rx, Math.cos(a * 2) * 3, Math.cos(a) * sc.rz).multiplyScalar(Math.sign(sc.sp)).normalize();
      upV.set(0, 1, 0); sideV.crossVectors(fwdV, upV).normalize(); upV.crossVectors(sideV, fwdV);
      tmpM.makeBasis(fwdV, upV, sideV); sc3.setScalar(f.size); tmpM.scale(sc3); tmpM.setPosition(pos);
      fish.setMatrixAt(i, tmpM);
    });
    fish.instanceMatrix.needsUpdate = true;
    const wt = (t * 3.2) % 520 - 260;
    whale.position.set(wt, 9 + Math.sin(t * 0.2) * 2, 140); whale.rotation.z = Math.sin(t * 0.4) * 0.05;
    const bp = bubbles.geometry.attributes.position.array;
    for (let i = 0; i < BN; i++) { bp[i * 3 + 1] += bsp[i] * dt; bp[i * 3] += Math.sin(t * 3 + i) * 0.003; if (bp[i * 3 + 1] > 14) bp[i * 3 + 1] = -1.5; }
    bubbles.geometry.attributes.position.needsUpdate = true;
  };
}

function buildClouds(g, cfg) {
  const sunA = Math.atan2(cfg.sky.sunDir[0], cfg.sky.sunDir[2]);
  const peaks = a => Math.exp(-((a + 0.55) ** 2) / 0.02) + 0.8 * Math.exp(-((a - 0.85) ** 2) / 0.012) + 0.55 * Math.exp(-((a - 1.4) ** 2) / 0.02);
  g.add(makeRidge({ r: 520, base: -30, h: 110, seed: 5, freq: 5, top: '#6b5578', bot: '#4a3b5c', snow: '#ffd2bd', snowAt: 0.35, mask: peaks, sunA }));
  const sea = cloudLayer({ y: -30, colA: '#a58bbf', colB: '#ffd6c2', sunCol: '#ff9a55', sunDir: cfg.sky.sunDir, horizon: cfg.sky.hor, scale: 0.005, cover: 0.12, opacity: 1, speed: 0.5, fadeStart: 300, fadeEnd: 1300 });
  const high = cloudLayer({ y: 140, colA: '#ff9db0', colB: '#ffd9b0', sunCol: '#ffb070', sunDir: cfg.sky.sunDir, horizon: cfg.sky.hor, scale: 0.0022, cover: 0.55, opacity: 0.55, speed: 0.3, fadeStart: 500, fadeEnd: 1400 });
  g.add(sea, high);
  const puffs = [];
  for (let i = 0; i < 9; i++) {
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: cloudPuffTex(), color: pick([0xffd9c8, 0xffc7b8, 0xf2c6d8]), transparent: true, depthWrite: false, fog: false }));
    const a = rr(-1.3, 1.3), d = rr(140, 420), sz = rr(60, 150);
    sp.position.set(Math.sin(a) * d, rr(-22, 10), Math.cos(a) * d); sp.scale.set(sz * 1.6, sz, 1); g.add(sp); puffs.push({ sp, a, d, v: rr(0.002, 0.006) });
  }
  // sıcak hava balonu
  const balloonTex = canvasTex(512, 256, (c, w, h) => { const cs = ['#d64545', '#f2c14e', '#3a7bd5', '#f2f2f2']; for (let i = 0; i < 16; i++) { c.fillStyle = cs[i % 4]; c.fillRect(i * w / 16, 0, w / 16 + 1, h); } });
  const balloon = new THREE.Group();
  const env = new THREE.Mesh(new THREE.SphereGeometry(4, 24, 16), new THREE.MeshStandardMaterial({ map: balloonTex, roughness: 0.7 })); env.scale.y = 1.2; balloon.add(env);
  const basket = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1, 1.2), new THREE.MeshStandardMaterial({ color: 0x6b4a2a })); basket.position.y = -6.3; balloon.add(basket);
  const flame = new THREE.Sprite(new THREE.SpriteMaterial({ map: softDotTex, color: 0xffa040, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false })); flame.position.y = -5.2; flame.scale.set(1.5, 1.5, 1); balloon.add(flame);
  g.add(balloon);
  return t => {
    sea.userData.tick(t); high.userData.tick(t);
    puffs.forEach(p => { const a = p.a + Math.sin(t * p.v) * 0.15; p.sp.position.x = Math.sin(a) * p.d; p.sp.position.z = Math.cos(a) * p.d; });
    balloon.position.set(40 + Math.sin(t * 0.02) * 30, 4 + Math.sin(t * 0.25) * 1.5, 110);
    flame.material.opacity = 0.4 + Math.max(0, Math.sin(t * 0.7)) * 0.6 * (0.8 + Math.random() * 0.2);
  };
}

function buildSpace(g, cfg) {
  const sunDir = V3(...cfg.sky.sunDir).normalize();
  const earthMat = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 }, uSunDir: { value: sunDir } }, fog: false,
    vertexShader: `varying vec3 vObjN; varying vec3 vWN; varying vec3 vWP;
      void main(){ vObjN = normal; vWN = normalize(mat3(modelMatrix) * normal); vec4 w = modelMatrix * vec4(position, 1.); vWP = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
    fragmentShader: `${GLSL_NOISE} varying vec3 vObjN; varying vec3 vWN; varying vec3 vWP; uniform float uTime; uniform vec3 uSunDir;
      void main(){
        vec3 n = normalize(vObjN);
        float cont = fbm3(n * 2.1 + 3.); float land = smoothstep(.5, .53, cont); float elev = fbm3(n * 7.);
        vec3 ocean = mix(vec3(.01,.05,.16), vec3(.02,.13,.3), smoothstep(.3, .5, cont));
        vec3 ground = mix(vec3(.12,.24,.08), vec3(.45,.38,.24), smoothstep(.45, .7, elev));
        float lat = abs(n.y);
        ground = mix(ground, vec3(.92), smoothstep(.78, .86, lat)); ocean = mix(ocean, vec3(.85,.9,.95), smoothstep(.86, .92, lat));
        vec3 base = mix(ocean, ground, land);
        float cl = fbm3(n * 4. + vec3(uTime * .004, 0., uTime * .002)); float clouds = smoothstep(.52, .75, cl);
        vec3 wn = normalize(vWN); float ndl = dot(wn, normalize(uSunDir)); float day = smoothstep(-.1, .25, ndl);
        vec3 col = base * max(ndl, 0.) * 1.4; col = mix(col, vec3(1.) * max(ndl, 0.) * 1.15, clouds * .9);
        vec3 v = normalize(cameraPosition - vWP); vec3 hf = normalize(normalize(uSunDir) + v);
        col += vec3(1., .9, .7) * pow(max(dot(wn, hf), 0.), 60.) * (1. - land) * (1. - clouds) * day * .7;
        float city = step(.8, hash13(floor(n * 240.))) * land * (1. - clouds) * smoothstep(.52, .6, fbm3(n * 9.));
        col += vec3(1., .72, .32) * city * (1. - day) * 1.6;
        float rim = pow(1. - max(dot(wn, v), 0.), 3.);
        col += vec3(.3, .55, 1.) * rim * (.15 + .85 * day);
        gl_FragColor = vec4(col, 1.);
        ${GLSL_OUT}
      }`,
  });
  const earth = new THREE.Mesh(new THREE.SphereGeometry(260, 160, 80), earthMat);
  earth.position.set(0, -330, 300); earth.rotation.z = 0.41; g.add(earth);
  const atmo = new THREE.Mesh(new THREE.SphereGeometry(272, 96, 48), new THREE.ShaderMaterial({
    uniforms: { uSunDir: { value: sunDir } }, side: THREE.BackSide, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, fog: false,
    vertexShader: `varying vec3 vWN; varying vec3 vWP; void main(){ vWN = normalize(mat3(modelMatrix) * normal); vec4 w = modelMatrix * vec4(position,1.); vWP = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
    fragmentShader: `varying vec3 vWN; varying vec3 vWP; uniform vec3 uSunDir;
      void main(){ vec3 v = normalize(cameraPosition - vWP); float k = pow(max(0., .62 + dot(vWN, v)), 3.5) * 2.2;
        float day = smoothstep(-.3, .4, dot(-vWN, normalize(uSunDir)));
        gl_FragColor = vec4(vec3(.35, .6, 1.) * k * (.2 + .8 * day), 1.); ${GLSL_OUT} }`,
  }));
  atmo.position.copy(earth.position); g.add(atmo);
  const moon = new THREE.Mesh(new THREE.SphereGeometry(16, 48, 24), new THREE.ShaderMaterial({
    uniforms: { uSunDir: { value: sunDir } }, fog: false,
    vertexShader: `varying vec3 vN; varying vec3 vO; void main(){ vO = normal; vN = normalize(mat3(modelMatrix) * normal); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
    fragmentShader: `${GLSL_NOISE} varying vec3 vN; varying vec3 vO; uniform vec3 uSunDir;
      void main(){ float c = fbm3(vO * 3.); float cr = smoothstep(.55, .6, fbm3(vO * 9.)); vec3 base = vec3(.55) * (.75 + c * .5) - cr * .12;
        gl_FragColor = vec4(base * max(dot(normalize(vN), normalize(uSunDir)), 0.) * 1.3, 1.); ${GLSL_OUT} }`,
  }));
  moon.position.set(-300, 160, 700); g.add(moon);
  // geçen uydu
  const sat = new THREE.Group();
  const metal = new THREE.MeshStandardMaterial({ color: 0xd8d8d8, metalness: 0.8, roughness: 0.3 });
  const panel = new THREE.MeshStandardMaterial({ color: 0x1b3a8a, metalness: 0.5, roughness: 0.25, emissive: 0x0a1a40 });
  sat.add(new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.6, 2.4, 12), metal));
  for (const sx of [-1, 1]) { const pnl = new THREE.Mesh(new THREE.BoxGeometry(4, 0.05, 1.4), panel); pnl.position.x = sx * 2.6; sat.add(pnl); }
  sat.rotation.z = Math.PI / 2; g.add(sat);
  return t => {
    earthMat.uniforms.uTime.value = t; earth.rotation.y = t * 0.006;
    const st = (t * 0.012) % 2;
    sat.position.set(-120 + st * 140, 30 + Math.sin(st * 3) * 6, 90); sat.rotation.x = t * 0.1;
  };
}

const fwd = new THREE.Vector3(), up = new THREE.Vector3();
function frontPose() {
  camera.updateMatrixWorld();
  camera.getWorldDirection(fwd);
  const dist = innerWidth / innerHeight < 0.8 ? 0.95 : 0.78;
  const pos = camera.position.clone().addScaledVector(fwd, dist);
  const x = fwd.clone().negate();
  up.set(0, 1, 0).applyQuaternion(camera.quaternion);
  const z = new THREE.Vector3().crossVectors(x, up).normalize();
  const y = new THREE.Vector3().crossVectors(z, x).normalize();

  return { pos, quat };
}
function homeWorld(book) {
  const { parent, pos, quat } = book.userData.home;
  parent.updateMatrixWorld();
  const pulled = pos.clone(); pulled.z += 0.38;
  const wp = pulled.applyMatrix4(parent.matrixWorld);
  const wq = parent.getWorldQuaternion(new THREE.Quaternion()).multiply(quat);
  const hp = pos.clone().applyMatrix4(parent.matrixWorld);

}

  Sound.thud();

  scene.attach(book);
  const p0 = book.position.clone(), q0 = book.quaternion.clone();
  book.userData.pull = 0;
  tween(0.32, k => { book.position.lerpVectors(p0, hw.pulled, k); }, () => {

    const p1 = book.position.clone(), q1 = book.quaternion.clone();

    Sound.swish(0.5, 900, 2400, 0.2);

      const a = p1.clone().lerp(mid, k), b = mid.clone().lerp(fp.pos, k);

}

}
