<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Başvuru Kütüphanesi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&family=Alegreya+Sans+SC:wght@500;700&family=Caveat:wght@500;600&display=swap">
<style>
/* Layout: tam ekran 3D oda; üstte ince pirinç levhalı HUD, kitap açılınca ortada iki sayfalık cilt. Tek, bilinçli gece görünümü. */
:root {
  color-scheme: dark;
  --night: #0d0a09;          /* oda karanlığı */
  --hud: rgba(22, 16, 13, .82);
  --hud-line: rgba(201, 162, 74, .28);
  --hud-fg: #efe3c8;
  --hud-dim: #b4a587;
  --gold: #c9a24a;
  --gold-hi: #f0d68e;
  --paper: #f1e6cb;
  --paper-deep: #e2d1aa;
  --paper-edge: #c9b285;
  --ink: #23202e;            /* mürekkep: koyu mor-lacivert */
  --ink-soft: #5b5466;
  --leather: #4b1d1d;
  --urgent: #a3262f;
  --open: #3b6e4a;
  --soon: #b07f22;
  --closed: #77706a;
  --f-display: "Cormorant Garamond", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --f-body: "Alegreya", "Iowan Old Style", Georgia, serif;
  --f-label: "Alegreya Sans SC", "Gill Sans", "Trebuchet MS", sans-serif;
  --f-hand: "Caveat", "Segoe Print", "Bradley Hand", cursive;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden; background: var(--night); color: var(--hud-fg);
  font: 16px/1.45 var(--f-body);
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 3px; }

#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#scene.dragging { cursor: grabbing; }
#scene.pointing { cursor: pointer; }

/* ---------- HUD ---------- */
.hud {
  position: fixed; left: 0; right: 0; top: 0; z-index: 5; pointer-events: none;
  display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
  padding: calc(env(safe-area-inset-top, 0px) + 14px) 16px 0;
}
.plate {
  pointer-events: auto; min-width: 0;
  background: linear-gradient(180deg, rgba(40, 29, 22, .9), var(--hud));
  border: 1px solid var(--hud-line); border-radius: 3px;
  box-shadow: 0 10px 30px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,230,170,.08);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
}
.title-plate { padding: 10px 14px 10px; max-width: min(420px, 62vw); }
.title-plate h1 {
  margin: 0; font: italic 600 1.55rem/1.05 var(--f-display); letter-spacing: .01em; color: var(--gold-hi);
  text-wrap: balance;
}
.title-plate .sub { margin-top: 3px; font: 500 .78rem/1.3 var(--f-label); letter-spacing: .08em; color: var(--hud-dim); }
.next-up {
  display: block; width: 100%; margin-top: 8px; padding: 7px 0 0; text-align: left; background: none; border: 0;
  border-top: 1px solid var(--hud-line); font: .86rem/1.3 var(--f-body); color: var(--hud-fg);
}
.next-up b { color: var(--gold-hi); font-weight: 500; }
.next-up .lbl { display: block; font: 500 .7rem/1.2 var(--f-label); letter-spacing: .1em; color: var(--hud-dim); }
.next-up:hover b { text-decoration: underline; text-underline-offset: 3px; }

.hud-actions { display: flex; gap: 8px; pointer-events: auto; flex-shrink: 0; }
.hud-btn {
  display: inline-flex; align-items: center; gap: 7px; padding: 9px 13px;
  font: 700 .82rem/1 var(--f-label); letter-spacing: .1em; color: var(--hud-fg);
}
.hud-btn svg { width: 17px; height: 17px; stroke: var(--gold-hi); fill: none; stroke-width: 1.6; }
.hud-btn:hover { border-color: rgba(240, 214, 142, .6); }
.hud-btn[aria-pressed="true"] { color: var(--gold-hi); border-color: rgba(240, 214, 142, .6); }

.legend {
  position: fixed; left: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); z-index: 5;
  display: flex; gap: 14px; flex-wrap: wrap; padding: 8px 12px; max-width: calc(100% - 32px);
  font: 500 .74rem/1.2 var(--f-label); letter-spacing: .08em; color: var(--hud-dim);
}
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 7px; height: 13px; border-radius: 1px 1px 0 0; display: inline-block; }
.hint {
  position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 64px); z-index: 4; transform: translateX(-50%);
  pointer-events: none; padding: 8px 14px; border-radius: 999px; white-space: nowrap;
  background: rgba(12, 9, 8, .6); color: var(--hud-fg); font: italic .95rem/1.2 var(--f-body);
  transition: opacity .8s ease;
}
.hint.gone { opacity: 0; }

.tooltip {
  position: fixed; z-index: 6; pointer-events: none; left: 0; top: 0; max-width: 280px;
  padding: 8px 11px 9px; border-radius: 2px;
  background: var(--paper); color: var(--ink); box-shadow: 0 8px 24px rgba(0,0,0,.5);
  border-left: 3px solid var(--gold);
  font: .85rem/1.3 var(--f-body); transform: translate(14px, 14px); transition: opacity .15s;
}
.tooltip strong { display: block; font: 600 1.05rem/1.15 var(--f-display); }
.tooltip .tt-status { display: block; margin-top: 4px; font: 700 .7rem/1.2 var(--f-label); letter-spacing: .08em; }

/* ---------- Intro ---------- */
.intro {
  position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; text-align: center;
  background: radial-gradient(ellipse at center, rgba(30, 20, 14, .65), rgba(8, 6, 5, .96) 70%);
  transition: opacity 1.4s ease, visibility 1.4s; padding: 16px;
}
.intro.gone { opacity: 0; visibility: hidden; }
.intro .mark { font: 500 .8rem/1 var(--f-label); letter-spacing: .3em; color: var(--hud-dim); }
.intro h2 { margin: 14px 0 10px; font: italic 600 clamp(2.4rem, 8vw, 4.6rem)/1 var(--f-display); color: var(--gold-hi); text-wrap: balance; }
.intro p { margin: 0; font: italic 1.05rem/1.4 var(--f-body); color: var(--hud-fg); }
.intro .loading { margin-top: 22px; font: 500 .75rem/1 var(--f-label); letter-spacing: .2em; color: var(--hud-dim); }

/* ---------- Katalog çekmecesi ---------- */
.drawer {
  position: fixed; z-index: 12; top: 0; right: 0; bottom: 0; width: min(420px, 100%);
  display: flex; flex-direction: column;
  background: linear-gradient(180deg, #2a1d15, #1c1410); border-left: 1px solid var(--hud-line);
  box-shadow: -20px 0 60px rgba(0,0,0,.55);
  transform: translateX(105%); transition: transform .45s cubic-bezier(.2,.8,.2,1);
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
.drawer.open { transform: none; }
.drawer header { padding: 18px 16px 12px; border-bottom: 1px solid var(--hud-line); }
.drawer header .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.drawer h2 { margin: 0; font: italic 600 1.6rem/1 var(--f-display); color: var(--gold-hi); }
.icon-btn { background: none; border: 1px solid var(--hud-line); border-radius: 3px; width: 36px; height: 36px; display: grid; place-items: center; }
.icon-btn svg { width: 16px; height: 16px; stroke: var(--hud-fg); stroke-width: 1.8; fill: none; }
.search {
  margin-top: 12px; width: 100%; padding: 9px 11px; border-radius: 2px; border: 1px solid var(--hud-line);
  background: rgba(0,0,0,.25); color: var(--hud-fg); font: 1rem/1.2 var(--f-body);
}
.search::placeholder { color: var(--hud-dim); font-style: italic; }
.drawer .scroll { overflow-y: auto; flex: 1; padding: 6px 16px 24px; overscroll-behavior: contain; }
.agenda { margin: 10px 0 6px; padding: 10px 12px; border: 1px dashed var(--hud-line); border-radius: 2px; }
.agenda h3, .cat-group h3 { margin: 0 0 6px; font: 700 .72rem/1.2 var(--f-label); letter-spacing: .14em; color: var(--hud-dim); }
.agenda ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.agenda li button {
  width: 100%; text-align: left; background: none; border: 0; padding: 3px 0; display: grid;
  grid-template-columns: 4.4em 1fr auto; gap: 8px; align-items: baseline; font: .9rem/1.25 var(--f-body);
}
.agenda .d { font-variant-numeric: tabular-nums; color: var(--gold-hi); font-weight: 500; }
.agenda .left { font: 700 .7rem/1 var(--f-label); letter-spacing: .06em; color: var(--hud-dim); white-space: nowrap; }
.cat-group { margin-top: 16px; }
.cat-group h3 { display: flex; align-items: center; gap: 8px; }
.cat-item {
  width: 100%; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; text-align: left;
  padding: 9px 10px; margin: 0; background: rgba(255, 240, 210, .03); border: 1px solid transparent;
  border-bottom-color: rgba(201,162,74,.12);
}
.cat-item:hover { background: rgba(255, 240, 210, .08); border-color: var(--hud-line); }
.cat-item .n { font: 600 1.08rem/1.15 var(--f-display); color: var(--hud-fg); min-width: 0; }
.cat-item .p { grid-column: 1; font: italic .82rem/1.25 var(--f-body); color: var(--hud-dim); min-width: 0; }
.cat-item .qs { grid-row: 1; grid-column: 2; font: 700 .72rem/1 var(--f-label); letter-spacing: .08em; color: var(--gold); font-variant-numeric: tabular-nums; }
.cat-item .chip { grid-row: 2; grid-column: 2; justify-self: end; }
.chip {
  display: inline-block; padding: 3px 7px 3px; border-radius: 2px; white-space: nowrap;
  font: 700 .64rem/1 var(--f-label); letter-spacing: .08em; color: #fff4e0; background: var(--closed);
}
.chip.open { background: var(--open); }
.chip.urgent { background: var(--urgent); }
.chip.soon { background: var(--soon); }
.chip.unknown { background: transparent; color: var(--hud-dim); border: 1px solid var(--hud-line); }
.flag { display: inline-block; width: 21px; height: 14px; border-radius: 1px; box-shadow: 0 0 0 1px rgba(0,0,0,.25); flex-shrink: 0; vertical-align: -2px; }
.empty-search { margin-top: 18px; font-style: italic; color: var(--hud-dim); }

/* ---------- Okuma: açılan kitap ---------- */
.reader { position: fixed; inset: 0; z-index: 15; display: grid; place-items: center; padding: 16px; }
.reader-backdrop {
  position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(20, 13, 9, .55), rgba(6, 4, 3, .88));
  backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); animation: fade .5s ease both;
}
.tome {
  position: relative; width: min(1000px, 100%); height: min(660px, calc(100% - 96px));
  margin-bottom: 48px; perspective: 2400px;
}
.spread {
  position: absolute; inset: 0; display: grid; grid-template-columns: 1fr 1fr;
  padding: 14px; border-radius: 6px;
  background: linear-gradient(90deg, #3b1717, #5a2222 48%, #2a0f0f 50%, #5a2222 52%, #3b1717);
  box-shadow: 0 40px 90px rgba(0,0,0,.65), 0 0 0 1px rgba(0,0,0,.4);
  animation: spreadIn .9s cubic-bezier(.2,.8,.2,1) both;
}
.page {
  position: relative; min-width: 0; overflow-y: auto; overscroll-behavior: contain;
  background:
    radial-gradient(ellipse at 30% 20%, rgba(255,255,255,.35), transparent 60%),
    radial-gradient(ellipse at 80% 90%, rgba(150,110,50,.12), transparent 55%),
    var(--paper);
  color: var(--ink); padding: 34px 36px 46px;
  scrollbar-width: thin; scrollbar-color: var(--paper-edge) transparent;
}
.page.left { border-radius: 3px 0 0 3px; box-shadow: inset -26px 0 30px -18px rgba(90, 60, 20, .45); }
.page.right { border-radius: 0 3px 3px 0; box-shadow: inset 26px 0 30px -18px rgba(90, 60, 20, .45); }
.folio { position: absolute; bottom: 14px; font: italic .85rem/1 var(--f-display); color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.page.left .folio { left: 36px; }
.page.right .folio { right: 36px; }

.cover-flap {
  position: absolute; top: 0; bottom: 0; left: 50%; width: 50%; transform-origin: left center;
  transform-style: preserve-3d; animation: coverOpen 1.15s cubic-bezier(.55,.05,.25,1) .1s both; z-index: 3;
  pointer-events: none;
}
.cover-flap .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 0 6px 6px 0; }
.cover-flap .front {
  display: grid; place-items: center; text-align: center; padding: 40px;
  background: radial-gradient(ellipse at 40% 30%, rgba(255,255,255,.08), transparent 60%), var(--cover, var(--leather));
  box-shadow: inset 0 0 0 10px rgba(0,0,0,.18), inset 0 0 0 12px rgba(240,214,142,.55), inset 0 0 0 18px rgba(0,0,0,0), inset 0 0 0 19px rgba(240,214,142,.35);
}
.cover-flap .front h3 { margin: 0; font: 600 2rem/1.1 var(--f-display); color: var(--gold-hi); text-shadow: 0 1px 0 rgba(0,0,0,.5); text-wrap: balance; }
.cover-flap .back {
  transform: rotateY(180deg); border-radius: 6px 0 0 6px;
  background:
    repeating-radial-gradient(circle at 20% 30%, #26354f 0 6px, #3a4d6c 6px 9px, #1c2840 9px 14px),
    #26354f;
}
.leaf {
  position: absolute; top: 14px; bottom: 14px; left: 50%; width: calc(50% - 14px); transform-origin: left center; z-index: 4;
  background: linear-gradient(90deg, var(--paper-deep), var(--paper)); border-radius: 0 3px 3px 0;
  box-shadow: 0 0 30px rgba(0,0,0,.25); pointer-events: none;
}
.leaf.fwd { animation: leafFwd .6s cubic-bezier(.45,.05,.3,1) both; }
.leaf.back { left: 14px; transform-origin: right center; border-radius: 3px 0 0 3px; animation: leafBack .6s cubic-bezier(.45,.05,.3,1) both; }
.reader.closing .spread, .reader.closing .reader-backdrop { animation: fadeOut .35s ease both; }
.reader.closing .tome { animation: shrink .35s ease both; }

.reader-nav {
  position: absolute; left: 0; right: 0; bottom: -46px; display: flex; justify-content: center; gap: 10px; z-index: 5;
}
.reader-nav .hud-btn { pointer-events: auto; }
.reader-close { position: absolute; top: -18px; right: -14px; z-index: 6; width: 40px; height: 40px; border-radius: 50%; background: #2a1d15; }

@keyframes fade { from { opacity: 0 } }
@keyframes fadeOut { to { opacity: 0 } }
@keyframes shrink { to { transform: scale(.94); opacity: 0 } }
@keyframes spreadIn { from { transform: scale(.82) translateY(30px); opacity: 0 } }
@keyframes coverOpen { 0% { transform: rotateY(0) } 85% { opacity: 1 } 100% { transform: rotateY(-180deg); opacity: 0 } }
@keyframes leafFwd { from { transform: rotateY(0) } to { transform: rotateY(-180deg) } }
@keyframes leafBack { from { transform: rotateY(0) } to { transform: rotateY(180deg) } }

/* sayfa içeriği */
.eyebrow { display: flex; justify-content: space-between; gap: 10px; font: 700 .7rem/1.2 var(--f-label); letter-spacing: .16em; color: var(--ink-soft); }
.place { margin-top: 22px; display: flex; align-items: center; gap: 10px; font: 700 .82rem/1.2 var(--f-label); letter-spacing: .12em; color: var(--ink-soft); }
.uni-name { margin: 8px 0 0; font: 600 clamp(1.9rem, 3.4vw, 2.7rem)/1.02 var(--f-display); color: var(--ink); text-wrap: balance; }
.program { margin: 10px 0 0; font: italic 1.08rem/1.35 var(--f-body); color: var(--ink-soft); max-width: 32em; }
.fleuron { display: block; margin: 22px auto; width: 140px; height: 16px; color: var(--paper-edge); }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 18px; margin: 0; }
.facts dt { font: 700 .68rem/1.2 var(--f-label); letter-spacing: .14em; color: var(--ink-soft); }
.facts dd { margin: 3px 0 0; font: 500 1.15rem/1.2 var(--f-body); }
.qs-block { margin-top: 26px; display: flex; align-items: flex-end; gap: 16px; }
.qs-seal {
  flex-shrink: 0; width: 112px; height: 112px; border-radius: 50%; display: grid; place-items: center; text-align: center;
  background: radial-gradient(circle at 35% 30%, #c0393f, #861b22 60%, #5e1016);
  color: #fbe7c4; box-shadow: 0 6px 14px rgba(80, 10, 10, .35), inset 0 0 0 5px rgba(0,0,0,.12), inset 0 0 0 7px rgba(251,231,196,.35);
  transform: rotate(-8deg);
}
.qs-seal small { display: block; font: 700 .6rem/1 var(--f-label); letter-spacing: .14em; }
.qs-seal b { display: block; font: 700 2.3rem/1 var(--f-display); font-variant-numeric: tabular-nums; }
.qs-text { font: .95rem/1.35 var(--f-body); color: var(--ink-soft); padding-bottom: 6px; }
.qs-text strong { display: block; font: 700 .7rem/1.2 var(--f-label); letter-spacing: .14em; color: var(--ink); }

.section-h { margin: 0 0 8px; font: 700 .72rem/1.2 var(--f-label); letter-spacing: .16em; color: var(--ink-soft); display: flex; justify-content: space-between; gap: 10px; }
.section + .section { margin-top: 26px; }
.fee { font: 600 2.1rem/1 var(--f-display); font-variant-numeric: tabular-nums; }
.missing { font: italic 1rem/1.35 var(--f-body); color: var(--ink-soft); }
.timeline { position: relative; margin-top: 4px; }
.tl-ends { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.tl-ends div:last-child { text-align: right; }
.tl-ends small { display: block; font: 700 .64rem/1.2 var(--f-label); letter-spacing: .14em; color: var(--ink-soft); }
.tl-ends b { display: block; font: 600 1.35rem/1.15 var(--f-display); font-variant-numeric: tabular-nums; }
.tl-ends em { display: block; font: italic .8rem/1.25 var(--f-body); color: var(--ink-soft); }
.tl-bar { position: relative; margin: 12px 0 10px; height: 6px; border-radius: 3px; background: rgba(35, 32, 46, .12); }
.tl-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--ink); }
.tl-today { position: absolute; top: -5px; width: 2px; height: 16px; background: var(--urgent); }
.tl-today::after { content: "bugün"; position: absolute; top: 18px; left: 50%; transform: translateX(-50%); font: italic .72rem/1 var(--f-body); color: var(--urgent); white-space: nowrap; }
.status-line { margin-top: 24px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font: 1rem/1.3 var(--f-body); }

.todo { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.todo label { display: grid; grid-template-columns: 22px 1fr; gap: 8px; align-items: start; cursor: pointer; font: 500 1.28rem/1.12 var(--f-hand); color: #2c3a6a; }
.todo input { appearance: none; -webkit-appearance: none; margin: 4px 0 0; width: 18px; height: 18px; border: 1.6px solid #2c3a6a; border-radius: 2px; display: grid; place-items: center; cursor: pointer; background: transparent; }
.todo input:checked::after { content: ""; width: 10px; height: 5px; border-left: 2px solid #2c3a6a; border-bottom: 2px solid #2c3a6a; transform: rotate(-45deg) translate(1px, -1px); }
.todo input:checked + span { text-decoration: line-through; text-decoration-color: rgba(44,58,106,.6); opacity: .6; }
.todo-none { font: 500 1.35rem/1.15 var(--f-hand); color: var(--open); }
.todo-count { font-variant-numeric: tabular-nums; letter-spacing: .06em; }

@media (max-width: 760px) {
  .tome { height: calc(100% - 84px); margin-bottom: 56px; margin-top: 10px; }
  .spread { grid-template-columns: 1fr; overflow-y: auto; padding: 10px; display: block; }
  .page { overflow: visible; padding: 26px 22px 40px; border-radius: 3px !important; box-shadow: none !important; }
  .page.left { padding-bottom: 8px; }
  .page.left .folio { display: none; }
  .cover-flap { left: 0; width: 100%; }
  .leaf { left: 10px; width: calc(100% - 20px); top: 10px; bottom: 10px; }
  .leaf.back { left: 10px; }
  .reader-close { top: -14px; right: -6px; }
  .reader-nav { bottom: -54px; }
  .title-plate { max-width: calc(100vw - 140px); }
  .title-plate h1 { font-size: 1.25rem; }
  .hud-btn .txt { display: none; }
  .hud-btn { padding: 10px; }
  .legend { gap: 10px; font-size: .68rem; }
  .hint { white-space: normal; text-align: center; width: max-content; max-width: calc(100% - 32px); }
}
@media (max-width: 760px) and (max-height: 700px) { .legend { display: none; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>
<canvas id="scene" aria-label="Kitaplarla dolu bir kütüphane odası. Her üniversite bir kitap."></canvas>

<div class="hud">
  <div class="plate title-plate">
    <h1>Başvuru Kütüphanesi</h1>
    <div class="sub" id="subline">Yükleniyor…</div>
    <button class="next-up" id="nextUp" hidden></button>
  </div>
  <div class="hud-actions">
    <button class="plate hud-btn" id="soundBtn" aria-pressed="false" title="Şömine ve sayfa sesleri">
      <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11"/></svg><span class="txt">Ses</span>
    </button>

const DAY = 864e5;
const today = (() => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); })();

function parseTrDate(s) {
  if (!s) return null;

  const m = low.match(/(?:(\d{1,2})\s+)?(oca|şub|mar|nis|may|haz|tem|ağu|eyl|eki|kas|ara)[a-zçğıöşü]*(\s+ortası)?\s+(\d{4})/);

    date: new Date(+m[4], MONTHS.indexOf(m[2]), day),

}
const daysUntil = d => Math.round((d - today) / DAY);

const fmtLong = d => `${d.getDate()} ${MONTH_NAMES[d.getMonth()]} ${d.getFullYear()}`;
function inDays(n) {
  if (n === 0) return 'bugün';
  if (n === 1) return 'yarın';
  if (n < 0) return `${-n} gün önce`;
  if (n < 60) return `${n} gün sonra`;
  return `~${Math.round(n / 30)} ay sonra`;
}

function statusOf(u) {
  const o = parseTrDate(u.open), c = parseTrDate(u.close);
  const res = { open: o, close: c, kind: 'unknown', label: 'Tarih belirsiz', detail: '', progress: null };
  if (c && daysUntil(c.date) < 0) {
    Object.assign(res, { kind: 'closed', label: 'Kapandı', detail: `Başvurular ${fmtLong(c.date)} tarihinde kapandı.` });
  } else if (o && daysUntil(o.date) > 0) {
    const n = daysUntil(o.date);
    Object.assign(res, { kind: 'soon', label: n < 60 ? `${n} gün sonra açılıyor` : 'Henüz açılmadı', detail: `Başvurular ${o.exact ? fmtLong(o.date) : o.main} tarihinde açılıyor (${inDays(n)}).` });
  } else if (c) {

  }
  if (o && c) res.progress = Math.min(1, Math.max(0, (today - o.date) / (c.date - o.date)));
  return res;
}

function drawFlag(g, code, x, y, w, h) {

function drawLeather(g, w, h, color) {
  g.fillStyle = color; g.fillRect(0, 0, w, h);
  grain(g, w, h, Math.floor(w * h / 18), 0.12, 0.05);
}
function goldGradient(g, y0, y1) {
  const gr = g.createLinearGradient(0, y0, 0, y1);
  gr.addColorStop(0, '#fbe6a2'); gr.addColorStop(0.5, '#d9b25a'); gr.addColorStop(1, '#a87a2a');
  return gr;
}
function fitFont(g, text, weight, family, maxW, maxSize) {
  let size = maxSize;
  g.font = `${weight} ${size}px ${family}`;
  const m = g.measureText(text).width;
  if (m > maxW) size = Math.floor(size * maxW / m);
  g.font = `${weight} ${size}px ${family}`;
  return size;
}
function wrapLines(g, text, maxW) {
  const words = text.split(/\s+/); const lines = []; let line = '';
  for (const w of words) {
    const t = line ? line + ' ' + w : w;
    if (g.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t;
  }
  if (line) lines.push(line);
  return lines;
}
const DISPLAY = '"Cormorant Garamond", Georgia, serif';
const LABEL = '"Alegreya Sans SC", "Trebuchet MS", sans-serif';

function makeSpineTexture(u, th, h) {
  const W = 160, Hh = Math.round(W * h / th);
  return canvasTex(W, Hh, (g, w, hh) => {
    const col = leatherOf(u);
    drawLeather(g, w, hh, col);
    const sh = g.createLinearGradient(0, 0, w, 0);
    sh.addColorStop(0, 'rgba(0,0,0,.55)'); sh.addColorStop(.18, 'rgba(0,0,0,.05)'); sh.addColorStop(.45, 'rgba(255,240,210,.14)'); sh.addColorStop(.8, 'rgba(0,0,0,.08)'); sh.addColorStop(1, 'rgba(0,0,0,.5)');
    g.fillStyle = sh; g.fillRect(0, 0, w, hh);
    // kabartma bantlar
    const band = y => {
      const gb = g.createLinearGradient(0, y - 9, 0, y + 9);
      gb.addColorStop(0, 'rgba(0,0,0,.4)'); gb.addColorStop(.45, 'rgba(255,235,200,.22)'); gb.addColorStop(1, 'rgba(0,0,0,.45)');
      g.fillStyle = gb; g.fillRect(0, y - 9, w, 18);
      g.fillStyle = goldGradient(g, y - 14, y + 14); g.fillRect(0, y - 13, w, 2.5); g.fillRect(0, y + 11, w, 2.5);
    };
    [0.06, 0.12, 0.88, 0.94].forEach(k => band(hh * k));
    // etiket paneli
    const p0 = hh * 0.17, p1 = hh * 0.73;
    g.fillStyle = 'rgba(0,0,0,.28)'; g.fillRect(14, p0, w - 28, p1 - p0);
    g.strokeStyle = goldGradient(g, p0, p1); g.lineWidth = 3; g.strokeRect(18, p0 + 4, w - 36, p1 - p0 - 8);
    g.lineWidth = 1.2; g.strokeRect(25, p0 + 11, w - 50, p1 - p0 - 22);
    // ad (yukarıdan aşağıya)
    g.save(); g.translate(w / 2, (p0 + p1) / 2); g.rotate(Math.PI / 2);
    const maxLen = (p1 - p0) - 60;
    const size = fitFont(g, u.short, 700, DISPLAY, maxLen, 74);
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillStyle = 'rgba(0,0,0,.55)'; g.fillText(u.short, 2, 3);
    g.fillStyle = goldGradient(g, -size / 2, size / 2); g.fillText(u.short, 0, 0);
    g.restore();
    // bayrak ve QS
    drawFlag(g, u.code, w / 2 - 27, hh * 0.765, 54, 36);
    g.strokeStyle = 'rgba(240,214,142,.8)'; g.lineWidth = 2; g.strokeRect(w / 2 - 27, hh * 0.765, 54, 36);
    const q = parseQS(u.qs);
    if (q) {
      g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = goldGradient(g, hh * 0.82, hh * 0.86);
      g.font = `700 22px ${LABEL}`; g.fillText('QS', w / 2, hh * 0.818);
      fitFont(g, q.rank, 700, DISPLAY, w - 30, 40); g.fillText(q.rank, w / 2, hh * 0.848);
    }
    // üst süs
    g.fillStyle = goldGradient(g, hh * 0.08, hh * 0.1);
    g.save(); g.translate(w / 2, hh * 0.09); g.rotate(Math.PI / 4); g.fillRect(-7, -7, 14, 14); g.restore();
  });
}
function makeCoverTexture(u, d, h) {
  const W = 512, Hh = Math.round(W * h / d);
  return canvasTex(W, Hh, (g, w, hh) => {
    drawLeather(g, w, hh, leatherOf(u));
    const vg = g.createRadialGradient(w * 0.45, hh * 0.35, 40, w / 2, hh / 2, hh * 0.75);
    vg.addColorStop(0, 'rgba(255,235,200,.12)'); vg.addColorStop(1, 'rgba(0,0,0,.45)');
    g.fillStyle = vg; g.fillRect(0, 0, w, hh);
    g.strokeStyle = goldGradient(g, 0, hh); g.lineWidth = 5; g.strokeRect(26, 26, w - 52, hh - 52);
    g.lineWidth = 2; g.strokeRect(40, 40, w - 80, hh - 80);
    for (const [x, y] of [[40, 40], [w - 40, 40], [40, hh - 40], [w - 40, hh - 40]]) {
      g.fillStyle = goldGradient(g, y - 14, y + 14); g.save(); g.translate(x, y); g.rotate(Math.PI / 4); g.fillRect(-10, -10, 20, 20); g.restore();
    }
    g.textAlign = 'center'; g.textBaseline = 'alphabetic';
    drawFlag(g, u.code, w / 2 - 45, hh * 0.14, 90, 60);
    g.strokeStyle = 'rgba(240,214,142,.85)'; g.lineWidth = 2.5; g.strokeRect(w / 2 - 45, hh * 0.14, 90, 60);
    g.font = `600 50px ${DISPLAY}`;
    const lines = wrapLines(g, u.name, w - 130);
    let y = hh * 0.36;
    g.fillStyle = goldGradient(g, y - 50, y + lines.length * 56);
    for (const l of lines) { g.fillText(l, w / 2, y); y += 56; }
    g.fillRect(w / 2 - 60, y - 16, 120, 2);
    g.font = `italic 500 28px ${DISPLAY}`;
    y += 28;
    for (const l of wrapLines(g, u.program || '', w - 150).slice(0, 4)) { g.fillText(l, w / 2, y); y += 32; }
    g.font = `700 24px ${LABEL}`;
    g.fillText(`${u.city || ''}`.toLocaleUpperCase('tr'), w / 2, hh * 0.86);
    const q = parseQS(u.qs);
    if (q) { g.font = `600 30px ${DISPLAY}`; g.fillText(`QS 2027 · ${q.rank}`, w / 2, hh * 0.91); }
  });
}

const STATUS_COLORS = { urgent: 0xa3262f, open: 0x3b6e4a, soon: 0xb07f22, closed: 0x77706a };

function plaqueTexture(text, code) {
  return canvasTex(512, 96, (g, w, h) => {
    const gr = g.createLinearGradient(0, 0, 0, h);
    gr.addColorStop(0, '#e8c876'); gr.addColorStop(.5, '#b88c35'); gr.addColorStop(1, '#7d5a1c');
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
    g.strokeStyle = 'rgba(60,35,5,.7)'; g.lineWidth = 4; g.strokeRect(6, 6, w - 12, h - 12);
    if (code) { drawFlag(g, code, 24, h / 2 - 16, 48, 32); g.strokeStyle = 'rgba(60,35,5,.6)'; g.lineWidth = 2; g.strokeRect(24, h / 2 - 16, 48, 32); }
    g.font = `700 46px ${LABEL}`; g.textAlign = 'center'; g.textBaseline = 'middle';
    const x = code ? w / 2 + 30 : w / 2;
    fitFont(g, text, 700, LABEL, w - (code ? 140 : 60), 46);
    g.fillStyle = 'rgba(255,240,200,.45)'; g.fillText(text, x, h / 2 + 2);
    g.fillStyle = '#3a2508'; g.fillText(text, x, h / 2);
    for (const sx of [16, w - 16]) { g.fillStyle = '#6a4a14'; g.beginPath(); g.arc(sx, h / 2, 5, 0, 7); g.fill(); }
  });
}

function buildBookcase(cfg) {
  const group = new THREE.Group();
  group.position.set(...cfg.pos); group.rotation.y = cfg.rotY;
  scene.add(group);
  const { W, D, H: Hc } = BC;
  const add = (geo, mat, x, y, z) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); group.add(m); return m; };
  add(new THREE.BoxGeometry(W, Hc, 0.03), backPanelMat, 0, Hc / 2, 0.015);
  for (const sx of [-W / 2 - 0.05, W / 2 + 0.05]) add(new THREE.BoxGeometry(0.1, Hc + 0.05, D + 0.04), woodMat, sx, Hc / 2, D / 2);
  for (const dx of BAY_DIVIDERS) add(new THREE.BoxGeometry(0.05, Hc, D - 0.02), woodMat, dx, Hc / 2, D / 2 - 0.01);
  add(new THREE.BoxGeometry(W + 0.36, 0.12, D + 0.16), woodMat, 0, Hc + 0.06, D / 2 + 0.02);
  add(new THREE.BoxGeometry(W + 0.28, 0.08, D + 0.1), woodDarkMat, 0, Hc + 0.15, D / 2 + 0.01);
  add(new THREE.BoxGeometry(W + 0.2, 0.16, D + 0.06), woodDarkMat, 0, 0.08, D / 2 + 0.01);
  for (const y of SHELF_TOPS.slice(1).concat([Hc])) {
    add(new THREE.BoxGeometry(W, 0.035, D), woodMat, 0, y - 0.0175, D / 2);
  }
  for (const y of SHELF_TOPS) add(new THREE.BoxGeometry(W, 0.07, 0.025), woodMat, 0, y - 0.03, D + 0.0125);
  // pilastrlar
  for (const sx of [-W / 2 - 0.05, W / 2 + 0.05]) add(new THREE.BoxGeometry(0.16, Hc - 0.2, 0.04), woodDarkMat, sx, Hc / 2 + 0.05, D + 0.04);
  bookcases.push({ group, cfg });
  return group;
}

/* Ülkeleri duvarlara dağıt: en kalabalık ülke karşı duvara, diğerleri yükü dengeleyerek yanlara */
const byCountry = new Map();
for (const u of UNIS) { if (!byCountry.has(u.country)) byCountry.set(u.country, []); byCountry.get(u.country).push(u); }
const countriesSorted = [...byCountry.keys()].sort((a, b) => byCountry.get(b).length - byCountry.get(a).length || a.localeCompare(b, 'tr'));
const WALLS = [
  { name: 'front', pos: [0, 0, -R], rotY: 0, countries: [], load: 0 },
  { name: 'left', pos: [-R, 0, 0], rotY: Math.PI / 2, countries: [], load: 0 },
  { name: 'right', pos: [R, 0, 0], rotY: -Math.PI / 2, countries: [], load: 0 },
];
countriesSorted.forEach((c, i) => {
  const n = byCountry.get(c).length;
  const wall = i === 0 ? WALLS[0] : WALLS.slice(1).concat(WALLS[0].load < 6 ? [WALLS[0]] : []).sort((a, b) => a.load - b.load)[0];
  wall.countries.push(c); wall.load += n;
});
for (const w of WALLS) w.countries.sort((a, b) => a.localeCompare(b, 'tr'));

function layoutWall(wall) {
  const group = buildBookcase(wall);
  const books = wall.countries.flatMap(c => byCountry.get(c));
  const n = books.length;
  const k = Math.min(5, Math.max(1, Math.ceil(n / 4)));
  const rowsForBooks = [3, 2, 1, 4, 0].slice(0, k).sort((a, b) => b - a); // yukarıdan aşağı
  const perRow = rowsForBooks.map((_, i) => Math.floor(n / k) + (i < n % k ? 1 : 0));
  let bi = 0;
  const L = BC.W - 0.04;
  for (let row = 0; row < SHELF_TOPS.length; row++) {
    const ri = rowsForBooks.indexOf(row);
    const rowBooks = ri >= 0 ? books.slice(bi, bi += perRow[ri]) : [];
    const y0 = SHELF_TOPS[row];
    const maxH = (row < SHELF_TOPS.length - 1 ? SHELF_TOPS[row + 1] - 0.035 : BC.H) - y0 - 0.025;
    // dizilim: dolgu kitaplar + (üniversite kitabı, 1-3 dolgu)… ülke değişiminde kitap desteği boşluğu
    const items = [];
    let prevCountry = null;
    rowBooks.forEach((u, i) => {
      if (prevCountry && prevCountry !== u.country) {
        // ülke levhaları çakışmasın diye gruplar arasında yeterli boşluk bırak
        items.push({ gap: 0.06 });
        let sep = 0.06; while (sep < 0.42) { const f = { filler: true, th: rr(0.032, 0.075) }; sep += f.th; items.push(f); }
      }
      items.push({ uni: u });
      const nextSame = rowBooks[i + 1] && rowBooks[i + 1].country === u.country;
      if (nextSame) for (let f = 0, m = 1 + Math.floor(rand() * 3); f < m; f++) items.push({ filler: true });
      prevCountry = u.country;
    });
    const sizeOf = it => it.gap ? it.gap : it.uni ? (it.th ??= rr(0.115, 0.14)) : (it.th ??= rr(0.032, 0.075));
    const coreW = items.reduce((s, it) => s + sizeOf(it), 0);
    const left = [], right = [];
    let lw = 0, rw = 0; const side = (L - coreW) / 2;
    while (lw < side - 0.08) { const it = { filler: true }; lw += sizeOf(it); left.push(it); }
    while (rw < side - 0.08) { const it = { filler: true }; rw += sizeOf(it); right.push(it); }
    // ara sıra yatay kitap yığını
    if (rand() < 0.55) left.splice(Math.floor(rand() * Math.min(6, left.length)), 3, { stack: true, th: 0.3 });
    if (rand() < 0.45) right.splice(Math.max(0, right.length - 1 - Math.floor(rand() * 5)), 3, { stack: true, th: 0.3 });
    const all = [...left, ...items, ...right];
    const total = all.reduce((s, it) => s + sizeOf(it), 0);
    let x = -L / 2 + Math.max(0.01, (L - total) / 2);
    const runs = [];
    for (const it of all) {
      const w = sizeOf(it);
      // bölme duvarına çarpma
      for (const dx of BAY_DIVIDERS) if (x < dx + 0.03 && x + w > dx - 0.03) x = dx + 0.03;
      if (x + w > L / 2) break;
      const cx = x + w / 2;
      if (it.filler) {
        const hgt = Math.min(maxH, rr(0.3, 0.46)), d = rr(0.24, 0.33);
        let lean = 0;
        fillers.push({ group, x: cx, y: y0 + hgt / 2, z: BC.D - 0.035 - d / 2, rotZ: lean, size: [w * 0.97, hgt, d], color: pick(FILLER_COLORS) });
      } else if (it.stack) {
        let yy = y0;
        for (let s = 0; s < 3; s++) {
          const t = rr(0.04, 0.07), len = rr(0.26, 0.3), d = rr(0.22, 0.3);
          fillers.push({ group, x: cx + rr(-0.015, 0.015), y: yy + t / 2, z: BC.D - 0.04 - d / 2, rotZ: Math.PI / 2, size: [t, len, d], color: pick(FILLER_COLORS) });
          yy += t;
        }
      } else if (it.uni) {
        const hgt = Math.min(maxH, rr(0.48, 0.52)), d = rr(0.32, 0.35);
        const mesh = makeUniBook(it.uni, w * 0.97, hgt, d);
        mesh.position.set(cx, y0 + hgt / 2, BC.D - 0.03 - d / 2);
        group.add(mesh);
        mesh.userData.home = { parent: group, pos: mesh.position.clone(), quat: mesh.quaternion.clone() };
        const last = runs[runs.length - 1];
        if (last && last.country === it.uni.country) { last.x1 = cx; } else runs.push({ country: it.uni.country, code: it.uni.code, x0: cx, x1: cx });
      }
      x += w;
    }
    for (const r of runs) {
      const p = new THREE.Mesh(new THREE.PlaneGeometry(0.5, 0.094), new THREE.MeshStandardMaterial({ map: plaqueTexture(r.country.toLocaleUpperCase('tr'), r.code), metalness: 0.6, roughness: 0.38 }));
      p.position.set((r.x0 + r.x1) / 2, y0 - 0.03, BC.D + 0.027);
      group.add(p);
    }
  }
}

function makeUniBook(u, th, h, d) {
  const leather = leatherOf(u);
  const plain = new THREE.MeshStandardMaterial({ color: new THREE.Color(leather).multiplyScalar(0.85), roughness: 0.55 });
  const pages = new THREE.MeshStandardMaterial({ map: pagesTex, color: 0xeadcb8, roughness: 0.9 });
  const spine = new THREE.MeshStandardMaterial({ map: makeSpineTexture(u, th, h), roughness: 0.42, metalness: 0.08, emissive: 0xffc56a, emissiveIntensity: 0 });
  const cover = new THREE.MeshStandardMaterial({ map: makeCoverTexture(u, d, h), roughness: 0.45, metalness: 0.06 });
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(th, h, d), [cover, plain, pages, pages, spine, pages]);
  mesh.userData.uni = u;
  mesh.userData.spine = spine;
  mesh.userData.hover = 0; mesh.userData.pull = 0;
  u.mesh = mesh;
  // durum sekmesi (kitabın üstünden çıkan küçük kâğıt)
  const sc = STATUS_COLORS[u.status.kind];
  if (sc) {
    const tab = new THREE.Mesh(new THREE.BoxGeometry(th * 0.5, 0.07, 0.004), new THREE.MeshStandardMaterial({ color: sc, roughness: 0.8, emissive: sc, emissiveIntensity: 0.25 }));
    tab.position.set(0, h / 2 + 0.02, d / 2 - 0.05);
    mesh.add(tab);
  }
  uniBooks.push(mesh);
  return mesh;
}

const fire = { light: null, mats: [], embers: null };
function buildFireplace() {
  const g = new THREE.Group(); g.position.set(0, 0, R); g.rotation.y = Math.PI; scene.add(g);
  const stoneTex = canvasTex(512, 512, (c, w, h) => {
    c.fillStyle = '#4a4440'; c.fillRect(0, 0, w, h);
    let y = 0; while (y < h) { const bh = rr(50, 80); let x = -rr(0, 60); while (x < w) { const bw = rr(80, 150); c.fillStyle = shade('#6b625a', rr(0.7, 1.15)); c.fillRect(x + 3, y + 3, bw - 6, bh - 6); x += bw; } y += bh; }
    grain(c, w, h, 12000, 0.2, 0.05);
  }, { repeat: [1, 1] });
  const stone = new THREE.MeshStandardMaterial({ map: stoneTex, roughness: 0.95 });
  const add = (geo, mat, x, y, z) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); g.add(m); return m; };
  add(new THREE.BoxGeometry(0.42, 1.36, 0.46), stone, -1.02, 0.68, 0.23);
  add(new THREE.BoxGeometry(0.42, 1.36, 0.46), stone, 1.02, 0.68, 0.23);
  add(new THREE.BoxGeometry(2.46, 0.3, 0.48), stone, 0, 1.36 + 0.15, 0.24);
  add(new THREE.BoxGeometry(2.8, 0.09, 0.62), woodMat, 0, 1.7, 0.28);
  add(new THREE.BoxGeometry(1.64, 1.36, 0.04), new THREE.MeshStandardMaterial({ color: 0x0c0907, roughness: 1 }), 0, 0.68, 0.02);
  add(new THREE.BoxGeometry(2.9, 0.06, 0.9), stone, 0, 0.03, 0.42);
  const logMat = new THREE.MeshStandardMaterial({ color: 0x2b1a10, roughness: 1, emissive: 0x501800, emissiveIntensity: 0.6 });
  for (const [x, rz, ry] of [[-0.18, 0.08, 0.3], [0.2, -0.06, -0.25], [0, 0, 0]]) {
    const log = add(new THREE.CylinderGeometry(0.07, 0.08, 0.95, 10), logMat, x * 0.6, 0.13 + (x === 0 ? 0.11 : 0), 0.22);
    log.rotation.set(0, ry, Math.PI / 2 + rz);
  }
  const flameMat = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 }, uSeed: { value: 0 } },
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
    vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader: `
      varying vec2 vUv; uniform float uTime; uniform float uSeed;
      float h(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7))+uSeed)*43758.5453); }
      float n(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
        return mix(mix(h(i),h(i+vec2(1,0)),f.x), mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x), f.y); }
      float fbm(vec2 p){ float v=0.0, a=0.5; for(int i=0;i<5;i++){ v+=a*n(p); p*=2.03; a*=0.5; } return v; }
      void main(){
        vec2 uv=vUv; float t=uTime;
        float noise = fbm(vec2(uv.x*4.0, uv.y*3.0 - t*2.2));
        float x = abs(uv.x-0.5 + (noise-0.5)*0.35*uv.y);
        float width = 0.42*(1.0-uv.y*0.85);
        float body = smoothstep(width, width*0.2, x);
        float f = body * (noise*1.25 + 0.15) * (1.15-uv.y) * 1.9 - uv.y*0.55;

const raycaster = new THREE.Raycaster();

const tweens = [];
const ease = { out: t => 1 - Math.pow(1 - t, 3), inOut: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2 };
function tween(dur, update, done, fn = ease.inOut) {

const pointers = new Map();
let drag = null, pinchStart = null;
canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()]; pinchStart = { d: Math.hypot(a.x - b.x, a.y - b.y), zoom: view.zoom }; drag = null; return;
  }
  drag = { x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY, moved: 0, t: performance.now(), type: e.pointerType };
});
canvas.addEventListener('pointermove', e => {
  if (pointers.has(e.pointerId)) pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinchStart && pointers.size === 2) {
    const [a, b] = [...pointers.values()]; const d = Math.hypot(a.x - b.x, a.y - b.y);
    view.zoom = THREE.MathUtils.clamp(pinchStart.zoom * d / pinchStart.d, 1, 2.4); return;
  }
  if (drag && state === 'idle') {
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    drag.moved += Math.abs(dx) + Math.abs(dy);
    drag.x = e.clientX; drag.y = e.clientY;
    if (drag.moved > 6) {
      canvas.classList.add('dragging');
      const k = 0.0042 / view.zoom;
      view.vyaw = dx * k; view.vpitch = dy * k;
      view.yaw += dx * k; view.pitch = THREE.MathUtils.clamp(view.pitch + dy * k, -0.75, 0.6);
      dismissHint(); setHover(null);
    }
    return;
  }
  if (e.pointerType === 'mouse' && state === 'idle') updateHover(e.clientX, e.clientY);
});
function endPointer(e) {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinchStart = null;
  canvas.classList.remove('dragging');
  if (drag && drag.moved <= 6 && state === 'idle' && e.type === 'pointerup') {
    const hit = pickBook(e.clientX, e.clientY);
    if (hit) { dismissHint(); openBook(hit); }
  } else if (drag) { view.inertia = true; }
  drag = null;
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('pointerleave', () => { if (!drag) setHover(null); });
canvas.addEventListener('wheel', e => { e.preventDefault(); if (state !== 'idle') return; view.zoom = THREE.MathUtils.clamp(view.zoom * Math.exp(-e.deltaY * 0.0012), 1, 2.4); }, { passive: false });

  if (state === 'reading') {

    if (e.key === 'ArrowRight') navBook(1);

  }
  if (e.key === 'Escape' && drawer.classList.contains('open')) { toggleDrawer(false); return; }
  if (state !== 'idle' || e.target.closest('input, button, aside')) return;
  if (e.key === 'ArrowLeft') view.vyaw = 0.03, view.inertia = true;
  if (e.key === 'ArrowRight') view.vyaw = -0.03, view.inertia = true;
});

function pickBook(x, y) {

  return hits.length ? hits[0].object : null;

/* ---- Kamera yönlendirme ---- */
const tmpV = new THREE.Vector3();
function angleTo(book) {
  book.getWorldPosition(tmpV);
  const dx = tmpV.x - camera.position.x, dy = tmpV.y - camera.position.y, dz = tmpV.z - camera.position.z;
  return { yaw: Math.atan2(-dx, -dz), pitch: Math.atan2(dy, Math.hypot(dx, dz)) };
}
function shortestYaw(from, to) { let d = to - from; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return from + d; }
function faceBook(book, instant, done) {
  const a = angleTo(book);
  const y0 = view.yaw, p0 = view.pitch, y1 = shortestYaw(y0, a.yaw), p1 = THREE.MathUtils.clamp(a.pitch * 0.85, -0.6, 0.5);
  const z0 = view.zoom;
  view.vyaw = view.vpitch = 0; view.inertia = false;
  if (instant) { view.yaw = y1; view.pitch = p1; view.zoom = 1; done && done(); return; }
  tween(0.9, k => { view.yaw = y0 + (y1 - y0) * k; view.pitch = p0 + (p1 - p0) * k; view.zoom = z0 + (1 - z0) * k; }, done);
}

const fwd = new THREE.Vector3(), up = new THREE.Vector3();
function frontPose() {
  camera.updateMatrixWorld();
  camera.getWorldDirection(fwd);
  const dist = innerWidth / innerHeight < 0.8 ? 0.95 : 0.78;
  const pos = camera.position.clone().addScaledVector(fwd, dist);
  const x = fwd.clone().negate();
  up.set(0, 1, 0).applyQuaternion(camera.quaternion);
  const z = new THREE.Vector3().crossVectors(x, up).normalize();
  const y = new THREE.Vector3().crossVectors(z, x).normalize();
  const quat = new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().makeBasis(x, y, z));
  return { pos, quat };
}
function homeWorld(book) {
  const { parent, pos, quat } = book.userData.home;
  parent.updateMatrixWorld();
  const pulled = pos.clone(); pulled.z += 0.38;
  const wp = pulled.applyMatrix4(parent.matrixWorld);
  const wq = parent.getWorldQuaternion(new THREE.Quaternion()).multiply(quat);
  const hp = pos.clone().applyMatrix4(parent.matrixWorld);
  return { pulled: wp, home: hp, quat: wq };
}
function openBook(book) {
  if (state !== 'idle') return;
  state = 'flying'; activeBook = book; setHover(null); toggleDrawer(false);
  Sound.thud();
  const hw = homeWorld(book);
  scene.attach(book);
  const p0 = book.position.clone(), q0 = book.quaternion.clone();
  book.userData.pull = 0;
  tween(0.32, k => { book.position.lerpVectors(p0, hw.pulled, k); }, () => {
    const fp = frontPose();
    const p1 = book.position.clone(), q1 = book.quaternion.clone();
    const mid = p1.clone().lerp(fp.pos, 0.5); mid.y += 0.25;
    Sound.swish(0.5, 900, 2400, 0.2);
    tween(0.8, k => {
      const a = p1.clone().lerp(mid, k), b = mid.clone().lerp(fp.pos, k);
      book.position.lerpVectors(a, b, k);
      book.quaternion.slerpQuaternions(q1, fp.quat, k);
    }, () => { showReader(book.userData.uni); });
  }, ease.out);
}
function returnBook(book, instant, done) {
  const hw = homeWorld(book);
  const finish = () => { book.userData.home.parent.attach(book); book.position.copy(book.userData.home.pos); book.quaternion.copy(book.userData.home.quat); done && done(); };
  if (instant) { finish(); return; }
  const p0 = book.position.clone(), q0 = book.quaternion.clone();
  const mid = p0.clone().lerp(hw.pulled, 0.5); mid.y += 0.2;
  tween(0.75, k => {
    const a = p0.clone().lerp(mid, k), b = mid.clone().lerp(hw.pulled, k);
    book.position.lerpVectors(a, b, k); book.quaternion.slerpQuaternions(q0, hw.quat, k);
  }, () => {
    tween(0.28, k => book.position.lerpVectors(hw.pulled, hw.home, k), () => { Sound.thud(); finish(); }, ease.out);
  });
}

/* ---- Okuma ekranı ---- */
const reader = document.getElementById('reader');
const FLEURON = `<svg class="fleuron" viewBox="0 0 140 16" aria-hidden="true"><path d="M2 8h50M88 8h50" stroke="currentColor" stroke-width="1.2"/><path d="M70 2c-5 0-8 3-8 6s3 6 8 6 8-3 8-6-3-6-8-6zM56 8l6-3v6zM84 8l-6-3v6z" fill="currentColor"/></svg>`;
let readerIdx = 0;
function todoKey(u, i) { return `kutuphane.todo.${u.name}|${u.program}|${i}`; }
function readTodo(u, i) { try { return localStorage.getItem(todoKey(u, i)) === '1'; } catch { return false; } }
function writeTodo(u, i, v) { try { v ? localStorage.setItem(todoKey(u, i), '1') : localStorage.removeItem(todoKey(u, i)); } catch {} }

function pageHTML(u) {
  const idx = UNIS.indexOf(u);
  const q = parseQS(u.qs);
  const st = u.status;
  const o = st.open, c = st.close;
  const dateCell = (lbl, d, raw) => `<div><small>${lbl}</small>${d ? `<b>${d.exact ? fmtLong(d.date) : esc(d.main)}</b>${d.extra ? `<em>${esc(d.extra)}</em>` : ''}` : raw ? `<b>${esc(raw)}</b>` : `<b class="missing">Belirtilmemiş</b>`}</div>`;
  let bar = '';
  if (st.progress !== null) {
    const pct = (st.progress * 100).toFixed(1);
    bar = `<div class="tl-bar"><div class="tl-fill" style="width:${pct}%"></div>${st.progress > 0 && st.progress < 1 ? `<div class="tl-today" style="left:calc(${pct}% - 1px)"></div>` : ''}</div>`;
  } else bar = `<div class="tl-bar"></div>`;
  const todos = u.todoItems || [];
  const isNone = todos.length === 1 && /^yok\b/i.test(todos[0]);
  const done = todos.filter((_, i) => readTodo(u, i)).length;
  const todoHTML = !todos.length ? `<p class="missing">Bu kitapta henüz not yok.</p>`
    : isNone ? `<p class="todo-none">✓ ${esc(todos[0])}</p>`
    : `<ul class="todo">${todos.map((t, i) => `<li><label><input type="checkbox" id="todo-${idx}-${i}" data-i="${i}" ${readTodo(u, i) ? 'checked' : ''}><span>${esc(t)}</span></label></li>`).join('')}</ul>`;
  const tieNote = q ? [q.tied ? 'Başka bir üniversiteyle eşit sırada.' : '', q.notes.length ? `Sıralamada ${esc(q.notes.join(', '))} olarak geçiyor.` : ''].filter(Boolean).join(' ') : '';
  return {
    left: `
      <div class="eyebrow"><span>EX LIBRIS</span><span>KİTAP ${idx + 1} / ${UNIS.length}</span></div>
      <div class="place">${flagSVG(u.code)}<span>${esc(u.country.toLocaleUpperCase('tr'))} · ${esc((u.city || '').toLocaleUpperCase('tr'))}</span></div>
      <h2 class="uni-name" id="uniName">${esc(u.name)}</h2>
      ${u.program ? `<p class="program">${esc(u.program)}</p>` : ''}
      ${FLEURON}
      <dl class="facts">
        <div><dt>ÜLKE</dt><dd>${esc(u.country)}</dd></div>
        <div><dt>ŞEHİR</dt><dd>${esc(u.city || '—')}</dd></div>
      </dl>
      <div class="qs-block">
        <div class="qs-seal"><div><small>QS 2027</small><b>${q ? esc(q.rank) : '—'}</b></div></div>
        <div class="qs-text"><strong>DÜNYA SIRALAMASI</strong>${q ? (tieNote || 'QS World University Rankings 2027.') : 'Tabloda sıralama yok.'}</div>
      </div>
      <span class="folio">${(idx + 1) * 2 - 1}</span>`,
    right: `
      <section class="section">
        <h3 class="section-h"><span>YILLIK ÜCRET · AB DIŞI</span></h3>
        ${u.fee ? `<div class="fee">${esc(u.fee)}</div>` : `<p class="missing">Tabloda henüz yazılı değil.</p>`}
      </section>
      <section class="section">
        <h3 class="section-h"><span>BAŞVURU TAKVİMİ</span></h3>
        <div class="timeline">
          <div class="tl-ends">${dateCell('AÇILIŞ', o, u.open)}${dateCell('KAPANIŞ', c, u.close)}</div>
          ${bar}
        </div>
        <div class="status-line"><span class="chip ${st.kind}">${esc(st.label.toLocaleUpperCase('tr'))}</span><span>${esc(st.detail)}</span></div>
      </section>
      <section class="section">
        <h3 class="section-h"><span>EKSİKLERİM</span>${todos.length && !isNone ? `<span class="todo-count" id="todoCount">${done} / ${todos.length}</span>` : ''}</h3>
        ${todoHTML}
      </section>
      <span class="folio">${(idx + 1) * 2}</span>`,
  };
}
function showReader(u) {
  state = 'reading';
  activeBook.visible = false;
  readerIdx = UNIS.indexOf(u);
  const p = pageHTML(u);
  reader.innerHTML = `
    <div class="reader-backdrop" data-close></div>
    <div class="tome">
      <div class="spread"><article class="page left">${p.left}</article><article class="page right">${p.right}</article></div>
      <div class="cover-flap" style="--cover:${leatherOf(u)}"><div class="face front"><h3>${esc(u.name)}</h3></div><div class="face back"></div></div>
      <button class="plate reader-close icon-btn" data-close aria-label="Kitabı kapat"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <div class="reader-nav">
        <button class="plate hud-btn" data-nav="-1" aria-label="Önceki kitap"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg><span class="txt">Önceki</span></button>
        <button class="plate hud-btn" data-close><span>Rafa koy</span></button>
        <button class="plate hud-btn" data-nav="1" aria-label="Sonraki kitap"><span class="txt">Sonraki</span><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
      </div>
    </div>`;
  reader.hidden = false;
  Sound.swish(0.45, 2600, 700, 0.3);
  reader.querySelector('.reader-close').focus({ preventScroll: true });
}
reader.addEventListener('click', e => {
  if (e.target.closest('[data-close]')) closeBook();
  const nav = e.target.closest('[data-nav]'); if (nav) navBook(+nav.dataset.nav);
});
reader.addEventListener('change', e => {
  const cb = e.target.closest('input[type=checkbox][data-i]'); if (!cb) return;
  const u = UNIS[readerIdx]; writeTodo(u, +cb.dataset.i, cb.checked);
  const cnt = document.getElementById('todoCount');
  if (cnt) cnt.textContent = `${(u.todoItems || []).filter((_, i) => readTodo(u, i)).length} / ${u.todoItems.length}`;
});
let navBusy = false;
function navBook(dir) {
  if (state !== 'reading' || navBusy) return;
  navBusy = true;
  const nextIdx = (readerIdx + dir + UNIS.length) % UNIS.length;
  const u = UNIS[nextIdx];
  const leaf = document.createElement('div'); leaf.className = 'leaf ' + (dir > 0 ? 'fwd' : 'back');
  reader.querySelector('.tome').appendChild(leaf);
  Sound.swish(0.35, 3000, 1100, 0.28);
  // 3D tarafta: eski kitabı yerine koy, yenisini kameranın önüne al
  returnBook(activeBook, true); activeBook.visible = true;
  activeBook = u.mesh; faceBook(activeBook, true); camera.rotation.set(view.pitch, view.yaw, 0);
  scene.attach(activeBook); const fp = frontPose(); activeBook.position.copy(fp.pos); activeBook.quaternion.copy(fp.quat); activeBook.visible = false;
  setTimeout(() => {
    readerIdx = nextIdx;
    const p = pageHTML(u);
    reader.querySelector('.page.left').innerHTML = p.left;
    reader.querySelector('.page.right').innerHTML = p.right;
    reader.querySelectorAll('.page').forEach(pg => pg.scrollTop = 0);
    reader.querySelector('.spread').scrollTop = 0;
  }, reduceMotion ? 0 : 300);
  setTimeout(() => { leaf.remove(); navBusy = false; }, reduceMotion ? 0 : 620);
}
function closeBook() {
  if (state !== 'reading') return;
  state = 'returning';
  reader.classList.add('closing');
  Sound.swish(0.3, 1200, 500, 0.25);
  setTimeout(() => {
    reader.hidden = true; reader.classList.remove('closing'); reader.innerHTML = '';
    const book = activeBook; book.visible = true;
    // kamera yönü kitaba bakıyor değilse önce kitabı rafının önüne çevir
    returnBook(book, false, () => { state = 'idle'; activeBook = null; });
  }, reduceMotion ? 0 : 340);
}

/* ---- Katalog ---- */
const drawer = document.getElementById('drawer');
const catalogBtn = document.getElementById('catalogBtn');
const catalogList = document.getElementById('catalogList');
const search = document.getElementById('search');
function toggleDrawer(open) {
  open = open ?? !drawer.classList.contains('open');
  drawer.classList.toggle('open', open);
  drawer.inert = !open;
  catalogBtn.setAttribute('aria-expanded', String(open));
  if (open) setTimeout(() => search.focus({ preventScroll: true }), 300);
}
catalogBtn.addEventListener('click', () => toggleDrawer());
document.getElementById('drawerClose').addEventListener('click', () => toggleDrawer(false));

function upcomingEvents() {
  const ev = [];
  for (const u of UNIS) {
    const { open: o, close: c } = u.status;
    if (o && daysUntil(o.date) >= 0) ev.push({ u, d: o.date, what: 'açılıyor', exact: o.exact, raw: o.main });
    if (c && daysUntil(c.date) >= 0) ev.push({ u, d: c.date, what: 'kapanıyor', exact: c.exact, raw: c.main });
  }
  return ev.sort((a, b) => a.d - b.d);
}
function renderCatalog() {
  const q = search.value.trim().toLocaleLowerCase('tr');
  const match = u => !q || [u.name, u.short, u.country, u.city, u.program].some(s => (s || '').toLocaleLowerCase('tr').includes(q));
  let html = '';
  if (!q) {
    const ev = upcomingEvents().slice(0, 6);
    if (ev.length) html += `<div class="agenda"><h3>YAKLAŞAN TARİHLER</h3><ol>${ev.map(e => `<li><button data-open="${UNIS.indexOf(e.u)}"><span class="d">${e.exact ? '' : '~'}${fmtShort(e.d)}</span><span>${esc(e.u.short)} ${e.what}</span><span class="left">${esc(inDays(daysUntil(e.d)))}</span></button></li>`).join('')}</ol></div>`;
  }
  let any = false;
  for (const c of [...byCountry.keys()].sort((a, b) => a.localeCompare(b, 'tr'))) {
    const list = byCountry.get(c).filter(match);
    if (!list.length) continue; any = true;
    html += `<div class="cat-group"><h3>${flagSVG(list[0].code)} ${esc(c.toLocaleUpperCase('tr'))}</h3>${list.map(u => {
      const qq = parseQS(u.qs);
      return `<button class="cat-item" data-open="${UNIS.indexOf(u)}"><span class="n">${esc(u.name)}</span><span class="qs">${qq ? 'QS ' + esc(qq.rank) : ''}</span><span class="p">${esc(u.program || '')}</span><span class="chip ${u.status.kind}">${esc(u.status.label.toLocaleUpperCase('tr'))}</span></button>`;
    }).join('')}</div>`;
  }
  if (!any) html += `<p class="empty-search">“${esc(search.value)}” ile eşleşen kitap yok.</p>`;
  catalogList.innerHTML = html;
}
search.addEventListener('input', renderCatalog);
function goToBook(i) {
  const u = UNIS[i]; if (!u || !u.mesh) return;
  if (state === 'reading') { // okurken başka kitap seçilirse doğrudan oraya geç
    toggleDrawer(false); navTo(i); return;
  }
  if (state !== 'idle') return;
  toggleDrawer(false); dismissHint();
  state = 'turning';
  faceBook(u.mesh, false, () => { state = 'idle'; setTimeout(() => openBook(u.mesh), 120); });
}
function navTo(i) { const d = i - readerIdx; if (d) { readerIdx = i - Math.sign(d); navBook(Math.sign(d)); } }
catalogList.addEventListener('click', e => { const b = e.target.closest('[data-open]'); if (b) goToBook(+b.dataset.open); });

/* ---- HUD üst satır ---- */
function renderHud() {
  document.getElementById('subline').textContent = `${UNIS.length} KİTAP · ${byCountry.size} ÜLKE · ${fmtLong(today).toLocaleUpperCase('tr')}`;
  const ev = upcomingEvents()[0];
  const nu = document.getElementById('nextUp');
  if (ev) {
    const n = daysUntil(ev.d);
    nu.innerHTML = `<span class="lbl">SIRADAKİ TARİH</span><b>${esc(ev.u.short)}</b> ${ev.what} · ${ev.exact ? '' : '~'}${fmtShort(ev.d)} (${esc(inDays(n))})`;
    nu.hidden = false;
    nu.onclick = () => goToBook(UNIS.indexOf(ev.u));
  }
}

/* =========================================================================
   DÖNGÜ
   ========================================================================= */
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.userData.baseFov = w / h < 0.8 ? 74 : w / h < 1.2 ? 66 : 58;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);

const clock = new THREE.Clock();
let introT = 0;
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  for (let i = tweens.length - 1; i >= 0; i--) {
    const tw = tweens[i]; tw.t += dt; const k = Math.min(1, tw.t / tw.dur);
    tw.update(tw.fn(k));
    if (k >= 1) { tweens.splice(i, 1); tw.done && tw.done(); }
  }
  if (view.inertia && !drag && state === 'idle') {
    view.yaw += view.vyaw; view.pitch = THREE.MathUtils.clamp(view.pitch + view.vpitch, -0.75, 0.6);
    view.vyaw *= 0.92; view.vpitch *= 0.92;
    if (Math.abs(view.vyaw) + Math.abs(view.vpitch) < 1e-4) view.inertia = false;
  }
  if (state === 'intro') {
    introT += dt;
    renderer.toneMappingExposure = Math.min(1.05, introT / 2.2 * 1.05);
    view.yaw = Math.sin(Math.min(1, introT / 3) * Math.PI) * 0.0 + (1 - ease.out(Math.min(1, introT / 3))) * 0.35;
  }
  camera.fov = (camera.userData.baseFov || 58) / view.zoom;
  camera.updateProjectionMatrix();
  camera.rotation.set(view.pitch, view.yaw, 0);

  // kitapların hover/parlama animasyonu
  for (const b of uniBooks) {
    if (b === activeBook && state !== 'idle') continue;
    const target = b === hovered ? 1 : 0;
    b.userData.hover += (target - b.userData.hover) * Math.min(1, dt * 10);
    if (b.parent !== scene) b.position.z = b.userData.home.pos.z + b.userData.hover * 0.08;
    const shimmer = Math.max(0, Math.sin(t * 0.9 - b.userData.uni.id * 0.55)) ** 18 * 0.25;
    b.userData.spine.emissiveIntensity = b.userData.hover * 0.22 + shimmer;
  }
  // ateş
  const flick = 0.85 + Math.sin(t * 13.1) * 0.06 + Math.sin(t * 7.3 + 1.2) * 0.08 + (Math.random() - 0.5) * 0.12;
  if (fire.light) fire.light.intensity = 7 * flick;
  for (const m of fire.mats) m.uniforms.uTime.value = t;
  if (fire.embers) {
    const { pts, life, N, seedX } = fire.embers; const a = pts.geometry.attributes.position.array;
    for (let i = 0; i < N; i++) {
      life[i] += dt * (0.35 + (i % 5) * 0.06); if (life[i] > 1) { life[i] = 0; seedX[i] = rr(-0.4, 0.4); }
      a[i * 3] = seedX[i] + Math.sin(t * 2 + i) * 0.05 * life[i]; a[i * 3 + 1] = 0.25 + life[i] * 1.0; a[i * 3 + 2] = 0.25 + Math.sin(i) * 0.08;
    }
    pts.geometry.attributes.position.needsUpdate = true;
  }
  const cf = 1 + Math.sin(t * 17 + 2) * 0.05 + (Math.random() - 0.5) * 0.06;
  if (lights.chandelier) lights.chandelier.intensity = 9 * (0.97 + Math.sin(t * 5.1) * 0.02 + (Math.random() - .5) * 0.02);
  if (lights.table) { lights.table.intensity = 1.2 * cf; lights.tableFlame.scale.set(1, 2 * cf, 1); }
  if (fire.candles) fire.candles.forEach((c, i) => c.scale.y = 1.8 + Math.sin(t * 11 + i * 3) * 0.15);
  if (dust.pts) {
    dust.pts.rotation.y = t * 0.006;
    dust.pts.position.y = Math.sin(t * 0.2) * 0.05;
  }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

/* =========================================================================
   BAŞLAT
   ========================================================================= */
async function start() {
  try {
    await Promise.race([
      Promise.all([
        document.fonts.load(`700 48px "Cormorant Garamond"`),
        document.fonts.load(`600 48px "Cormorant Garamond"`),
        document.fonts.load(`italic 500 28px "Cormorant Garamond"`),
        document.fonts.load(`700 22px "Alegreya Sans SC"`),
      ]),
      new Promise(r => setTimeout(r, 3000)),
    ]);
  } catch {}
  resize();
  WALLS.forEach(layoutWall);
  buildFillers();
  buildFireplace();
  buildFurniture();
  buildDust();
  renderHud();
  renderCatalog();
  document.getElementById('loadingText').textContent = UNIS.length ? 'İÇERİ BUYUR' : 'data.js bulunamadı: önce tools/excel_to_data.py çalıştır.';
  frame();
  if (!UNIS.length) return;
  const intro = document.getElementById('intro');
  const enter = () => { if (state !== 'intro') return; intro.classList.add('gone'); state = 'idle'; renderer.toneMappingExposure = 1.05; };
  intro.addEventListener('click', enter);
  setTimeout(enter, reduceMotion ? 300 : 2400);
  setTimeout(dismissHint, 14000);
  window.__library = { UNIS, openBook, goToBook, state: () => state };
}
start();
</script>
